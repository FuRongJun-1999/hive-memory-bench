notes: 逐章含义题（底稿第 14 章）。本章的作用是**把三条禁忌从背景推到台前**：它们此前零散出现（第2章的宪法、第4章的私有制、第6章的永生），到本章才被并列成一组要警惕的东西，而下一章就给出为什么。
