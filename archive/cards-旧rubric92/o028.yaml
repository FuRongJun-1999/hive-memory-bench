question: 第十四章「暗流涌动」这一章在讲什么？它为什么把三个词并列起来？
rubric:
- id: p1
  point: 主角看破自由派的新手法并通过指南上报：他发现自由派通过沉浸式游戏在对公民进行诱导，并判断这条信息很重要
  required: true
  any_of:
  - 诱导
  - 沉浸式游戏
  - 're: (自由派).{0,16}(沉浸式游戏|诱导)'
- id: p2
  point: 机构的反应：判定属于这种情况为高度潜在威胁，需要他协助排除；随后秦熙发出实时通信邀请
  required: true
  any_of:
  - 高度潜在威胁
  - 实时通信
  - 're: (警戒检查中心|机构).{0,14}(反应|判定|协助)'
- id: p3
  point: 三个词第一次被并列着要求警惕：永生、私有制、绝对自由——一旦他出现异常情绪波动、对蜂巢社会的无故否定，或突然对它们产生向往，须直接报告
  required: true
  any_of:
  - 永生
  - 私有制
  - 绝对自由
  - 异常情绪
  - 're: (三个词|三项).{0,12}(警惕|报告)'
- id: p4
  point: 主角的隐瞒被写实：他回避了原神游戏和自己的具体经历——神经认证能确保难以传递虚假信息，但可以选择性地说部分真相
  required: true
  any_of:
  - 选择性
  - 部分真相
  - 隐瞒
  - 're: (回避|隐瞒).{0,14}(游戏|经历)'
- id: p5
  point: 落点：他反复低语这三个词，追问自由派究竟想做什么、蜂巢世界又为何坚决反对——本章把主线问题正式立起来
  required: true
  any_of:
  - 自由派究竟想做什么
  - 坚决反对
  - 're: (为何坚决反对|为何反对|为什么要反对)'
anti_patterns:
- claim: 说主角在本章全部如实上报（他刻意回避了自己的经历与游戏内容）
  triggers:
  - 're: (主角|他).{0,10}(如实|全部).{0,8}上报'
  - 're: (他|主角).{0,8}没有隐瞒'
- claim: 把三个词说成本章新造的概念（它们前文已多次零散出现）
  triggers:
  - 're: 绝对自由.{0,8}私有制.{0,8}永生.{0,12}(首次|第一次).{0,8}(提出|出现)'
