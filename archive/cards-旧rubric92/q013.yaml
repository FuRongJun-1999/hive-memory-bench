qtype: fragment_synthesis
question: 核心的智能与政策由谁维护？
necessary_conclusion: 同样由公民维护，但方式不是动手检修，而是「持续的反馈 ＋ 可收回的授权」。智能一侧：指南被设计成从源头采集真实信息、真实需要、真实诉求的反馈通道（主角称之为「反馈的眼睛和耳朵」，它的制造方法是权限不足的机密）——它靠公民的真实反馈维持其「真」。政策一侧：不靠权威制定，而靠公民用神经认证的真诚自愿授权来维持——高级贡献者的资格来自公民发自内心的认同、也可被收回（做错事即收回授权、从
  5 级跌落），议题由共识委员会出意见稿、公民以贡献点表态（如永生相关技术在黑榜上）。这正是宪法第二条把「智能实体及国家机构」与自动化系统并列的原因：它们同样不许自我维护
acceptable_surface_forms:
- 也是公民，但不是动手修——智能那头靠反馈：指南把真实信息、需要、诉求从源头收上来，是反馈的眼睛和耳朵；政策那头靠授权：靠神经认证的真诚自愿授权维持，资格能被收回，意见稿由委员会出、公民用贡献点表态
- 核心层由公民用反馈和授权维护：指南靠真实信息喂养，政策靠可撤回的公民授权立住
