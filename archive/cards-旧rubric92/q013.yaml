must_exclude:
- cid: u01_c3
  quote: 世界漫游指南由蜂巢世界创始人陈默制造
  reason: ★ 这是'谁制造'而非'谁维护'，且紧接着制造方法即显示权限不足；据此答'由巨子维护指南'即偷换（他早已长眠）
  exclusion_type: misread
- cid: u02_c16
  quote: 共识委员会他们也很重视
  reason: ★ 委员会承担的是议题与意见稿（发布、征求意见），不是维护者本身；据此答'政策由共识委员会维护'即把议题层当成了维护者
  exclusion_type: misread
