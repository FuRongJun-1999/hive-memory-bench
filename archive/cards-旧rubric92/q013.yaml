notes: 跨 u01（第3、6章）与 u02（第15、16章）。★ 与 q010／q011／q012 构成完整一组：基层（机器人）由公民动手维护；核心（智能与政策）同样由公民维护，但方式是**反馈＋可收回的授权**。宪法第二条把「智能实体及国家机构」与自动化系统并列为禁止自我维护的对象，正是本题的规则依据。
