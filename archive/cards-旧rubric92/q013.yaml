  - 're: (贡献值|授权).{0,12}(自愿|不认|收回)'
  - 're: (微调|一遍遍).{0,14}(共识|细则|算法|目标)'
- id: a3
  point: 公民用神经认证的真诚自愿授权维持：高级贡献者资格来自公民认同，且可被收回（做错事即收回授权、从 5 级跌落）
