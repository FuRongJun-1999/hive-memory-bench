notes: '★ 草稿（作者 2026-09-30 亲口给出五根柱子的骨架，本条答案键的出处是作者本人——这是最强的出处）。★ 本题是**总纲题**：库里 81 张全是分题，没有一张问「整体架构与因果」。★ 因果那一环（a6）是我整理的，标为推断层待作者确认。★
  设计上要防的两种混淆：把④（被安放的生命）当成⑤（叛徒）；把③（终端）说成就是蜂巢意识本身（与作者裁定 #2「集群意志」冲突）。'
