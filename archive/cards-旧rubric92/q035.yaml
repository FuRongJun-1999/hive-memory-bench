qid: q035
kind: objective
qtype: fragment_synthesis
unit_ids:
- u01
- u02
- u03
span: long
inference_layer: 高可信推断
question: 把全书当作一个系统来看：它的理论核心、实现出来的系统、真实信息的入口、体系之外的生命、以及现状的反对者分别是什么？它们之间的因果是怎么串起来的？
necessary_conclusion: 五根柱子加一条因果：**①理论**＝以控制论为核心的社会学理论（巨子融合三家的思想，其中混沌与控制论的见解来自《工程控制论》）；**②系统**＝按它实现出来的负反馈＋预测（设计原型见第八章的三步：目标值→比较器→反馈系统，反馈就用指南；维持方式是「持续地微调」；预测在故事里叫「推演」）；**③入口**＝获取真实信息的终端，即指南（从源头采集真实的信息/需要/诉求，配套量子通信与神经认证，保证反馈输入不假）；**④体系之外的生命**＝从机器人中自己产生、被巨子安放在灵境的「自由的灵魂」（他说「他们是我的骄傲，也是我的遗憾」）；**⑤反对者**＝对现状不满的叛徒与自由派（自由派「不认可巨子的蜂巢蓝图，想要建立真正绝对自由的新世界」，其认知来自「从过去的历史中找到的部分内容」；周清源的《永生技术原理》被斥为叛徒提案、遭投票否决）。**因果**：理论落成系统与终端
  ⇒ 系统之外出现了它无法容纳的生命 ⇒ 而反对者利用系统的终端（沉浸式游戏/灵境）反过来做渗透——于是体系之外的世界变成了战场
acceptable_surface_forms:
- 理论＝控制论社会学；系统＝负反馈＋推演；入口＝指南（取真实信息）；体系外＝自由的灵魂（安放在灵境）；反对者＝自由派/叛徒（用游戏渗透）
- 五层：控制论理论 → 反馈与预测系统 → 取真终端 → 被安放的自由灵魂 → 不满的叛徒；反对者借终端反打体系
answer_points:
- id: a1
  point: ①理论核心＝以**控制论**为核心的社会学理论（巨子融合三位伟人的思想，其中对混沌系统与控制论的见解来自《工程控制论》）
  required: true
  expect_layer: 明写事实
  any_of:
  - 控制论
  - 工程控制论
  - 三位伟人
  - 3位伟人
  - 're: (控制论).{0,20}(社会|理论|社会学)'
- id: a2
  point: ②系统＝按此理论实现的**负反馈＋预测**：设计原型是目标值→比较器→反馈系统（反馈就用指南），维持靠**持续微调**；预测在故事里叫**推演**
  required: true
  expect_layer: 明写事实
  any_of:
  - 目标值
  - 比较器
  - 反馈系统
  - 微调
  - 推演
  - 're: (负反馈|反馈).{0,16}(预测|推演)'
- id: a3
  point: ③入口＝**指南**（获取真实信息的终端）：从源头采集真实的信息/需要/诉求，配套量子通信与神经认证，保证反馈输入不假
  required: true
  expect_layer: 明写事实
  any_of:
  - 指南
  - 终端
  - 从源头
  - 神经认证
  - 量子通信
  - 're: (指南).{0,18}(终端|反馈|真实)'
- id: a4
  point: ④体系之外的生命＝从机器人中**自己产生**、被巨子**安放**在灵境的「自由的灵魂」（「他们是我的骄傲，也是我的遗憾」）
  required: true
  expect_layer: 明写事实
  any_of:
  - 自由的灵魂
  - 安放
  - 灵境
  - 安生之地
  - 骄傲
  - 're: (机器人).{0,16}(产生|自生).{0,10}(灵魂|生命)'
- id: a5
  point: ⑤反对者＝对现状不满的**叛徒与自由派**：自由派「不认可巨子的蜂巢蓝图，想要建立真正绝对自由的新世界」，其认知来自「从过去的历史中找到的部分内容」；周清源的《永生技术原理》被斥叛徒提案并遭否决
  required: true
  expect_layer: 明写事实
  any_of:
  - 自由派
  - 叛徒
  - 周清源
  - 永生技术原理
  - 绝对自由的新世界
  - 're: (自由派).{0,20}(绝对自由|不认可|新世界)'
  - 're: (部分内容|残缺).{0,16}(历史|宣传)'
- id: a6
  point: 因果：**反对者利用系统的终端反打体系**——自由派借沉浸式游戏／灵境做渗透（认知污染），使「体系之外的世界」变成战场；这也是全书当前危机的发动机
  required: true
  expect_layer: 高可信推断
  any_of:
  - 渗透
  - 认知污染
  - 沉浸式游戏
  - 战场
  - 're: (自由派).{0,16}(游戏|灵境).{0,16}(渗透|诱导)'
  - 're: (利用).{0,10}(游戏|灵境).{0,16}(渗透|诱导|渗透进)'
- id: a7
  point: 可补充：这套架构的**张力**在于——系统要求反馈输入为真（③），而反对者的手法恰恰是「信息难以作假，但不代表无法诱导」（用部分真相导向相反方向）
  required: false
  expect_layer: 高可信推断
  any_of:
  - 无法诱导
  - 诱导
  - 部分真相
  - 're: (难以作假|不能作假).{0,16}(诱导|误导)'
must_exclude:
- cid: u02_c16
  quote: 一般人是没机会见到的
  reason: 这句说的是「见不到有自我意识的 AI」，不能拿来当「体系之外的生命**不存在**」的依据——它们被安放在灵境
  exclusion_type: misread
- cid: u01_c3
  quote: 警告：重复尝试非授权访问可能下调安全评级
  reason: 权限告警不是反馈环节，也不能推出「终端在阻止信息流动」（终端的功能是从源头取真）
  exclusion_type: misread
anti_patterns:
- claim: 把「叛徒」的范围说错——把被安放的自由灵魂（④）当成叛徒（⑤）
  triggers:
  - 're: (自由的灵魂|派蒙|诺艾尔).{0,12}(是|属于|被斥为).{0,6}叛徒'
  - 're: 叛徒.{0,10}(是|指).{0,8}(自由的灵魂|派蒙)'
- claim: 把控制论说成巨子的原创（正文说他融合了三位伟人的思想、《工程控制论》是来路之一）
  triggers:
  - 're: 控制论.{0,10}(是|由).{0,6}(巨子|陈默).{0,6}(原创|首创|发明|独创|自创)'
- claim: 断言指南就是蜂巢的意识本身（作者裁定：它是集群意志的接口／感知层，而非意识本身）
  triggers:
  - 're: 指南.{0,8}(就是|即是).{0,6}(蜂巢).{0,6}(意识|意志)'
