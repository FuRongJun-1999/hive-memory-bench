qid: o036
kind: open
category: 故事线索
unit_ids:
- u01
span: short
inference_layer: 高可信推断
question: 线索题：旧时代的病灶是怎么一步步变成蜂巢世界的设计的？请把这条因果链讲清楚。
rubric:
- id: p1
  point: 链条的起点是病灶诊断：旧社会的信息多如牛毛、大部分虚假，虚假信息切断反馈、蒙蔽眼睛、纵容腐败——像用烂泥巴建立起来的楼阁、地基不稳
  required: true
  any_of:
  - 信息错配
  - 反馈
  - 烂泥巴
  - 're: (虚假信息|虚假).{0,16}(反馈|蒙蔽|腐败)'
- id: p2
  point: 第二步是对策的性质：要公开透明的信息网络（蜜蜂式的信息共享），减少甚至消除错误与虚假信息
  required: true
  any_of:
  - 公开透明
  - 信息网络
  - 蜜蜂
  - 're: (公开透明).{0,12}(信息网络|信息)'
- id: p3
  point: 第三步是技术手段落地：量子通信确保传递过程纹丝不动、绝对加密；神经认证验证想的和说的是否一致——这两件是「我们已经有了」的技术
  required: true
  any_of:
  - 量子通信
  - 神经认证
  - 我们已经有了
  - 're: (量子通信|神经认证).{0,18}(加密|一致|已有)'
- id: p4
  point: 第四步长成制度：按需分配托底＋贡献点按劳分配、指南承担反馈职能（维护公民认同…的共识）、宪法禁止系统自我维护
  required: true
  any_of:
  - 按需分配
  - 贡献点
  - 维护公民认同
  - 're: (宪法|系统).{0,14}(自我维护|反馈)'
- id: p5
  point: 这条链的落点也是全书主线的起点：正因认证能防造假却防不了诱导，攻击才从这道缺口进来（第8章第一次点出，第15章被机构正式确认）
  required: true
  any_of:
  - 诱导
  - 缺口
  - 're: (防不了|难以|不能).{0,10}(诱导|界定诱惑)'
  - 're: (自由派|攻击).{0,16}(缺口|诱导)'
anti_patterns:
- claim: 把蜂巢的设计说成凭空发明的新技术（它的每一条都对应旧时代的某个病灶）
  triggers:
  - 're: (设计|制度).{0,12}(凭空|无来由|全新发明)'
- claim: 断言神经认证能防住诱导（正文相反：防得住假话、防不住引导）
  triggers:
  - 're: 神经认证.{0,14}(能|可以).{0,8}(防住|阻止).{0,6}诱导'
evidence_pool:
- cid: u01_c4
  quote: 核心矛盾就在于信息错配的矛盾
  supports:
  - p1
- cid: u01_c4
  quote: 用烂泥巴建立起来的楼阁
  supports:
  - p1
- cid: u01_c4
  quote: 必须实现这样的公开透明的信息网络
  supports:
  - p2
- cid: u01_c4
  quote: 这样的技术我们已经有了
  supports:
  - p3
- cid: u01_c3
  quote: 维护公民认同最小化剥削和压迫的共识
  supports:
  - p4
- cid: u01_c8
  quote: 但不代表无法诱导
  supports:
  - p5
grading:
  mode: rubric
  coverage_required: 0.7
  evidence_required: true
  anti_pattern_penalty: true
  exclusion_required: false
notes: 线索题第一张（因果链口径：作者 2026-09-30 指示「线索…主要是重要事件的因果联系」）。这条链是**全书的制度因果**：病灶→对策→技术→制度→缺口，五环缺一不可，而最后一环正好是主线冲突的入口。
annotator: 构造样例（逐章含义；引文均取自原文）
