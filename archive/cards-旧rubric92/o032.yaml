qid: o032
kind: open
category: 故事含义
unit_ids:
- u03
span: short
inference_layer: 合理假说
question: 第十九章「蒙德的自由」这一章在讲什么？它给出的正面答案是什么？
rubric:
- id: p1
  point: 陷阱被说破：博士和富人将安全与绝对自由和永生绑定；琴指出他们不直接否定宁静生活的美好，而是指出这种美好的脆弱，来鼓吹绝对的力量和永生
  required: true
  any_of:
  - 脆弱
  - 绑定
  - 're: 安全.{0,12}(绝对自由|永生).{0,10}绑定'
- id: p2
  point: 琴的正面主张：骑士团成立的初衷是守护蒙德、守护自由；这自由绝非用永恒奴役换来的虚假安全，也绝非用财富堆砌的孤立堡垒；力量来源于每一个人，而非某个高高在上的神祇或王者
  required: true
  any_of:
  - 虚假安全
  - 孤立堡垒
  - 每一个人
  - 're: (而非|不是).{0,12}(神祇|王者)'
- id: p3
  point: 凯亚的汇报：恐惧是有传染性的，博士他们提供的故事对部分人很有吸引力，再这样下去蒙德或许会出现大乱
  required: true
  any_of:
  - 恐惧是有传染性的
  - 大乱
  - 're: 恐惧.{0,12}(传染|吸引力)'
- id: p4
  point: 主角的结论（本章落点）：这就是蒙德的自由吗——不是无拘无束的混乱，也不是绝对安全的牢笼，是一种选择，选择共同承担风险，选择彼此守护
  required: true
  any_of:
  - 共同承担风险
  - 彼此守护
  - 牢笼
  - 're: (不是无拘无束|不是绝对安全).{0,14}(混乱|牢笼)'
- id: p5
  point: 本章的收束：阴谋被击退，但被守护下来的东西是「守护本身的定义」（第23章把它带回蜂巢）
  required: true
  any_of:
  - 守护本身
  - 定义
  - 're: (阴谋|计划).{0,12}(击退|失败)'
anti_patterns:
- claim: 把琴的主张读成反自由（她说的是自由的定义，不是取消自由）
  triggers:
  - 're: (琴|骑士团).{0,12}(反对|否定).{0,8}自由'
- claim: 断言主角在本章选择留在蒙德（他没有，他把答案带回蜂巢）
  triggers:
  - 're: (主角|他).{0,10}(留在|定居).{0,8}蒙德'
evidence_pool:
- cid: u03_c19
  quote: 他们将安全与绝对自由和永生绑定
  supports:
  - p1
- cid: u03_c19
  quote: 但这自由，绝非博士所许诺的
  supports:
  - p2
- cid: u03_c19
  quote: 恐惧是有传染性的
  supports:
  - p3
- cid: u03_c19
  quote: 不是无拘无束的混乱，也不是绝对安全的牢笼
  supports:
  - p4
grading:
  mode: rubric
  coverage_required: 0.7
  evidence_required: true
  anti_pattern_penalty: true
  exclusion_required: false
notes: 逐章含义题（底稿第 19 章）。本章是**正解章**：第15章给出负面推演，本章给出正面定义——自由是选择、是共同承担、是彼此守护；而琴那句「力量来源于每一个人，而非某个高高在上的神祇或王者」正是全书反权威线的落点句。
annotator: 构造样例（逐章含义；引文均取自原文）
