notes: ★ 逐章含义题（底稿：`chapters.md` 第 8 章）。★ 本章的双重性：**表层的'化解误会'＋里层的两句判断**——一句说世界（矫枉过正：效率为公平让路、隐私给安全低头、自由人人喊打），一句说理论（认证能防作假，不代表无法诱导）。后者是全书冲突线的第一处裂缝，也是
  q023/q029 那条'防伪不防诱导'的起点。★ 判分要点：把'指出缺口'读成'判定理沦错误'即越读。
