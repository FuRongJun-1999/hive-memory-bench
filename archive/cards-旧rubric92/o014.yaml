unit_ids:
- u01
span: short
inference_layer: 合理假说
question: 第八章「化解误会」这一章在讲什么？它的含义与它埋下的问题是什么？
rubric:
- id: p1
  point: 本章的场景是旧时代遗存区：机械犬、智能坦克、智能无人机——曾经最强最新式的装备如今成为旧时代的见证者，沉眠在这里；主角向它们敬礼
  required: true
  any_of:
  - 机械犬
  - 智能坦克
  - 智能无人机
  - 遗存
  - 're: (旧时代).{0,14}(见证|沉眠|遗存)'
  - 're: (敬礼|尊敬).{0,12}(机器人|将士)'
- id: p2
  point: 同一批装备的历史被交代：战时它们是智能工兵（负责维护、挖掘、搬运，当时人类已失去回到地面的条件）；战后军用技术民用化，机器人才是这个蜂巢世界的真正建设者
  required: true
  any_of:
  - 智能工兵
  - 民用化
  - 建设者
  - 're: (军用|军事).{0,12}(技术).{0,10}(民用)'
  - 're: (智能工兵|机器人).{0,14}(维护|挖掘|搬运|建设)'
- id: p3
  point: 本章的判断句（对蜂巢社会的反思）：这个时代的人矫枉过正，想把旧时代引发动乱的根源彻底消除——效率为公平让路，隐私给安全低头，自由人人喊打，威胁必须清除
  required: true
  any_of:
  - 矫枉过正
  - 效率为公平让路
  - 隐私给安全低头
  - 自由人人喊打
  - 're: (矫枉过正|旧时代).{0,20}(根源|彻底消除)'
- id: p4
  point: 主角对巨子理论的第一次质疑：即使通过神经认证和量子通信，信息难以作假，但不代表无法诱导——自由派的出现就是这种情况，他们看到的只是一部分真相，然后被这样的真相导向了相反的方向
  required: true
  any_of:
  - 诱导
  - 一部分真相
  - 相反的方向
  - 're: (难以作假|不能作假).{0,16}(诱导|导向)'
  - 're: (自由派).{0,16}(真相|相反)'
- id: p5
  point: 本章也是小李这个人物的成型处：从盘问主角到带他进入遗存区，面对旧装备时别过头去的回忆（胜利与牺牲、世界为何永不安宁），以及那句'这是我们的职责'
  required: true
  any_of:
  - 小李
  - 职责
  - 牺牲
  - 're: (小李).{0,16}(职责|回忆|敬礼|带)'
  - 're: (胜利).{0,14}(牺牲|安宁)'
- id: p7
  point: 可补充（作者 2026-09-30 裁定补入）：本章还含一段**控制论演习**——主角用《控制论》搭样板：设目标值（贡献点的增长速度）→ 设计比较器（月度 1% 的模型）→ 设反馈系统（就用指南，实时查询）；这一步是他后来理解蜂巢系统的原型
  required: false
  any_of:
  - 控制论
  - 目标值
  - 比较器
  - 反馈系统
  - 're: (目标值|比较器).{0,20}(反馈|指南)'
  paraphrase:
  - 用控制论搭控制系统
  - 设目标、做比较、接反馈
- id: p6
  point: 可补充：本章用安全感的另一种面目收尾——主角自我安慰'有指南在，我就是安全的'，并想到摄像头下犯罪嫌疑人会被快速定位抓住（安全与监视是一体两面）
  required: false
  any_of:
  - 摄像头
  - 定位
  - 安全
  - 're: (有指南在).{0,12}安全'
  - 're: (监视|定位).{0,14}(安全|抓)'
anti_patterns:
- claim: 把这一章读成单纯的'误会解除、皆大欢喜'（本章在解除误会的同时留下了对安全与自由的判断）
  triggers:
  - 本章只是解除误会
  - 这一章是轻松的一章
  - 误会解除后一切如常
  - 本章没有提出问题
- claim: 断言主角在本章就断定巨子的理论是错的（他只是指出'不代表无法诱导'这个缺口）
  triggers:
  - 本章证明巨子的理论是错的
  - 他断定理论失败
  - 主角认定蜂巢的共识是错的
