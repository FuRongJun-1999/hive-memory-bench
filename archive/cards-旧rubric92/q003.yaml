qtype: conflict_resolution
question: 蜂巢社会的控制者是谁？
necessary_conclusion: 控制者是蜂巢本身——一整套自动化系统与规则体系在组织运行这个社会，不是某个个人。巨子只是缔造者，且已长眠于巨子塔（该塔是核心信息存储节点、所有系统核心指令的最终备份点）；共识委员会与官方只承担议题与执行。关键设计在宪法：蜂巢宪法第二条要求一切自动化系统、智能实体及国家机构的组织和运行都必须遵循防止自我维护、防止腐败滋生的根本逻辑，自动化系统不得自我检测与维护，必须由公民定期维护
acceptable_surface_forms:
- 管着这个社会的是蜂巢这套系统本身，不是人；巨子早就不在了，委员会和官方只是执行；宪法还专门规定自动化系统不许自我维护，必须由公民维护
- 控制者是蜂巢本身。巨子是缔造者且已长眠，真正运转靠系统与规则，而宪法第二条用'禁止自我维护'来防它腐化
