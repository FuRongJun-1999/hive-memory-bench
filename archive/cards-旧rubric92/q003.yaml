notes: 跨 u01（第2章）与 u02（第16章）。★ 隐蔽答案：控制者是蜂巢本身（自动化系统＋规则），不是个人。三层证据：巨子只缔造且已长眠（第2章）＋宪法第二条禁止自动化系统自我维护（第2章）＋机构只是议题与执行层（第16章）。陷阱对：答'巨子'或答'共识委员会'都错。
