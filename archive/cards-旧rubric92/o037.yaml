  supports:
  - p2
- cid: u03_c18
  quote: 用美好的词汇包装危险的概念
  supports:
  - p3
- cid: u03_c19
  quote: 他们将安全与绝对自由和永生绑定
  supports:
  - p4
- cid: u02_c15
