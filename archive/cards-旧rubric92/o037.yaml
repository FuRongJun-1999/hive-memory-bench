- u03
span: long
inference_layer: 高可信推断
question: 线索题：自由派的认知污染是怎么成立的？请把这条攻击链讲清楚。
rubric:
- id: p1
  point: 攻击的起点是技术边界：认证能验证说的是不是符合认知的事实，能识别谎言，却难以界定诱惑——真话可以被选择性地给出部分
  required: true
  any_of:
  - 界定诱惑
  - 部分真相
  - 're: (识别谎言|难以界定).{0,14}(诱惑|真话)'
- id: p2
  point: 于是攻击改走展示性的载体：借助沉浸式游戏（可能性的展示）绕开神经认证，把通向地狱的道路包装成乌托邦
  required: true
  any_of:
  - 沉浸式游戏
  - 绕开
  - 包装成乌托邦
  - 're: (沉浸式游戏|游戏).{0,16}(绕开|载体|展示)'
- id: p3
  point: 包装的手法是用美好的词汇包装危险的概念：永生被说成永恒守护、私有制被美化为拥有美好的自由、绝对权力被歌颂为承担责任的勇气
  required: true
  any_of:
  - 美好的词汇
  - 永恒守护
  - 're: (私有制|绝对权力).{0,16}(美化|歌颂|包装)'
- id: p4
  point: 目标形态是把安全与绝对自由和永生绑定，指向终产者；它对公民的伤害方式是恐惧（恐惧是有传染性的）与感官刺激
  required: true
  any_of:
  - 终端者
  - 恐惧是有传染性的
  - 're: (安全).{0,12}(绝对自由|永生).{0,10}绑定'
- id: p5
  point: 链条的落点是**不能封禁**：彻查封禁会起反作用、恰好坐实「蜂巢即为思想牢笼」，反而加大扩散——所以要认知疫苗而不是认知防火墙，用共同守护的故事对抗恐惧、用真实的历史和协作的成果揭穿谎言
  required: true
  any_of:
  - 认知疫苗
  - 思想牢笼
  - 共同守护的故事
  - 're: (封禁|彻查).{0,16}(反作用|牢笼)'
anti_patterns:
- claim: 把封禁当成对策（正文给了反对封禁的理由，并给出疫苗式路线）
  triggers:
  - 're: (应该|必须|主张).{0,8}(封禁|封杀|关闭).{0,8}(游戏|内容)'
- claim: 把认知污染说成已经解决的问题（它是进行中的主线冲突）
  triggers:
  - 're: 认知污染.{0,12}(已经|早就).{0,8}(解决|清除|结束)'
evidence_pool:
