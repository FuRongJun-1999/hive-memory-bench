  supports:
  - p5
grading:
  mode: rubric
  coverage_required: 0.7
  evidence_required: true
  anti_pattern_penalty: true
  exclusion_required: false
notes: 线索题（因果链）。这条链是**主线冲突的完整形状**：边界→载体→包装→目标→对策。其中最后一环写明了「为什么不能一禁了之」——这是本题最容易被答漏的一环。
