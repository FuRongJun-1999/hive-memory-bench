notes: 逐章含义题（底稿第 20 章）。本章是**危机形态章**：把「糖衣」的长期效果写清楚——一次进攻可以被击退，但信徒与代言人式的渗透会一代一代地改变精神。它也因此解释了下一章为什么要跳到几十年后去看结果。
