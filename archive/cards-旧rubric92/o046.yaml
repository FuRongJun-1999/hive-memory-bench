- u03
span: long
inference_layer: 高可信推断
question: 事件链题：认知污染这条线是怎么走过来的？请按时序把因果串起来。
rubric:
- id: p1
  point: 起点是技术边界的暴露：即使通过神经认证和量子通信，信息难以作假，但不代表无法诱导——自由派看到的只是一部分真相，然后被这样的真相导向相反的方向
  required: true
  any_of:
  - 诱导
  - 一部分真相
  - 're: (难以作假|不能作假).{0,16}(诱导|导向)'
- id: p2
  point: 第一次确认是主角的上报：他发现自由派通过沉浸式游戏在对公民进行诱导并通报给警戒检查中心，机构判定为高度潜在威胁、启动对该项目的审查
  required: true
  any_of:
  - 高度潜在威胁
  - 沉浸式游戏
  - 审查
  - 're: (通报|报告).{0,14}(警戒检查中心|诱导)'
- id: p3
  point: 手法被定性：他们借助沉浸式游戏绕开神经认证、把通向地狱的道路包装成乌托邦；而封禁不可取——那会坐实「蜂巢即为思想牢笼」，反而加大扩散，所以要认知疫苗而不是认知防火墙
  required: true
  any_of:
  - 认知疫苗
  - 思想牢笼
  - 绕着
  - 're: (封禁|彻查).{0,16}(反作用|牢笼)'
- id: p4
  point: 接着是升级：结尾秦熙通报自由派的活动正在升级——他们利用游戏世界与现实的时间流速差加速渗透，多个沉浸式节点出现异常认知波动
  required: true
  any_of:
  - 升级
  - 时间流速差
  - 异常认知波动
  - 're: (自由派的活动|渗透).{0,14}(升级|加速)'
- id: p5
  point: 终点（当前）是反击：主角交出反制模型（用共同守护的故事对抗恐惧、用真实的历史和协作的成果揭穿谎言、用公平的规则和集体的力量抵御垄断），秦熙决定集合力量把这场认知污染彻底清除
  required: true
  any_of:
  - 反制
  - 共同守护的故事
  - 集合力量
  - 're: (彻底清除|清除).{0,10}认知污染'
anti_patterns:
- claim: 把认知污染写成已被清除（正文里它是进行中的冲突，结尾刚开始反击）
  triggers:
  - 're: 认知污染.{0,12}(已经|早就).{0,8}(清除|解决|结束)'
- claim: 把对策写成封禁（正文明确否决封禁，给出的是疫苗式路线）
  triggers:
  - 're: (对策|方案).{0,12}(封禁|关闭所有游戏)'
