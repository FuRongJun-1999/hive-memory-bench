- u03
span: long
inference_layer: 高可信推断
question: 线索题：巨子塔、风神像、指南、风之种——这四样东西怎么把两个世界连成一条线？
rubric:
- id: p1
  point: 巨子塔：现实侧的纪念物兼知识封存地——它是他的长眠之地，也是所有系统核心指令的最终备份点，涉及军用或超越时代的技术突破都被转移到这里分级保存
  required: true
  any_of:
  - 长眠之地
  - 备份
  - 分级保存
  - 're: (巨子塔).{0,18}(长眠|备份|保存)'
- id: p2
  point: 风神像：游戏世界里的同一人——风神就是巨子陈默；主角与派蒙曾坐在风神像的手掌上俯瞰蒙德，而蒙德众人供着的正是他
  required: true
  any_of:
  - 're: (风神).{0,12}(就是|即).{0,10}(巨子|陈默)'
- id: p3
  point: 指南：他的规定与反馈的出口——被写定的职责里明写维护公民认同最小化剥削和压迫的共识，而宪法只在它应答时被引用
  required: true
  any_of:
  - 维护公民认同
  - 're: (宪法).{0,14}(指南|引用|应答)'
- id: p4
  point: 风之种：他留下的世界的叙事装置——在派蒙设计的新故事里，它让人相信所需会通过与他人的协作与共同繁荣得到满足（小说里被写成《风之种》的寓言）
  required: true
  any_of:
  - 协作
  - 're: (风之种).{0,18}(寓言|协作|满足)'
- id: p5
  point: 四件东西的分工连成一条线：同一个人留下的东西，在两侧分别承担**规则（指南）／纪念与封存（巨子塔）／被供奉的形象（风神像）／说服的装置（风之种）**——两个世界因此是同一个人的两套安排
  required: true
  any_of:
  - 供奉
  - 're: (规则|指南).{0,16}(纪念|封存|供奉|形象|装置)'
  - 're: (同一个人).{0,16}(两侧|两个世界|安排)'
anti_patterns:
- claim: 把风神像与巨子读成两个不同的人留下的东西（正文写明风神＝巨子陈默）
  triggers:
  - 're: 风神.{0,10}(不是|并非).{0,8}巨子'
- claim: 把风之种说成巨子直接制造的实物（它是派蒙在模拟故事里设计的装置）
  triggers:
  - 're: 风之种.{0,14}(巨子).{0,8}(制造|创造|留下)'
evidence_pool:
- cid: u01_c2
  quote: 他的长眠之地
  supports:
  - p1
- cid: u01_c5
  quote: 都会将技术转移到巨子塔进行分级保存
  supports:
  - p1
- cid: u03_c21
  quote: 同时也是蜂巢的巨子陈默
  supports:
  - p2
- cid: u03_c18
