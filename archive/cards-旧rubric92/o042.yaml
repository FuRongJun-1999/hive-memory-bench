  supports:
  - p2
- cid: u01_c3
  quote: 维护公民认同最小化剥削和压迫的共识
  supports:
  - p3
- cid: u03_c18
  quote: 创作了一个名为《风之种》的寓言
  supports:
  - p4
grading:
  mode: rubric
  coverage_required: 0.7
  evidence_required: true
  anti_pattern_penalty: true
  exclusion_required: false
notes: 线索题（事物与地点的连接，作者点明的另一半个口径）。四件东西分居两侧、指向同一人：**规则（指南）／封存与归处（巨子塔）／被供奉的形象（风神像）／说服装置（风之种）**——这条线解释了两个世界为什么是同一个人的两套安排。★ 引文核对：`风神像的手掌`
  在 u03_c18，`风之种` 的寓言在 u03_c18。
  ★ issue 45-3 修正（与 o050／issue 22 同构）：题干里就写着「巨子塔、风神像、指南、风之种」，
  而 p2／p3／p4 的 any_of 各收了一个**题干自带的光杆名词**（风神像／巨子／指南／风之种，
  「巨子」还是「巨子塔」的子串），p5 又收了光杆「规则／纪念」⇒ 只复述题干即得 0.6，
  再加一句不含任何题目事实的「它们遵循同一套规则。」就命中 p5 ⇒ 0.8 ≥ PASS_SCORE 0.7，
  规则层直接 pass。现按 o050 的修法删掉题干自带的光杆名词，只留「名词＋功能」共现正则
  与真正的采分词（维护公民认同／协作／供奉）；p5 的光杆「规则／纪念」换成
  `(规则|指南).{0,16}(纪念|封存|供奉|形象|装置)`（要求分工里至少出现两个角色）。
  修后：只复述题干 fail 0.0；题干＋套话 fail 0.2（旧：0.6 / pass 0.8）。
  `check_all.py` 同时新增机检：采分点的 any_of 字面项不得是题面子串（issue 45-3）。
