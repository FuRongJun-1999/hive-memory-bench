notes: 跨三个单元。★ 与 q014 咬合：q014 指出宪法层没有维护／修订机制（缺口），本题的冲突正是**打在这个缺口上**——攻击的不是机器人、不是政策，而是「认同」本身；而系统既不能用强制（会自证思想牢笼），也没有权威可以出面维护根本原则，所以唯一出路是**用自己的叙事去竞争认同**（故事对抗故事）。
