qid: o009
kind: open
category: 主要人物
unit_ids:
- u02
span: short
inference_layer: 高可信推断
question: 王明是个怎样的人物？他在故事里起到了什么作用？
rubric:
- id: p1
  point: 身份＝心理学家，作为警戒检查中心的顾问参会；原文是以'另一位参会人员发表了担忧，他是王明，一位心理学家'这样事后补注的方式交代的
  required: true
  any_of:
  - 心理学家
  - 顾问
  - 参会
  - 're: (心理学家).{0,10}(顾问|参会|王明)'
  - 're: (警戒检查中心).{0,12}顾问'
- id: p2
  point: 他的关键判断＝'神经认证能识别谎言，却难以界定诱惑'——即认证管得住说的是不是真话，管不住把人往哪边带
  required: true
  any_of:
  - 界定诱惑
  - 识别谎言
  - 're: (神经认证).{0,18}(谎言|诱惑)'
  - 're: (难以|不能|无法).{0,8}界定'
- id: p3
  point: 他反对彻查封禁并给出理由：技术可行，但会起到反作用，恰好符合他们宣扬的'蜂巢即为思想牢笼'，反而加大认知污染症状的扩散
  required: true
  any_of:
  - 思想牢笼
  - 反作用
  - 封禁
  - 扩散
  - 're: (彻查|封禁|封杀).{0,16}(反作用|牢笼|扩散)'
  - 're: (认知污染).{0,12}(扩散|加大)'
- id: p4
  point: 他给出的方案＝'我们需要认知疫苗，而不是认知防火墙'——要的是让人自己产生分辨力，不是把内容挡在外面
  required: true
  any_of:
  - 认知疫苗
  - 疫苗
  - 防火墙
  - 're: (疫苗).{0,12}(防火墙|不是)'
  - 're: (分辨力|免疫力|自己认得出)'
- id: p5
  point: 可补充：他是典型的『一次发言型配角』——正文里他只在那一场讨论中出现，没有私人戏份也没有后续；他的发言方式是顾问式的（只谈机制与后果，不谈情绪）
  required: false
  any_of:
  - 一次发言
  - 只出现一次
  - 顾问式
  - 没有后续
  - 're: (只在).{0,12}(会议|讨论).{0,10}(出现|发言)'
anti_patterns:
- claim: 把他说成主张封禁的人（正文相反：他提出彻查封禁随即自己否决，理由是会坐实『思想牢笼』）
  triggers:
  - 王明主张封禁
  - 他要求封锁游戏
  - 他支持彻查封禁
  - 王明要求关闭游戏
- claim: 把『认知疫苗』或『难以界定诱惑』算给别人（正文里这两句是王明在警戒检查中心讨论上说的）
  triggers:
  - 're: (认知疫苗|界定诱惑).{0,8}(是|由|来自)(?![^秦李小主]{0,3}[^秦李小主]).{0,4}(秦熙|小李|主角|张明远)'
  - 're: (秦熙|小李|张明远).{0,12}(提出|主张|认为).{0,12}(疫苗|难以界定|界定诱惑)'
  - 're: 王明.{0,10}(只是|不过).{0,10}(记录|列席|没提出)'
- claim: 给他编造后续戏份（正文里他此后不再出现）
  triggers:
  - 王明后来参与
  - 王明此后负责
  - 他后来带队
  - 他被任命
