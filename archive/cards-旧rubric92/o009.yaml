  evidence_required: true
  anti_pattern_penalty: true
  exclusion_required: false
notes: ★ 本题的语料面极薄（1 条发言）但信息量极高：**第15章那场讨论的论证核心——'认证管真不管对'→'封禁会反噬'→'要疫苗不要防火墙'——整条链是王明一个人说出来的**。★ 他同时是「一次发言型配角」的样板：作者说'故事里有很多这样的配角'，这类角色没有私生活、没有成长弧，只有**一段承担论证功能的台词**，因此人物题考的是'这句话是谁说的、在论证里管什么用'。★
  来源订正：初版 o008（秦熙）把这两句算给了秦熙，查原文后移入本题（见 o008 的修订记录）。
annotator: 构造样例（格式验证用，引文均取自原文）
