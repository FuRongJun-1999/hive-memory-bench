inference_layer: 高可信推断
qtype: fragment_synthesis
question: 蜂巢能维护自身么？谁来维护蜂巢？
necessary_conclusion: 分两层看：**条文层面**——不能由自动化系统自我维护：宪法第二条要求一切自动化系统、智能实体及国家机构的运行都遵循「防止自我维护、防止腐败滋生」的根本逻辑，所以自动化机器人绝不允许内部进行自我检测、修理、维护，必须由公民定期来做，维护者因此是**公民**（主角的职业正是轨道清洁机器人协理员）；**整体层面**——而作为整体，**整个蜂巢本身就是真正的自我维护系统**，公民与机器人都是它的维护方式与组成部分。此外系统的**核心（理论与宪法）不改**——它不想改，也不愿意改
acceptable_surface_forms:
- 不能。宪法不许自动化系统自我检修维护，必须由公民定期做；主角的职业就是干这个。而且这层参与是制度要求不是技术需要——他发现清洁更像检查，机器人互相维护完全做得到。他还反问过：人就没私心么
- 蜂巢不能自己维护自己：宪法第二条禁止自动化系统自我维护，规定由公民定期检测修理维护
