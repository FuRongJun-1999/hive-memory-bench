notes: 全部落在 u01（第1、2章，另第6章提供'建设者'这个易混的对照）。★ 本题的关键分辨点在 a3：多数回答能答出'宪法禁止自我维护、由公民维护'，但会漏掉**人的参与是制度约束而非技术必要**这一层——而正文给了两处明证（清洁更像检查／机器人本有能力互相维护），并且主角自己就把它推了出来。
