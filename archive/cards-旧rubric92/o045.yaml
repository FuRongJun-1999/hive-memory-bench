qid: o045
kind: open
category: 主要事件
unit_ids:
- u01
span: short
inference_layer: 高可信推断
question: 事件链题：蜂巢世界是怎么建起来的？请把起因、经过、结果串成一条链。
rubric:
- id: p1
  point: 起因是双重的：废墟上必须重建秩序，而巨子把旧社会失败的核心矛盾诊断为信息错配（虚假信息切断反馈）
  required: true
  any_of:
  - 废墟
  - 信息错配
  - 反馈
  - 're: (诊断|核心矛盾).{0,14}信息错配'
- id: p2
  point: 经过之一是信息侧的技术：用公开透明的信息网络重建反馈，量子通信确保传递过程纹丝不动、绝对加密，神经认证验证想的和说的是否一致——这些技术「我们已经有了」
  required: true
  any_of:
  - 量子通信
  - 神经认证
  - 公开透明
  - 're: (我们已经有了|已有)'
- id: p3
  point: 经过之二是经济与权限制度：按需分配保障基本需要、个性化需求用贡献点获取；权限按贡献百分比分级，核心技术军事技术达到 5 级才允许查看
  required: true
  any_of:
  - 按需分配
  - 贡献点
  - 5级
  - 're: (权限).{0,12}(分级|百分比|贡献)'
- id: p4
  point: 经过之三是建设者与规则：战争的机器人被军用技术民用化（智能工兵变成轨道清洁机器人等），机器人成为这个世界的真正建设者；同时宪法把自动化系统、智能实体与国家机构一并纳入不许自我维护的约束
  required: true
  any_of:
  - 民用化
  - 建设者
  - 自我维护
  - 're: (机器人).{0,14}(建设者|民用)'
- id: p5
  point: 结果是世界成立了但代价留下：极小化剥削和压迫的新世界立住，而巨子在蜂巢建立后几年就积劳成疾去世——他没有活着看到它成年的样子
  required: true
  any_of:
  - 积劳成疾
  - 去世
  - 're: (建立后几年|几年).{0,14}(去世|病故)'
anti_patterns:
- claim: 把蜂巢说成靠新技术凭空建成（技术是旧时代已有的，靠的是制度与机器人）
  triggers:
  - 're: (蜂巢|新世界).{0,14}(凭空|从零).{0,8}(发明|创造)'
- claim: 断言巨子活到了蜂巢成年（正文写他建立后几年就病故）
  triggers:
  - 're: (巨子|他).{0,12}(一直|仍然).{0,10}(活着|在世)'
evidence_pool:
- cid: u01_c4
  quote: 核心矛盾就在于信息错配的矛盾
  supports:
  - p1
- cid: u01_c2
  quote: 在废墟上，亲手绘制了蜂巢的蓝图
  supports:
  - p1
- cid: u01_c4
  quote: 这样的技术我们已经有了
  supports:
  - p2
- cid: u01_c6
  quote: 我们将这些军用技术民用化
  supports:
  - p3
- cid: u01_c6
  quote: 机器人才是这个蜂巢世界的真正建设者
  supports:
  - p4
- cid: u01_c2
  quote: 可惜他老人家在蜂巢建立后几年就积劳成疾去世了
  supports:
  - p5
grading:
  mode: rubric
  coverage_required: 0.7
  evidence_required: true
  anti_pattern_penalty: true
  exclusion_required: false
notes: 事件链题。这条链的三个「经过」不能混为一谈：**信息侧（认证与通信）／制度侧（分配与权限）／建设与规则侧（机器人与宪法）**——这也是 q023 那批矛盾的来源。
annotator: 构造样例（逐章含义；引文均取自原文）
