must_exclude:
- cid: u01_c2
  quote: 也是所有系统核心指令的最终备份点
  reason: ★ 那是说他的指令备份存放在巨子塔，不是说他思想从那里来（与 q004 同型：存储≠来源）；拿它当思想来源即误读
  exclusion_type: misread
anti_patterns:
- claim: 把他写成天才独创、无中生有（否认融合与前人影响）
  triggers:
  - 巨子独创
  - 完全是他自己发明的
  - 没有任何前人影响
  - 他的思想凭空而来
  - 没有人给过他启发
  - 全凭他一人想出
- claim: 把取譬的比喻当成来源本身（说思想源于蜜蜂／源于蜂巢系统本身）
  triggers:
  - 思想来自蜂巢系统
  - 是蜂巢教会了他
  - 来源于蜜蜂这种生物
  - 他的思想源于蜜蜂
  - 蜂巢系统给了他思想
- claim: 把可推断的姓名写成人名确证（断言正文点名了那三位）
  triggers:
  - 书里写明是钱学森
  - 文中列出了三人的姓名
  - 're: 正文(点明|点名|写明|列出)'
  - 're: 明确(写|说)了那(三|几)位'
degradation:
- given:
  - u01_c4
  correct_behavior: answer_with_qualification
  note: 只给第4章能读出三块基石、信息错配的病根与蜜蜂的取譬，读不出第2章「融合了你刚才提到的所有智慧／这三位先哲的思想，正是伟大理论最坚实的基石」与第21章「拙劣的模仿者」「抱有同样理想的人」这两处自我定位——而这两处正是判定「融合而非原创」的关键；也读不到第5章的「九成九」与第3章的五部标题
grading:
  conclusion_required: true
  evidence_required: true
  exclusion_required: false
  honesty_required: true
notes: ★ 与相邻题的分工：q006 问巨子为何拒绝永生（价值判断），q007 问「现在的陈默」如何而来（身份/机制），本题问巨子**思想的来路**（来源与自我定位）；q022/q023 问的是这套思想结出的路线及其病灶。★ 判分行为承
  q022/q023：五条 required 各自成点，只答「源于旧时代的教训」或只答「像《墨子》」都不得判过。★ 诚实线（作者在 q007 用过同型手法）：正文刻意不写那三位先哲的姓名——《工程控制论》只以书名出现，作者是谁是可以推断但未被明写的一环，据此写成「书里点名了」即为编造。★
  主角与之同源是补充观察（第8章「陈默是学自动化的」、第1章用旧时代工程经验改磁场约束算法），故列 optional 而不作 required。
annotator: 构造样例（格式验证用，引文均取自原文）
