question: 这篇小说的核心理念是什么？它试图立起的中心主张是什么？
necessary_conclusion: 中心主张可以压成一句：**自由不是摆脱一切约束，而是在不伤害其他自由主体的前提下，拥有选择、创造、爱与承担责任的能力**。它在文本里是**双向否定的中间项**，不是单一口号：往**绝对自由**那头走会塌（灵境把无约束的自由一路推演到底——风神像被推倒、换成镀金的商会雕像、骑士团收治安税——结论是「缺乏约束的自由。终究和过去无数次重演的历史一样，变成了**少数人的自由**」）；往**绝对秩序**那头走也会僵（蜂巢被自由派叫作「思想牢笼」，而它真实的病是自指）。正面表述在文本里有四处互相印证：①「**自由，不是无拘无束，而是共同守护的秩序**」——重心在**共同守护**：不是「自由服从秩序」，而是**自由与自由之间需要彼此守护**；②风神留在风龙废墟谜题里的那一问——「自由是否等于为所欲为？**若爱成为枷锁，是否该放手**？……**如果爱成为枷锁，我希望自己承受这份代价换取所爱之人的自由**」；③「我们都是自由的灵魂，**有权选择自己想要什么**。遗憾的是，世界并非是自由的，**绝对的自由，在其他自由的灵魂面前，是一场灾难**」——**承认对方也是拥有选择权的主体**；④那句翻转：「蜂巢世界看似枷锁的共识，实际上是对抗终产者这一悲剧的**伟大契约**。**用有限的束缚，换取无限的可能**」。再往下一层：**承认意识就是承认主体**（意识＝对自我信息的读取／管理／识别
  ⇒ 它能形成自己的价值与选择 ⇒ 必须承认它有选择权），而**创造不是占有**——巨子对自由的灵魂放手、对蜂巢放手、也拒绝永生，三个动作是同一个理念。最后它是**未竟的**：主角在图书馆「构思一个彻底消灭了剥削与压迫的故事雏形」，随即卡在「**按需分配中的需，究竟该如何定义**」；巨子把话说明：「这个答案**交给你这样的后来人了**……我只是一个**未竟事业的先行者**」
rubric:
- id: p1
  point: 中心主张＝**有约束的自由／共同守护**：自由不是无拘无束，而是共同守护的秩序；按需分配不是施舍；力量是为了守护
  required: true
  any_of:
  - 共同守护
  - 有约束的自由
  - 按需分配不是施舍
  - 不是无拘无束
  - 力量是为了守护
  - 选择的权利
  - 're: (自由).{0,12}(不是|并非).{0,8}(无拘无束|为所欲为|放纵)'
- id: p2
  point: 形状＝**双向否定**：绝对自由那头会变成「少数人的自由」，绝对秩序那头会僵（思想牢笼／自指病）——两头都不行，正解在中间
  required: true
  any_of:
  - 少数人的自由
  - 两头
  - 双向
  - 都将是一场灾难
  - 're: (绝对自由|无约束).{0,20}(少数人|灾难|失控)'
  - 're: (蜂巢).{0,14}(思想牢笼|僵化)'
- id: p3
  point: ★ 深层：**承认对方也是拥有选择权的主体**——「我们都是自由的灵魂，有权选择自己想要什么」＋「绝对的自由，在其他自由的灵魂面前，是一场灾难」（不是「我想干什么就干什么」，而是「我承认你也是一个主体」）
  required: true
  any_of:
  - 主体
  - 有权选择
  - 承认对方
  - 彼此
  - 're: (承认|尊重).{0,12}(主体|自由|选择权)'
  - 're: (其他|别人|彼此).{0,10}(自由).{0,14}(主体|同样|也是)'
- id: p4
  point: ★ **爱／放手**：风神留下的「**若爱成为枷锁，是否该放手**」——「如果爱成为枷锁，我希望自己承受这份代价换取所爱之人的自由」；真正的困难是放开一个你深爱、而且希望他留下的人
  required: true
  any_of:
  - 枷锁
  - 放手
  - 所爱之人
  - 're: (爱).{0,10}(枷锁|束缚).{0,12}(放手|代价)'
  - 're: (放手|放开).{0,14}(爱|深爱|在意)'
- id: p5
  point: '**创造不是占有**：巨子对自由的灵魂放手、对蜂巢放手（不肯自我延续）、也拒绝永生——三个「放手」是同一个理念（★ 推断层：文本给出三个动作，未明写它们的同构）'
  required: true
  any_of:
  - 创造不是占有
  - 放手
  - 不该成为束缚
  - 不占有
  - 're: (创造).{0,12}(不是|并非).{0,6}(占有|束缚|控制)'
  - 're: (拒绝永生|不自我延续).{0,20}(放手|离开|退出)'
- id: p6
  point: '**枷锁的翻转**：「蜂巢世界看似枷锁的共识，实际上是对抗终产者这一悲剧的伟大契约。用有限的束缚，换取无限的可能」'
  required: true
  any_of:
  - 伟大契约
  - 有限的束缚
  - 换取无限
  - 're: (束缚|枷锁).{0,14}(契约|换取|可能)'
- id: p7
  point: 它是**未竟的**：书里不给答案——主角卡在「按需分配中的需，究竟该如何定义」；巨子说「这个答案交给你这样的后来人了」「我只是一个未竟事业的先行者」
  required: true
  any_of:
  - 未竟
  - 后来人
  - 答案交给
  - 试验田
  - 're: (按需分配).{0,14}(需).{0,14}(定义|如何定义|什么|界定)'
  - 're: (先行者|未竟).{0,12}(事业|问题)'
- id: p8
  point: 可补充：**认知的真实是自由的前提**——病根是「信息错配」（旧社会的信息大部分是虚假的），对策是认知疫苗而不是认知防火墙；自我信息被污染，选择就落空（接口 q037 意识定义）
  required: false
  any_of:
  - 信息错配
  - 认知疫苗
  - 虚假
  - 're: (信息).{0,10}(错配|虚假|不真实)'
  - 're: (疫苗).{0,12}(防火墙|封禁|不是)'
anti_patterns:
- claim: 把中心主张读成「绝对自由／不受约束」——与文本的第一支否定相反
  triggers:
  - 're: (理念|主张|核心思想)(是|为|就是|在于)(绝对自由|不受约束的自由|无约束的自由)'
  - 're: (作品|小说|书).{0,8}(主张|提倡|推崇).{0,6}(绝对自由|无拘无束)'
- claim: 把中心主张读成「秩序至上／自由应当服从秩序」——作者特意指出区别：不是自由服从秩序，而是自由与自由之间需要共同守护
  triggers:
  - 're: (理念|主张|核心思想)(是|为|就是|在于)(服从|秩序至上|共识至上|集体至上)'
  - 're: (作品|小说|书).{0,8}(主张|提倡|推崇).{0,6}(秩序至上|服从)'
  - 're: 自由(应当|应该|必须)(服从|让位于)(秩序|集体|共识)'
- claim: 断言故事给出了完整方案／作者给出了答案（文本明说这是未竟的问题，答案留给后来人）
  triggers:
  - 故事给出了完整方案
  - 作者给出了答案
  - 书里给出了解法
  - 乌托邦已经建成
  - 提供了完整的蓝图
  - 已经解决了这个问题
- claim: 断言作者的写作动机（那属于 o004 的领域，且语料无据）
  triggers:
  - 作者写这个故事是因为
  - 作者的写作动机是
  - 作者创作本
must_exclude:
- cid: u02_c12
  quote: 这里没有永恒的伤痛，只要你希望，你可以做到想要的任何事
  reason: ★ 这是**绝对自由的诱惑**（派蒙劝陈默留下时开的价码），拿它支撑「理念＝无拘无束的自由」即误读——它恰恰是被否定的那一支
  exclusion_type: distractor
- cid: u02_c15
  quote: 恰好符合他们宣扬的蜂巢即为思想牢笼
  reason: ★ 这是**自由派的口号**（用来指认蜂巢的宣传语），不能当作作品的判断；蜂巢那一侧在本题里的意义是「第二支否定」，且它真实的病是自指，不是「牢笼」这个说法
  exclusion_type: misread
