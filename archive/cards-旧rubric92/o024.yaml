span: short
inference_layer: 合理假说
question: 第十章「初次见面」这一章在讲什么？它埋下的「角色重叠」问题是什么？
rubric:
- id: p1
  point: 祈愿召唤的机制被演示：用原石兑换纠缠之源或相遇之源即可祈愿（派蒙的说明），也就是说同一个角色可以被召唤出多个个体
  required: true
  any_of:
  - 祈愿
  - 原石
  - 纠缠之源
  - 're: (原石|纠缠之源).{0,14}(兑换|祈愿)'
- id: p2
  point: 诺艾尔登场并自我介绍：「我是诺艾尔，西风骑士团的女仆，从今天起，会陪你一起去冒险…我都会尽全力帮你解决」
  required: true
  any_of:
  - 诺艾尔
  - 西风骑士团的女仆
  - 女仆
  - 're: (初次见面).{0,12}诺艾尔'
- id: p3
  point: 随即出现的角色重叠问题：主角当场犯难——我带着诺艾尔去见诺艾尔怎么办？派蒙的解决方式是按先来后到把后来者叫「小艾尔」
  required: true
  any_of:
  - 小艾尔
  - 先来后到
  - 're: (我带着|带).{0,10}诺艾尔.{0,10}见.{0,6}诺艾尔'
  - 're: (小一辈|后来者).{0,12}(叫|命名|小艾尔)'
- id: p4
  point: 本章也立下了一条规则：这些角色有各自的性格与台词（诺艾尔熟悉地念着台词），而主角从一开始就没有把她们当成普通 NPC（他随后判断她们并非简单的游戏程序）
  required: true
  any_of:
  - 并非简单的游戏程序
  - 台词
  - 're: (不是|并非).{0,10}(普通|简单).{0,8}(npc|程序)'
- id: p5
  point: 可补充：本章的喜剧调子（两位诺艾尔为谁与陈默同住而争）背后是同一个问题——重复的个体算不算同一个人
  required: true
  any_of:
  - 同住
  - 两个诺艾尔
  - 're: (重复|两个).{0,12}(个体|诺艾尔)'
anti_patterns:
- claim: 把诺艾尔与小艾尔说成两个不同角色（正文明确是同一位角色的先后两个个体）
  triggers:
  - 're: (诺艾尔|小艾尔).{0,10}(是|属于).{0,6}(两个不同的角色|双胞胎)'
- claim: 断言主角把她们当作普通游戏程序（他相反，判断她们并非简单的游戏程序）
  triggers:
  - 're: (主角|他).{0,10}(把|将).{0,8}(她们|诺艾尔).{0,8}当作.{0,6}(程序|npc)'
