  coverage_required: 0.7
  evidence_required: true
  anti_pattern_penalty: true
  exclusion_required: false
notes: 逐章含义题（底稿第 10 章）。本章是**「一体两面」的立题章**：召唤带来的角色重叠，逼出了「重复的个体算不算同一个人」这个全书反复处理的问题（第17章的 q017、第21章的自由灵魂都在回答它）。★ 第 4 点的引文以卡片为准，判分只认「并非简单的游戏程序」这类表述。
