- u03
span: long
qtype: fragment_synthesis
inference_layer: 高可信推断
question: 按小说的设定，『意识』指的是什么？为什么在这个世界里，『屏蔽／修改记忆』就能改写一个人的认知？
necessary_conclusion: '**意识＝系统对『关于自身的信息』进行读取、管理、识别的能力**——它不是神秘的实体，也不是另外装上去的一个模块；它**和记忆系统、价值观念强相关**（正文里张老正是把两者绑在一起问：生命有维持生存的需要、有基于这个需要建立起来的「价值观念，行为准则」，那么具备自我意识的
  ai 会有怎样的价值观念与行为准则）。所以在这套设定里，**改写认知不需要去『直接编辑意识』**：只要改动系统能读到的自我信息，认知就会按新的信息重新构建——记忆屏蔽（巨子塔离塔即屏蔽）、篡改历史故事扭曲认知、认知污染，都是这条链上的不同表现。旁证：意识在这个世界里是**可迁移物**——巨子塔能查出《永生技术原理》的「关联项目：意识转移」，而反抗者的推演里也把「将意识导入机器人进行永生」当作必须认真对付的选项（原句是假设句式）'
acceptable_surface_forms:
- 意识不是灵魂、也不是装的模块，就是系统读取／管理／识别自身信息的能力；它靠记忆和价值观撑着，所以改记忆就能改认知——不用去『直接改意识』
- 因为「我」是由能读到的自我信息搭起来的：屏蔽或篡改这些信息，认知就跟着变（记忆屏蔽／篡改历史故事／认知污染都是同一条链）
answer_points:
- id: a1
  point: '**意识＝系统对自我信息（关于自身的信息）的读取／管理／识别能力**；不是神秘实体、也不是额外装上的模块'
  required: true
  expect_layer: 高可信推断
  any_of:
  - 自我信息
  - 关于自身的信息
  - 自我模型
  - 're: (意识).{0,16}(读取|识别|管理|处理).{0,16}(自我|自身|自己)'
  - 're: (自我|自身).{0,12}信息.{0,16}(读取|识别|管理)'
- id: a2
  point: 它与**记忆系统＋价值观念**强相关——正文原句是张老把「自我意识」与「价值观念，行为准则」绑在一起的问句（生命有维持生存的需要、有据此建立的价值观念与行为准则，那么具备自我意识的 ai 会有怎样的）
  required: true
  expect_layer: 明写事实
  any_of:
  - 价值观念
  - 行为准则
  - 强相关
  - 're: (价值).{0,8}(观念|体系).{0,16}(意识|自我|决定|相关)'
  - 're: (意识|自我).{0,16}(价值).{0,8}(观念|相关)'
- id: a3
  point: 因此**改信息＝改认知**（不必直接编辑意识）：记忆屏蔽、篡改历史故事扭曲认知、认知污染都是同一机制的不同表现
  required: true
  expect_layer: 高可信推断
  any_of:
  - 记忆屏蔽
  - 篡改历史
  - 扭曲认知
  - 认知污染
  - 're: (屏蔽|篡改|修改|改写).{0,12}(记忆|历史|信息).{0,16}认知'
  - 're: (认知).{0,8}(污染|被改写|重建)'
- id: a4
  point: 意识在这个世界里是**可迁移物**：巨子塔档案里《永生技术原理》的「关联项目：意识转移」；反抗者的推演里也有「将意识导入机器人进行永生」（★ 原句是假设句式）
  required: true
  expect_layer: 明写事实
  any_of:
  - 意识转移
  - 导入机器人
  - 永生技术原理
  - 're: (意识).{0,12}(导入|转移|迁移)'
- id: a5
  point: 可补充：与「被发现／涌现」同侧——创造者能造的是信息系统与运行条件，自我意识是系统能读取／管理／识别自身信息之后**自己出现**的能力（接口 q033）
  required: false
  expect_layer: 高可信推断
  any_of:
  - 条件
  - 涌现
  - 自己出现
  - 're: (条件|环境).{0,12}(意识|能力).{0,10}(出现|产生|形成)'
- id: a6
  point: 可补充：作者说这件事**并不困难**——正文侧的对应是记忆屏蔽已作为**常规制度**在运行（有词条、有先例、离塔即触发），不是奇迹或孤例
  required: false
  expect_layer: 高可信推断
  any_of:
  - 常规
  - 制度
  - 已有先例
  - 're: (记忆屏蔽).{0,14}(常规|制度|日常|先例|已有)'
must_exclude:
- cid: u02_c13
  quote: 我们都是自由的灵魂
  reason: 「自由的灵魂」是这个世界对被造者的**称呼**（修辞名），不能据此把意识往超自然／灵魂方向理解——设定上意识可转移、可屏蔽、由记忆与价值观支撑
  exclusion_type: misread
- cid: u02_c10
  quote: 数据模拟的智能真的有自我意识么
  reason: 这是主角提出、派蒙没有回答的反问；拿它当结论、或当成「小说承认自己不知道意识是什么」即误读——本题的答案落在别处的多组锚点上
  exclusion_type: misread
anti_patterns:
- claim: 断言「意识＝自我信息的读取／管理／识别」是正文原话（正文没有这句定义；作者的定义是设定真值，属可推断层）
  triggers:
  - 're: (正文|文中|书中|原文).{0,14}(写明|原话|明确).{0,12}(意识).{0,14}(读取|识别|管理|处理)'
  - 're: (小说|作者).{0,10}(明确|直接).{0,6}(定义).{0,6}意识'
- claim: 把意识说成不可操作的神秘实体（与「意识转移」「记忆屏蔽」的可操作性矛盾）
  triggers:
  - 're: 意识.{0,10}(是|属于).{0,8}(灵魂|超自然|玄学)'
  - 意识无法被
  - 意识是不可
  - 意识不是信息
