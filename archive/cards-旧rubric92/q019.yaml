notes: 跨 u02（第10、11、13章）与 u03（第17章）。★ 本题的合成点：两条情感线其实是同一条——她对风神是敬爱与埋怨交织、本质是舍不得；对陈默是把同一份舍不得搬了过去（她看出了两人很像），而风神与陈默对她说的是同一句话。最锋利的一处是她自己在第11章把矛盾说破：给他选择他就会走。
