unit_ids:
- u02
span: short
inference_layer: 合理假说
question: 第十五章「永恒奴役」这一章在讲什么？它的含义与它完成的论证是什么？
rubric:
- id: p1
  point: 本章前半是一段完整推演：资源并非无限（同样的回报比例下，初始差距会让个体提前触达资源上限）⇒ 私有制下不断兼并 ⇒ 农业国家的王朝周期律 ⇒ 若加上永生，则臣民只能永远服从、反抗近乎不可能（永生者可用机器人当执行者）⇒ 向星空扩张
    ⇒ 两个永生者相遇时唯一解法是消灭一方 ⇒ 最终形成永恒的奴役
  required: true
  any_of:
  - 资源并非无限
  - 上限
  - 兼并
  - 王朝周期律
  - 扩张
  - 're: (初始差距).{0,16}(上限|提前)'
  - 're: (永生).{0,20}(服从|反抗|奴役)'
- id: p2
  point: 推演落到一个名字：终产者——所有资源归永生者，其他生命陷入永恒奴役；此时永生成为最恶毒的诅咒（'所有的星辰都标注了价格，生存的呼吸都需要付费'）
  required: true
  any_of:
  - 终产者
  - 最恶毒的诅咒
  - 标注了价格
  - 're: (所有资源).{0,12}(永生者|归)'
  - 're: (永恒奴役|奴役).{0,14}(诅咒|终产者)'
- id: p3
  point: 三个禁忌与蜂巢共识一一对应：绝对自由对应最小化剥削和压迫；私有制对应按需分配与贡献点为基础的按劳分配；永生对应巨子对永生的坚决否定
  required: true
  any_of:
  - 三类
  - 一一对应
  - 绝对自由
  - 按需分配
  - 're: (绝对自由).{0,16}(剥削|压迫|最小化)'
  - 're: (私有制).{0,16}(按需分配|按劳分配)'
- id: p4
  point: 本章给出的定性：蜂巢看似枷锁的共识，实际上是对抗终产者这一悲剧的契约——'用有限的束缚，换取无限的可能'；自由派不是在创造天堂，而是在挖掘地狱
  required: true
  any_of:
  - 有限的束缚
  - 无限的可能
  - 契约
  - 挖掘地狱
  - 're: (看似枷锁|共识).{0,16}(契约|对抗)'
- id: p5
  point: 本章后半是机构的对策讨论，两句关键论断：秦熙指出手法（借助沉浸式游戏绕开神经认证，把通向地狱的道路包装成乌托邦）；王明给出论证（神经认证能识别谎言却难以界定诱惑；反对彻查封禁因为会坐实'蜂巢即为思想牢笼'；结论是需要认知疫苗，而不是认知防火墙）
  required: true
  any_of:
  - 认知疫苗
  - 界定诱惑
  - 思想牢笼
  - 're: (绕开|绕过).{0,10}神经认证'
  - 're: (包装成乌托邦|通向地狱)'
- id: p6
  point: 可补充：本章也写了公民一侧的证据——永生相关技术在贡献点投票中仍在上黑榜，反对的贡献点远多于支持；结句是'我们守护的不仅是共识规则，也是为了蜂巢世界公民免于永恒奴役'
  required: false
  any_of:
  - 黑榜
  - 投票
  - 免于永恒奴役
  - 're: (反对).{0,14}(超出支持|多于)'
anti_patterns:
- claim: 把这一章的推演说成对自由派的单纯辱骂（本章给出的是可复核的因果推演：资源有限＋私有制＋永生）
  triggers:
  - 这一章只是在骂自由派
  - 本章没有论证
  - 纯粹的口号
- claim: 把'终产者'写成故事里已出现的实体／已经存在的人（它在文中是推演出的形态与警示）
  triggers:
  - 终产者已经出现
  - 故事里有终产者这个人
  - 终产者就在蜂巢里
- claim: 把认知疫苗算给秦熙（那一整段论证是王明说的，见 o008/o009 的订正）
  triggers:
  - 're: (认知疫苗|界定诱惑).{0,8}(是|由|来自).{0,4}(秦熙|小李)'
