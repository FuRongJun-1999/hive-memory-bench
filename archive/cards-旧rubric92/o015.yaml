notes: ★ 逐章含义题（底稿：`chapters.md` 第 15 章）。★ 本章是全书**论证密度最高**的一章：前半用主角自己的数学推演把'绝对自由＋私有制＋永生'推到终产者，后半用机构的讨论把'怎么防'讲清楚（绕开认证→难以界定诱惑→不能封禁→要认知疫苗）。两半合起来，本章就是蜂巢共识的**正当性证明书**。★
  判分要点：推演的每一步都可复核（资源有限／初始差距／兼并／永生执行者），答'终产者'而不答路径＝不完整。★ 归属：认知疫苗那一段是王明说的（o008/o009 已订正），本题把归属写进 anti_patterns。
