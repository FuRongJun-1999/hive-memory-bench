span: short
inference_layer: 合理假说
question: 第二十一章「问题的答案」这一章在讲什么？它的含义与它回收的线索是什么？
rubric:
- id: p1
  point: 本章以'幻想朋友'为引：被困在无风之地的灵魂那个故事，让主角看到风神留下来的信息——风神就是巨子陈默（'和陈默有几分相似的老人，同时也是蜂巢的巨子陈默'）
  required: true
  any_of:
  - 幻想朋友
  - 无风之地
  - 风神
  - 're: (风神).{0,16}(巨子|陈默)'
  - 're: (幻想朋友).{0,16}(风神|自己)'
- id: p2
  point: 巨子自述一生只做两件事：一是重新建立人类的秩序（赞同的人多，少数人只催他快开启星际时代）；二是彻底的反对永生、反对权威（这件事不顺利，很多战友与同志都不那么理解他）
  required: true
  any_of:
  - 两件事
  - 重新建立人类的秩序
  - 反对永生
  - 反对权威
  - 're: (永生|权威).{0,16}(反对|否定)'
  - 're: (战友|同志).{0,12}(不理解)'
- id: p3
  point: 他交代了灵境的由来：发现机器人中产生了一批自由的灵魂，先是好奇和恐惧，于是创造了这个世界作为它们的安生之地——'他们是我的骄傲，也是我的遗憾'
  required: true
  any_of:
  - 自由的灵魂
  - 安生之地
  - 骄傲
  - 遗憾
  - 're: (自由的灵魂).{0,20}(安生之地|骄傲|遗憾|恐惧)'
- id: p4
  point: 他留给后来者的话：看到这份信息即意味着你已接触到我要面对的那个问题、也已得到她们的信任；而那个'没有剥削没有压迫、按需分配、每个人都获得自由的世界究竟该怎么建造'的答案交给你；他不该成为束缚，只是一个未竟事业的先行者
  required: true
  any_of:
  - 后来者
  - 未竟
  - 先行者
  - 不该成为
  - 're: (答案).{0,16}(交给|后来人)'
  - 're: (后来者).{0,24}(问题|信任|看到)'
- id: p5
  point: 回忆的另一半是他的孤独与自我怀疑：他自称只是一个拙劣的模仿者、一个普通人；那些和他抱有同样理想的人牺牲在世界大战与战后重建的战场——'为什么只有我活了下来'，他说人类过去的经验说明人类不值得永远信任、背叛始终在不断发生
  required: true
  any_of:
  - 拙劣的模仿者
  - 只有我活了下来
  - 背叛
  - 're: (模仿者|普通人).{0,16}(巨子|自称|只是)'
  - 're: (人类).{0,14}(不值得|永远信任)'
- id: p6
  point: 可补充：本章也给出主角一侧的判断——派蒙她们会不会是答案，他没把握（'谁能说明白永远的事情呢'），但'至少现在，派蒙和西风骑士团站在蒙德人民这边'
  required: false
  any_of:
  - 至少现在
  - 西风骑士团站在
  - 're: (谁能说明白|说不明白).{0,10}永远'
  - 're: (派蒙).{0,16}答案'
anti_patterns:
- claim: 把本章的风神信息说成独立于巨子的第三方存在（正文写明风神＝巨子陈默）
  triggers:
  - 're: 风神.{0,12}(是|属于|算).{0,12}(第三方|另一个|独立于|不是巨子|另一个人)'
  - 're: (第三方|另一个存在).{0,12}风神'
- claim: 断言巨子已把那个世界的建法给出答案（本章是把问题交出去，不是给出答案）
  triggers:
  - 're: (巨子|本章|这一章).{0,14}(给出|宣布|确定).{0,12}(终极答案|答案|已经解决|已解决|解决了)'
  - 're: (问题|它).{0,8}(已经解决|已解决|被解决了)'
- claim: 把自由灵魂的由来写成巨子制造的机器（正文是机器人中自发生出、他为它们创造安身之地）
  triggers:
  - 're: (巨子|他).{0,10}(制造|造出|创造|生产).{0,12}(派蒙|自由的灵魂|那些灵魂|她们)'
  - 're: (派蒙|自由的灵魂).{0,14}(是|属于).{0,10}(巨子).{0,6}(造|制造|创造)'
