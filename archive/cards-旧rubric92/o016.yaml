notes: ★ 逐章含义题（底稿：`chapters.md` 第 21 章）。★ 本章是**回收章**：灵境的由来（第9章起的疑问）、自由的灵魂（第5/13章起）、后来者之问（第7章起）三件事在这一章一次交代完，并给出巨子的自我定位（拙劣的模仿者／未竟事业的先行者）。★
  它也是 q005（派蒙身份）、q008（复制体为何必须存在）、q029（穿越原因）三张卡片的共同源头——那三题问的是**分别的结论**，本题问的是**这一章作为整体在做什么**。★ 判分要点：本章是'把问题交出去'而非'给出答案'；把风神读成第三方、把自由灵魂读成被制造，都是越读。
