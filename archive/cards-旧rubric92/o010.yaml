notes: ★ 语料面＝`roles/小李.md`（7 条，但实际横跨两处场景：遗存区的现场带路 + 第15章会议的评价）。★ 他的作用是**把机构的态度落到一个人身上**：第7章他是敌意（怀疑主角是探子），第8章他是敬意（向旧装备敬礼、说'这是我们的职责'），第15章他是信心（公民能分辨、永生仍在上黑榜）。★
  那句'或许有一天太阳不会升起，但极大概率不会是明天'是全书少见的**既承认危险又不认输**的台词，与秦熙问他的那句话配对；题里因此要求成对答出。★ 归因提示：`roles.py` 输出里混入了主角的独白（如'我不擅长推理呀'），卡片引文已按原文核对；'认知疫苗'等王明的台词不得算给他（见
  o008/o009 的订正）。
annotator: 构造样例（格式验证用，引文均取自原文）
