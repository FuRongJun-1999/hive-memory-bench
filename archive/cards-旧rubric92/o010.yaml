qid: o010
kind: open
category: 主要人物
unit_ids:
- u01
- u02
span: long
inference_layer: 高可信推断
question: 小李是个怎样的人物？请说明他的身份、言行与他的立场。
rubric:
- id: p1
  point: 身份＝警戒检查中心的人：第7章里他是审讯／盘问主角的那位巡逻员（'说，你是不是自由派的探子！'那一场），第8章由他带主角参观旧时代遗存区；他称秦熙为'秦姐'
  required: true
  any_of:
  - 警戒检查中心
  - 巡逻
  - 探子
  - 秦姐
  - 're: (参观|带领).{0,12}(遗存|老兵|机器人)'
  - 're: (审讯|盘问|怀疑).{0,12}(主角|陈默|探子)'
- id: p2
  point: 他带主角进入遗存区的现场：要经消毒与扫描程序、穿全方位的防护服；他的介绍是'这里存放着陆军型号，大家伙你是看不到了'
  required: true
  any_of:
  - 陆军型号
  - 防护服
  - 消毒
  - 're: (消毒|扫描).{0,12}(程序|进入)'
  - 're: (遗存|旧时代).{0,12}(存放|见证)'
- id: p3
  point: 他的感慨：面对旧装备时说这场战争'我们胜利了，如同百年前那样'，但'如此大的牺牲'让他追问为什么世界永远都不安宁——过去是这样，现在还是这样（说完别过头去，像是陷入回忆）
  required: true
  any_of:
  - 胜利
  - 牺牲
  - 不安宁
  - 're: (战争).{0,12}胜利了'
  - 're: (过去|现在).{0,10}(这样).{0,6}(还是这样|都这样)'
- id: p4
  point: 他的职责观：主角向他道谢'感谢你们守护这个世界'，他端正地回礼说'这是我们的职责'
  required: true
  any_of:
  - 职责
  - 守护
  - 're: (这是我们的职责|职责所在)'
  - 're: (回礼|敬礼).{0,12}职责'
- id: p5
  point: 他与秦熙的那一问一答：秦熙问'太阳要落山了，明天还会升起么？'，他若有所思地答'或许有一天太阳不会升起，但极大概率不会是明天'——承认危险存在，但不认输
  required: true
  any_of:
  - 太阳
  - 升起
  - 're: (太阳).{0,20}(升起|落山)'
  - 're: (极大概率|大概率).{0,10}(不会是明天|不是明天)'
- id: p6
  point: 他在第15章会议上的两次发言：一是'神经认证只能验证是否说了符合认知的事实'——最危险的不是直接鼓吹永生或私有，而是编织一个无拘无束的美梦；二是'大多数公民还是能分辨黑白是非的'，并查证贡献点投票里永生相关技术仍在上黑榜
  required: true
  any_of:
  - 美梦
  - 分辨黑白是非
  - 黑榜
  - 're: (神经认证).{0,20}(只|仅).{0,8}(验证|识别)'
  - 're: (永生).{0,14}(黑榜|反对)'
- id: p7
  point: 可补充：他是现实侧唯一既出现在现场（遗存区带路）又出现在会议桌（第15章评价）的年轻成员——两处都带着'职责'与'警惕'两副面孔；他对自己不擅长的部分很坦白（'我不擅长推理呀，解密什么的好麻烦'）
  required: false
  any_of:
  - 两处
  - 现场
  - 会议
  - 're: (不擅长|不善于).{0,8}(推理|解密)'
anti_patterns:
- claim: 把'认知疫苗'或'界定诱惑'算给小李（那两句是王明在同一场讨论上说的）
  triggers:
  - 小李提出了认知疫苗
  - 小李认为难以界定诱惑
  - 认知疫苗是小李
- claim: 把他写成警戒检查中心的高层／负责人（负责人是秦熙，他是执行层的巡逻员与现场带路人）
  triggers:
  - 小李是负责人
  - 小李是主管
  - 小李领导警戒检查中心
- claim: 断言他后来牺牲／离开（正文没有交代）
  triggers:
  - 小李牺牲了
  - 小李已经离开
  - 他后来死了
