notes: 跨 u02（第11、13章）与 u03（第18章）。★ 合成点：两人的情感形状要从**两封信的写法差异**读出——诺艾尔是自我怀疑与克制（把心意当自私），小艾尔是促成者（她先问出口）＋体谅式退让（先替对方让路，只求多来一次）；再与派蒙的「留住」对照，显出其「放开」的底色。她们的表达载体是日常照料。
