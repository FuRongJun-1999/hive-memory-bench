notes: ★ 作者点明本题型：**故事中并未写，但可推断**——所以判分要同时管住两端：推断链必须落回正文锚点（七条 required 各有出处），且不许把「可推断」写成「已写明」、不许用无锚点机制（克隆／灵魂迁移／转世／超自然）顶替推断（后者与
  q007 的口径一致：有正文锚点的推断可以写，须标明是推断）。★ **2026-09-30 作者裁定并补全机制**：「陈默就是基于巨子陈默的记忆，在虚拟世界中培育出来的。相似的是记忆，非克隆，灵魂迁移。这个技术在故事中不是秘密。派蒙等人工智能生命其实就是如此。」⇒
  机制升为**必答点 a7**，并把「派蒙她们与主角同源」写进点内；诚实线 a8 相应收窄为『执行者留白』。★ **本轮的口径教训（我自己的欠推断）**：上一轮我把机制判成「推不出」，理由是「正文未明写」——但**判定留白之前，应先量这套技术在故事世界内的公开度**：意识转移提案（周清源）是光幕上公开可查、被投票处理的议题，『记忆屏蔽』是老人随口提议的常规手段，派蒙她们的存在本身就是说明；再加上「那是巨子的回忆」「你的幻想朋友是你自己」两处直接锚点
  ⇒ **机制是可推的，只是不是以「讲解」的形式出现**。口径记为：**「未明写」不等于「不可推」；先量公开度，再判留白**。★ 与 q007 的分工：q007 问「现在的陈默是如何而来的」（身份与机制层，答案＝第五个同名者＋命名忌讳），本题问**原因**（为什么会有他这个人来：入口、条件、目的、机制）。★
  判分行为承 q022–q028：七条 required 各自成点，只答一环（例如只说『是他自己点的是』）不得判过。
