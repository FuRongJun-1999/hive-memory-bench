  - 're: (明确|清楚).{0,6}(交代|说明).{0,6}(怎么来|怎么到|穿越)'
- claim: 用无正文锚点的机制顶替推断（克隆／转世／灵魂／超自然）——作者裁定：相似的是**记忆**，非克隆、非灵魂迁移
