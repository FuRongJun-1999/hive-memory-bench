  layer_required: true
notes: ★ 已由作者 2026-09-30 裁定入库。★ 与 q025 的分工：q025 问「为什么看起来没超出认知」，本卡问「到底哪些超出、哪些是黑箱」——两卡互补，都挂在同一组锚点上（巨子塔分级保存／旧理论水位线）。★ 本题要防的**分类错误**：把量子通信、神经认证划进「原理未知」（正文用已知原理描述它们），以及把「原理未交代」说成「违反物理规律」（正文没有这种断言）。★
  a6 原为 GPT 的统一框架假说（台账悬置 16）；**作者 2026-09-30 已确认**（意识＝对自我信息的读取／管理／识别能力）⇒ 假说升格为设定真值，本卡仍保留为**加分项**（不升必答，避免把分类题变成洞见题；要升必答一句话即可）。★
  定义本身由 q037 承载，本卡 a6 只取「统一性」这一面。
