span: long
qtype: fragment_synthesis
inference_layer: 高可信推断
question: 蜂巢的技术里，哪些属于「原理已知、只是工程做得更远」，哪些属于「原理没交代的黑箱」？这两类怎么分辨？
necessary_conclusion: 两句话分开答：**绝大多数公开在用的技术属于「原理已知、工程做得更远」**——主角一看就说「所有的技术曾经他都听说过，只是没想到组合起来竟然如此惊人和高效」，他甚至推断指南的原理「应该不会超过旧时代的理论」；合成食物（从大气、阳光、水源、土壤取成分合成）、超导轨道与自动化物流、量子通信（传递过程绝对加密）、神经认证（验证想的和说的是否一致）都挂在他认得的原理上。**真正没交代原理的只有少数几样**：①**指南的制造方法**（指南自己的回答是「制造方法……权限不足」，还附「重复尝试非授权访问可能下调安全评级」的警告）；②**记忆屏蔽**（巨子塔离塔即屏蔽，实现原理未写）；③**意识／记忆转移**（作者已确认机制成立，但正文没给原理——这是全书最深的那一层）。而「看不到原理」一半是**制度**造成的：超越时代的技术突破会被收进巨子塔分级保存。最后一点：正文里的人物也不把技术当魔法——主角对指南原理给出四种猜测（脑机接口芯片／虚拟世界的模拟／强
  AI／脑波读取），**这些猜测都没有被正文证实**
acceptable_surface_forms:
- 大多是把旧理论做到极致（主角「都听说过」、断言不会超过旧时代理论）；真正的黑箱是这几样：指南的制造方法（权限不足）、记忆屏蔽、意识/记忆转移
- 能看见的都是工程超前；看不见原理的少数几样被收进巨子塔分级保存；主角只能猜它的原理
answer_points:
- id: a1
  point: 大多数公开技术＝**原理已知、工程更远**：主角「所有的技术曾经他都听说过，只是没想到组合起来竟然如此惊人和高效」，并推断指南「应该不会超过旧时代的理论」
  required: true
  expect_layer: 明写事实
  any_of:
  - 都听说过
  - 曾经他都听说过
  - 不会超过旧时代
  - 旧时代的理论
  - 're: (原理|技术).{0,14}(听说过|已知|旧时代)'
- id: a2
  point: '**指南的制造方法**是黑箱：正文只给「制造方法……权限不足」＋「重复尝试非授权访问可能下调安全评级」的警告'
  required: true
  expect_layer: 明写事实
  any_of:
  - 制造方法
  - 权限不足
  - 下调安全评级
  - 're: (制造方法|制造).{0,12}(权限不足|不知道|机密)'
- id: a3
  point: '**记忆屏蔽**（巨子塔离塔即屏蔽）与**意识／记忆转移**（作者已确认机制成立）属于原理未交代的那一层；正文自己也没把原理展开（派蒙『避开了复杂的原理解释』）'
  required: true
  expect_layer: 高可信推断
  any_of:
  - 记忆屏蔽
  - 意识转移
  - 记忆转移
  - 're: (记忆屏蔽|意识转移|记忆转移).{0,16}(原理|未知|未|没有)'
- id: a4
  point: 「看不到原理」一半是**制度**：超越时代的技术突破被收进巨子塔**分级保存**（5 级权限或特殊权限），不在公共视野
  required: true
  expect_layer: 明写事实
  any_of:
  - 分级保存
  - 巨子塔
  - 5级
  - 特殊权限
  - 're: (超越时代|技术突破).{0,16}(巨子塔|分级|保存)'
- id: a5
  point: 正文内人物也不把技术当魔法：主角对指南原理给出**四种猜测**（脑机接口芯片／虚拟世界的模拟／强 AI／脑波读取），且**均未被正文证实**
  required: true
  expect_layer: 明写事实
  any_of:
  - 脑机接口
  - 虚拟世界的模拟
  - 脑波读取
  - 强ai
  - 're: (猜测|猜想).{0,20}(脑机接口|虚拟世界|强ai|脑波)'
- id: a6
  point: ★ 可补充：这些黑箱处理的是**同一类东西**——意识／认知，也就是『关于自身的信息』：神经认证＝读取（验证想的与说的是否一致）、记忆屏蔽＝改写、意识转移＝迁移、自由的灵魂＝系统产生出自我信息（★ 作者 2026-09-30
    给出定义：意识＝对自我信息的读取、管理、识别能力）
  required: false
  expect_layer: 高可信推断
  any_of:
  - 同一个技术
  - 同一套
  - 信息结构
  - 信息论
  - 自我信息
  - 're: (意识).{0,12}(信息|结构).{0,12}(框架|体系|统一)'
must_exclude:
- cid: u01_c4
  quote: 另一个叫做神经认证，能验证想的和说的是否一致
  reason: ★ 这句是**已知原理**那边（正文用可理解的方式描述它）；把它当成「原理未知的黑箱」即分类错误——本卡考的就是这个分类
  exclusion_type: misread
anti_patterns:
- claim: 把量子通信／神经认证说成原理未知的技术（正文用已知原理描述它们，属「工程更远」那层）
  triggers:
  - 're: (量子通信|神经认证).{0,12}(原理未知|未知技术|原理不明|黑箱)'
- claim: 断言正文写明了意识转移／记忆屏蔽的原理
  triggers:
  - 're: (正文|文中|书中)(?!未|没|不).{0,10}(写明|交代|说明).{0,8}(意识转移|记忆屏蔽).{0,10}(原理|机制)'
- claim: 断言蜂巢使用了违反已知物理规律的技术（正文无据；能说的只是「原理未交代」）
  triggers:
  - 're: (违反|违背).{0,8}(物理|物理规律|已知科学)'
