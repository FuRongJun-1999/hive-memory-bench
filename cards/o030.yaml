notes: 逐章含义题（底稿第 17 章）。本章是**主角的立场宣言**：他拒绝两个极端（抛弃她们／沉迷其中），把目标定成「两个都要」，并把打法从防改成攻（用故事对抗故事）——这三件事同时把他的位置与全书的解法定了下来。
