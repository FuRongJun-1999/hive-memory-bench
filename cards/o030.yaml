span: short
inference_layer: 合理假说
question: 第十七章「反击宣告」这一章在讲什么？主角在这里立下了什么目标？
rubric:
- id: p1
  point: 主角的决定：不能抛弃派蒙她们，也不能沉迷在这个温柔乡——他需要找到一条路，既能保护蜂巢世界的人们，也能为派蒙这样的自由灵魂争取希望
  required: true
  any_of:
  - 争取希望
  - 温柔乡
  - 're: (需要找到一条路|找一条路)'
  - 're: 保护.{0,14}(蜂巢|人们).{0,14}(自由灵魂|派蒙)'
- id: p2
  point: 与派蒙的分工：把愚人众的故事改一改、让博士表现得更狡猾更会蛊惑人心，然后一起去打败他们（对派蒙来说这是一场伟大的冒险）
  required: true
  any_of:
  - 愚人众
  - 让博士表现得更狡猾
  - 冒险
  - 're: (改|改改).{0,10}(故事|愚人众)'
- id: p3
  point: 战略的转向：从被动防御转为用故事对抗故事——针对诱导绝对自由这一潜移默化的方式进行防御，在蜂巢世界里阻止他们
  required: true
  any_of:
  - 潜移默化
  - 防御
  - 阻止
  - 're: (用故事|故事).{0,14}(对抗|防御|阻止)'
- id: p4
  point: 主角的处境被写明：对派蒙她们这或许是一个故事、一场冒险、一次游戏剧情，但对他不是
  required: true
  any_of:
  - 游戏剧情
  - 一场冒险
  - 're: (对她们|对派蒙).{0,16}(故事|冒险).{0,12}(对他|但他)'
- id: p5
  point: 可补充：本章也回收了派蒙的立场——她站在他这边，但她的动机里仍有「留住他」的成分
  required: true
  any_of:
  - 留住
  - 站在
  - 're: (派蒙).{0,12}(留住|不想他走|留下)'
anti_patterns:
- claim: 把主角的目标写成只救蜂巢（他是双目标：蜂巢的人们与自由的灵魂）
  triggers:
  - 're: (目标|他).{0,12}(只|仅仅).{0,8}(保护|救).{0,8}(蜂巢|人们)'
- claim: 断言主角决定留在游戏世界（他两头都要顾，且要回去阻止自由派）
  triggers:
  - 're: (他|主角).{0,10}(决定|选择).{0,10}留在'
