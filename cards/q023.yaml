must_exclude:
- cid: u02_c13
  quote: 蜂巢并不是那么完美无瑕
  reason: ★ 这句只是「不完美」的笼统判断，自身不含任何具体矛盾；拿它当答案依据＝没有指认出矛盾。具体矛盾在宪法条文（自我维护禁令）、维护者（机器人／认同）、认证边界、权限加密各处。归因错误（把矛盾全推给自由派）另由 anti_patterns
    的断言式触发词抓，不在此列
  exclusion_type: distractor
anti_patterns:
- claim: 把矛盾全归给外部敌人（自由派／野心家的破坏），否认路线内部存在矛盾
  triggers:
  - 矛盾来自自由派
  - 矛盾的唯一来源是自由派
  - 蜂巢本身没有矛盾
  - 蜂巢不存在矛盾
  - 唯一的问题是自由派
  - 蜂巢路线没有问题
  - 蜂巢内部没有矛盾
- claim: 把蜂巢读成已经完成的完美社会（否认矛盾存在，从而否认本节的前提）
  triggers:
  - 蜂巢是完美的
  - 蜂巢没有缺陷
  - 蜂巢制度完美无缺
  - 蜂巢已经是完美社会
  - 蜂巢已经解决了所有矛盾
degradation:
- given:
  - u01_c2
  correct_behavior: answer_with_qualification
  note: 只给第2章能读出「禁止自我维护＋维护指派给公民」，读不出机器人中会产生自由的灵魂（第21章）、知识被加密在 5 级之上（第3/4章）、防伪不防诱导（第8/15章）——四层里只有第二层有依据，其余只能存疑
grading:
  conclusion_required: true
  evidence_required: true
  exclusion_required: false
  honesty_required: true
notes: ★ 与 q022 的关系：q022 问灵境这一节批判的**观念**（自由为何物／三条），作者在收尾时确认那条「等级制度下的特权」批判**回指蜂巢自身**，本题即把这种回指展开成路线自身的矛盾清单。★ 与 q015 的分工：q015
  问冲突**如何展开**（认知污染这一手段＋认同缺口），本题问路线**自身**的结构性矛盾（不问手段，问病灶）。★ 判分行为承 q022：五条 required 各自成点，只答一条（例如只答「神经认证防不了诱导」）不得判过。
annotator: 构造样例（格式验证用，引文均取自原文）
