qid: o034
kind: open
category: 故事含义
unit_ids:
- u03
span: short
inference_layer: 合理假说
question: 第二十二章「谢谢你 诺艾尔」这一章在讲什么？它推演出的结果是什么？
rubric:
- id: p1
  point: 本章是一次时间跳跃的推演：琴团长去世之后，西风骑士团的改变尤为明显
  required: true
  any_of:
  - 琴团长去世
  - 改变
  - 're: (去世|之后).{0,14}(改变尤为明显|尤为明显)'
- id: p2
  point: 变质的细节被逐条列出：年轻的面孔取代熟悉的老兵、废除了琴时代延续下来旨在维护平民权益的政策、骑士团成员的后辈开始继承父辈的荣耀、大商人崛起
  required: true
  any_of:
  - 年轻的面孔
  - 维护平民权益
  - 继承父辈
  - 're: 政策.{0,12}(废除|取消)'
- id: p3
  point: 骑士团的转向：加入骑士团不再是为了誓言，而是为了特权、财富，以及那份可以凌驾于他人之上的自由；骑士们不再巡逻街道，而是驻守在商会与贵族宅邸前收取治安税
  required: true
  any_of:
  - 不再是为了誓言
  - 特权
  - 治安税
  - 're: (驻守|守).{0,14}(商会|贵族)'
- id: p4
  point: 诺艾尔的对照被写出来：她擦拭骑士团的徽章、认为能够帮助到他人的财富才有意义，仅仅为了独占而消费背离了骑士守护与奉献的精神
  required: true
  any_of:
  - 能够帮助到他人的财富才有意义
  - 独占
  - 're: 奉献.{0,12}(精神|背离)'
- id: p5
  point: 落点：主角说「谢谢你，诺艾尔」——这场推演让他看清守护不能系于个人，制度一旦失守，同样的骑士团会变成另一副样子
  required: true
  any_of:
  - 谢谢你，诺艾尔
  - 系于个人
  - 're: (制度|守护).{0,14}(失守|不能系于)'
anti_patterns:
- claim: 把推演结果说成故事当下已经发生（第22章是派蒙加速推演出的后续）
  triggers:
  - 're: (琴|骑士团).{0,12}(已经|当下).{0,10}(去世|变质)'
- claim: 把诺艾尔与变质的骑士团混为一谈（她是那个时代延续下来的对照）
  triggers:
  - 're: 诺艾尔.{0,12}(也|同样).{0,10}(变质|为特权)'
