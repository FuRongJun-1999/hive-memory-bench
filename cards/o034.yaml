notes: 逐章含义题（底稿第 22 章）。本章是**全书的反证章**：它没有写自由派，只写时间——一旦承载守护的人不在了、制度又没接住，同一个骑士团就会亲手废除自己的政策。它把 q022 里「守护要靠制度」这条从批判推成了结论。
annotator: 构造样例（逐章含义；引文均取自原文）
