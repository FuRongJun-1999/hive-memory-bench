qid: o003
kind: open
category: 故事含义
unit_ids:
- u01
- u02
- u03
span: long
inference_layer: 合理假说
question: 「自由」在故事中被呈现为两种对立形态。请说明蜂巢世界与游戏世界（蒙德）各自的自由观，以及作品最终给出的立场。
rubric:
- id: p1
  point: 蜂巢世界的现状是矫枉过正：为消除旧时代的动乱根源，效率为公平让路、隐私给安全低头、自由被当作威胁清除
  any_of:
  - 矫枉过正
  - 效率为公平让路
  - 隐私给安全
  - 自由人人喊打
  - 威胁必须清除
  - 压制自由
  required: true
- id: p2
  point: 蒙德被设定为'自由的城邦'，是风神为实践自由理念而造的世界，主角初到时即点出这份自由与蜂巢的对照
  any_of:
  - 自由的城邦
  - 蒙德
  - 风神
  required: true
- id: p3
  point: 蒙德的推演结局显示：缺乏约束的自由会走向'一切为了自由'口号下少数人得利、多数人被压榨的境地
  any_of:
  - 缺乏约束
  - 少数人
  - 压榨
  - 一切为了自由
  - 天平
  required: true
- id: p4
  point: 主角方面把这一推演用于现实：自由派正是把绝对自由包装成乌托邦，借游戏世界向蜂巢渗透
  any_of:
  - 自由派
  - 乌托邦
  - 包装
  - 渗透
  - 糖衣
  required: true
- id: p5
  point: 作品给出的立场落在'自由不是无拘无束，而是共同守护的秩序'——既不接受蜂巢式取消自由，也不接受绝对自由
  any_of:
  - 共同守护
  - 秩序
  - 不是无拘无束
  - 守护的秩序
  required: true
- id: p6
  point: 可补充：第 15 章把绝对自由/私有制/永生列为三大前提做数学推演，是这条主题线的论证段落（结论指向'永恒奴役'）
  any_of:
  - 三大前提
  - 绝对自由
  - 私有制
  - 永生
  - 终产者
  required: false
anti_patterns:
- 作品主张绝对自由，认为约束都是压迫
- 作品主张放弃自由换取安全，认可蜂巢的现状
- 蒙德的推演说明自由本身必然导向灾难（作品明确否定了这一读法）
evidence_pool:
- cid: u01_c8
  quote: 效率为公平让路，隐私给安全低头，自由人人喊打，威胁必须清除。
  supports:
  - p1
- cid: u02_c9
  quote: 第一站，是自由的城邦——蒙德
  supports:
  - p2
- cid: u02_c15
  quote: 已知有三大前提。一、绝对自由，个体行为不受任何集体共识约束，以自身观念为准则。
  supports:
  - p6
- cid: u03_c22
  quote: 缺乏约束的自由。终究和过去无数次重演的历史一样，变成了少数人的自由。
  supports:
  - p3
- cid: u03_c22
  quote: 不是自由本身的错误，也不是风神理想的失败
  supports:
  - p3
- cid: u03_c23
  quote: 他们把绝对自由包装成乌托邦
  supports:
  - p4
- cid: u03_c23
  quote: 自由，不是无拘无束，而是共同守护的秩序。
  supports:
  - p5
grading:
  mode: rubric
  coverage_required: 0.7
  evidence_required: true
  anti_pattern_penalty: true
notes: 跨全部三个单元。必答点分布在三个单元（蜂巢现状 u01、蒙德设定 u02、推演结果与立场 u03），只答'自由的两面'而漏掉立场句的，覆盖率不足 0.7。
annotator: 构造样例（格式验证用，引文均取自原文）
