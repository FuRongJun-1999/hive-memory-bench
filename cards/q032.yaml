  - 're: (权限).{0,10}(不同|不一样|差别)'
must_exclude:
- cid: u03_c19
  quote: 风神巴巴托斯大人不是已经慷慨地将它赐予我了吗
  reason: ★ 这是**蒙德世界的神格名号**（巴巴托斯／温迪），与派蒙口中的「风神大人」（创造者）**同词不同指**；把两者当成同一人即混同——本题要的恰恰是分辨这两种「风神」
  exclusion_type: misread
- cid: u02_c13
  quote: 他和你很像，但你们终究是不一样的
  reason: 这句话说的是**风神与现在的陈默**像而不同——不能拿来推出「风神就是现在的陈默本人」
  exclusion_type: misread
anti_patterns:
- claim: 把风神与巨子说成两个不同的人
  triggers:
  - 're: (风神|创造者).{0,10}(不是|并非).{0,8}(巨子|陈默)'
  - 're: (两个|不同的).{0,6}(人|陈默).{0,10}(风神|巨子)'
- claim: 把派蒙说成普通 NPC／程序（正文称她们为自由的灵魂、并明写与「完全按照程序的机器人」不同）
  triggers:
  - 're: 派蒙.{0,10}(是|只是).{0,6}(普通|一般).{0,4}(npc|程序)'
  - 're: (自由的灵魂).{0,10}(只是|不过是).{0,8}(程序|设定|npc)'
- claim: 把灵境说成蜂巢内部的设施（正文写自由灵魂被安放于此、且它们在蜂巢被禁）
  triggers:
  - 're: 灵境.{0,10}(是|属于).{0,8}(蜂巢).{0,6}(内部|设施|一部分)'
