  - 否决
  - 're: (背叛|叛徒).{0,12}(不断|一直|发生|周清源)'
- id: a5
  point: 可补充：自由派利用灵境做渗透（认知污染），使局面进一步偏离
  required: false
  any_of:
  - 自由派
  - 渗透
  - 认知污染
  - 诱导
