  - 不肯当
  - 不肯开永生的头
  - 替后人拍板
  - 're: (不肯|不愿).{0,8}(枷锁|永生|束缚)'
- id: a4
  point: 人类一侧不可托付：他认为人类不值得永远信任、背叛不断发生（周清源被斥叛徒、其提案被否决）
  required: true
  any_of:
  - 不值得永远信任
