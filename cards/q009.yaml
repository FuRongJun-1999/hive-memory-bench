question: 巨子陈默的遗愿为什么没有执行？
necessary_conclusion: 有四层原因：一是那个难题他本人就没解决——他自述面对一个永恒的难题、只能不断尝试，交出去的是问题而非答案；二是最像答案的那批存在（机器人中自生的自由灵魂）在蜂巢初建后不久就被禁止，只能被安放在灵境，无法公开出场；三是他拒绝永生也拒绝权威、不愿成为束缚，因此即便长眠也不以权威的形式代为执行；四是人类一侧不可托付——他认为人类不值得永远信任、背叛始终在不断发生（周清源被众人斥为叛徒，其提案被投票否决）
acceptable_surface_forms:
- 因为难题他没解出来（交的是问题不是答案）；能当答案的自由灵魂在蜂巢被禁、只能藏在灵境；他自己又不肯永生、不肯当束缚；而人类这边他也不信——他说人类不值得永远信任，背叛一直在发生
- 四条：难题本身未解、候选答案被禁止、他不愿以权威形式执行、人类不可托付
answer_points:
