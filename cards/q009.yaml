  - 没能解决
  - 不断尝试
  - 未竟
  - 交给你
  - 后来人
  - 're: (没能|没有|未).{0,6}(解决)'
  paraphrase:
  - 解不掉
  - 题没解开
  - 交下来的只是问题
  - 're: (难题|问题).{0,10}(没|未|解不掉|交)'
  - 're: (解不掉|没解开|未解)'
- id: a2
  point: 候选答案被禁止：具有自我意识的 AI 在蜂巢初建后不久就被禁止，自由灵魂只能安放于灵境
  required: true
  any_of:
  - 禁止
  - 自我意识
  - 安放
  - 安生之地
  - 灵境
  - 藏
  - 're: (禁止|被禁).{0,14}(ai|AI|自我意识)'
- id: a3
  point: 他不愿成为束缚、不能开永生的头，故即便长眠也不以权威形式执行
  required: true
  any_of:
  - 束缚
  - 不能开
  - 反对永生
  - 反对权威
  - 先行者
  - 're: (不|拒绝|反对).{0,8}(成为).{0,4}(束缚)'
  paraphrase:
