qid: o039
kind: open
category: 故事线索
unit_ids:
- u01
- u03
span: long
inference_layer: 高可信推断
question: 线索题：同名、失忆、异常记录、后来者——主角身世的这条线是怎么串起来的？
rubric:
- id: p1
  point: 第一环是名字：以开国领导人的名字起名本身就是极大的忌讳，出于尊敬人们在取名时都会避开这个名字——可现存同名公民已有五个
  required: true
  any_of:
  - 忌讳
  - 避开这个名字
  - 五个
  - 're: (取名|名字).{0,16}(避开|忌讳)'
- id: p2
  point: 第二环是失忆：他进过巨子塔（记录写着具体时间），而离开巨子塔后会进行记忆屏蔽，所以他丢掉了那一段
  required: true
  any_of:
  - 记忆屏蔽
  - 巨子塔
  - 're: (离开巨子塔).{0,14}(屏蔽|失忆)'
- id: p3
  point: 第三环是后果：巨子塔的失忆与异常的通行记录让他被怀疑成自由派的探子，甚至被严密处理
  required: true
  any_of:
  - 异常
  - 通行记录
  - 探子
  - 're: (怀疑|被怀疑).{0,12}(探子|自由派)'
- id: p4
  point: 第四环是这套措施本身的来历：记忆屏蔽是为「拿了授权就跑路」这类先例加的——说明他这样的同名者不是第一次出现
  required: true
  any_of:
  - 拿了授权就跑路
  - 记忆屏蔽技术
  - 're: (先例|上次|上一个).{0,16}(授权|跑路)'
- id: p5
  point: 链条的落点：他想查自己的来历，却发现自己正被当作「后来者」——他脑中浮现的是巨子的回忆，而巨子留下的信息称他后来者
  required: true
  any_of:
  - 后来者
  - 巨子的回忆
  - 're: (查|来历).{0,16}(后来者|巨子)'
anti_patterns:
- claim: 把失忆说成偶然事故（它是制度化的记忆屏蔽措施）
  triggers:
  - 're: (失忆|记忆丢失).{0,12}(偶然|意外|事故)'
- claim: 断言他是第一个与巨子同名的公民（正文写着这是第五个）
  triggers:
  - 're: (他|主角).{0,10}(第一个|首个).{0,10}同名'
evidence_pool:
- cid: u01_c3
  quote: 以开国领导人的名字起名，这本身就是极大的忌讳
  supports:
  - p1
- cid: u01_c5
  quote: 出于尊敬，我们在取名时都会避开这个名字
  supports:
  - p1
- cid: u01_c4
  quote: 在离开巨子塔后会进行记忆屏蔽
  supports:
  - p2
- cid: u01_c8
  quote: 巨子塔的失忆，异常的通行记录
  supports:
  - p3
- cid: u01_c6
  quote: 上次那小子拿了授权就跑路
  supports:
  - p4
- cid: u03_c21
  quote: 那是巨子的回忆
  supports:
  - p5
grading:
  mode: rubric
  coverage_required: 0.7
  evidence_required: true
  anti_pattern_penalty: true
  exclusion_required: false
notes: 线索题（因果链）。这条线把 q007／q029 的分散答案串成一条：**名字（被赋予）→ 失忆（制度措施）→ 被怀疑（通行记录）→ 先例（记忆屏蔽的来由）→ 落点（后来者）**。第五环是全书的接口。
annotator: 构造样例（逐章含义；引文均取自原文）
