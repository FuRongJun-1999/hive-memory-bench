notes: ★ 与相邻题的分工：q023 问蜂巢路线自身的矛盾（认知/等级/维护者），q024 问巨子思想的来路，本题问**技术水位线为什么定在这里**（世界观的可信度问题）。★ 三处呼应：巨子塔分级保存与 q001 的「5 级权限动机」、q023
  的「知识被加密在 5 级之上」是同一条线；第16章「智能涌现」与 q016 的自我意识、q023 的「维护者会生出自我」同源。★ 判分行为承 q022–q024：六条 required 各自成点，只答「因为被巨子塔封存了」这一条不判过。★
  **本题显式不设 must_exclude**（见文件内注释）：原先排掉的那句「无人化…被失业人群抨击」被作者 2026-09-29 补的第四条要点正名——它是要点本身，排它即误杀正解；据此 `check_all.py` 的「must_exclude
  至少 1 条」已由错误降为警告（须写明无排除项的理由）。★ 第四条要点同时回答了问题里「看起来远比现在发达」那一半，是本题的**解释闭合点**：发达感来自制度用足了同一水位上的技术。
