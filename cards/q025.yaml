question: 为什么蜂巢世界看起来远比现在发达，却处处没有超出认知的技术？
necessary_conclusion: 三层原因叠在一起。第一，它离现在并不远：指南开篇就宣告「现在是2045年」，旧时代就是主角来的那个时代，中间只隔一场第三次世界大战——所以蜂巢是同代人重建的世界，不是遥远未来，它的技术底座本来就是旧时代的遗产；看起来发达的是生活方式与组织形态（按需分配、食物合成、机器人服务、超导轨道网络，乃至朝太阳系铺开）。第二，真正超出时代的那部分被制度性收走了：第5章明写，一旦涉及军用或出现「超越时代的技术突破」，都会「将技术转移到巨子塔进行分级保存」——巨子塔既是文明的圣地，「也是守护蜂巢世界的尖刺」，进去要
  5 级贡献或特殊权限，所以主角连指南的原理都只能猜。也就是说不是没有，而是不在公共视野里。第三，公开在用的技术走的是「拿旧理论做到极致」而不是发明新原理：主角自己就断言指南「应该不会超过旧时代的理论」，候选列的是内置化脑机接口芯片、虚拟世界的模拟、强ai、脑波读取；量子通信和神经认证是「这样的技术我们已经有了」；机器人来自战争与战后民用化（「智能化机器人大战，迫使我们设计出了各种功能的机器人」，那时叫智能工兵；战后「我们将这些军用技术民用化，因为我们这些幸存者太少了」）。再加上战争砍断了知识与人口：三战几乎摧毁一切、地表生态崩溃、「许多资料都不复存在了」，历史只剩幸存者的回忆，人口九成九以上损失、青年断层——文明的目标从开拓转成保住。第四层专门回答「看起来发达」这一半：旧时代的阻碍连同旧势力一起被清除了，新制度把技术的优势用足——旧时代是技术有、推不动（「自动化，智能化，无人化的科技发展被广大的失业人群愤怒抨击」，核心与军事技术又锁在保密与军用里），战后这些阻碍不复存在，「我们将这些军用技术民用化」，而按需分配托底让机器人替代劳动不再构成失业威胁、按劳分配开路加贡献点与公民授权让技术与创意被激励（「这世界就给你搭天梯」），神经认证与量子通信又把旧时代的信息错配补上了。所以「远比现在发达」的感觉来自**制度用足了同一水位上的技术**，而不是技术本身超前。唯一真正新过的东西是智能涌现（过去的技术突破确实导致具有自我意识的
  ai 出现），而它被禁止继续推进
acceptable_surface_forms:
- 三层：一是它离我们只有二十年——现在是2045年，旧时代就是主角来的那个时代，中间隔着一场大战，所以它是同代人拿旧技术重建的，发达的是生活方式不是原理；二是真正超前的突破被收走了——第5章说涉及军用或超越时代的技术突破都会转移到巨子塔分级保存，那是守护蜂巢的尖刺，要5级才能进，所以主角连指南怎么造的都只能猜；三是公开的技术都是拿旧理论做到底——主角判断它不会超过旧时代的理论（脑机接口、虚拟世界、强ai、脑波读取），量子通信和神经认证是旧时代就有的，机器人是战时军用技术民用化来的。再加上大战毁了资料和人口，只能守成。唯一真正新的是智能涌现，还被禁了
- 不是没有超前技术，而是①时间上只隔一场大战（现在是2045年，同代人重建）②超前的被巨子塔分级封存、要5级权限③公开在用的都是旧时代理论的极致化（脑机接口／虚拟世界／强ai／量子通信／神经认证／军用机器人民用化），加上战争造成知识断层，只能守成
