anti_patterns:
- claim: 把原因归为蜂巢刻意愚民／压制科技以维持统治
  triggers:
  - 蜂巢刻意压制科技
  - 为了维持统治而封锁技术
  - 故意让技术停滞
  - 愚民政策
  - 不让公民变聪明
  - 蜂巢害怕技术进步
- claim: 把蜂巢世界整体说成虚拟／游戏世界（以此解释技术水位线）
  triggers:
  - 蜂巢其实是虚拟世界
  - 蜂巢世界是游戏
  - 整个蜂巢都是模拟
  - 现实也是虚拟的
  - 蜂巢只是一个游戏
- claim: 断言蜂巢没有任何技术突破（与正文相反：突破发生过，只是被收走或被禁止）
  triggers:
  - 蜂巢没有任何技术突破
  - 蜂巢的技术完全停滞
  - 从未有过技术突破
  - 蜂巢根本没有新技术
