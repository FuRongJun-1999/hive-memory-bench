notes: 全部落在 u01。★ 本题要否掉的是两个方向的简化：①'全体公民一律'（忽略分级与撤销）②'只有高级贡献者才能维护'（忽略了主角 L1 也在做维护）。正确答案是三层的：门槛分级＋资格可撤销＋人力本就稀少。
