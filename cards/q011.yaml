  reason: ★ 这是'按需分配保障基本生存'的条款，说的是食物而非权限资格；拿它推出'维护资格也是全体平等'即误读
  exclusion_type: misread
- cid: u01_c5
  quote: 大科学家，大贤者
  reason: ★ 反向误读：据此答'只有5级的大科学家大贤者才能维护'也不对——主角是 L1，一样在履行维护义务
  exclusion_type: misread
