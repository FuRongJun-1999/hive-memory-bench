  exclusion_type: misread
anti_patterns:
- claim: 把事件线写成只有游戏世界（蒙德）一条，漏掉蜂巢一侧的因果
  triggers:
  - 故事只发生在蒙德
  - 主要事件都跟游戏有关
  - 蜂巢那边没有发生什么事
  - 事件只有蒙德这一条线
- claim: 把三战写成与旧时代矛盾无关的纯天灾／外敌入侵
  triggers:
  - 三战是外星入侵
  - 世界大战纯属意外
  - 与旧时代的矛盾无关
  - 战争是自然灾害造成的
- claim: 把认知污染写成已经解决的问题（与正文相反：它是当前进行中的主线冲突）
  triggers:
  - 认知污染已经解决
  - 自由派已经被消灭
  - 危机已经过去
  - 污染问题已经处理完毕
