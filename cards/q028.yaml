question: 故事的主要事件有哪些？（按起因／经过／结果说）
necessary_conclusion: 按事件的骨架说，有六件。**一、旧时代的崩塌（第三次世界大战）**：起因是旧时代自己的矛盾——自动化、智能化、无人化的科技发展被广大的失业人群愤怒抨击，信息错配让反馈失灵、纵容腐败；经过是核战争、细菌病毒战和机器人大战；结果是九成九以上的人口消失、地表生态彻底崩溃，幸存者失去回到地面的条件，只能转入轨道求生。**二、蜂巢世界的建立**：起因是幸存者要在废墟上重建秩序，而巨子把病根诊断为信息错配；经过是用量子通信与神经认证解决信息传递、按需分配托底加贡献点按劳分配搭建经济系统、用宪法禁止系统自我维护，靠机器人把世界真正建起来；结果是极小化剥削和压迫的新世界成立，而巨子在建立后几年就积劳成疾去世。**三、巨子的反对永生与权威**：经过是他明确反对永生、反对权威，认定不能开永生的头；结果是他的遗愿没有被执行，复制体存在，宪法也不许任何自我延续——制度的缺口就这么留下了。**四、自由派的认知污染（当前主线冲突）**：起因是巨子的理论有漏洞——神经认证能防造假，防不了诱导；经过是自由派借沉浸式游戏绕过认证，把绝对自由、私有制、永生包装成故事向公民播种，目标直指巨子；结果是主角发现并上报，警戒检查中心定性为高度潜在威胁，并得出要认知疫苗而不是认知防火墙的结论。**五、主角进巨子塔与失忆**：起因是他要查自己的来历与创始人的资料；经过是他进入巨子塔、离开后被记忆屏蔽；结果是他丢掉那段记忆，只留下对机器人的共情和「我还是我吗」的疑问，身世之谜成了他行动的推力。**六、灵境里蒙德的事件线**：起因是他在游戏世界遇到派蒙并发现自由派的布置；经过是讨伐特瓦林、自由派用商人推销与王者叙事渗透、博士与富人设下把安全与绝对自由和永生绑定的陷阱、骑士团与蒙德居民把阴谋击退；结果是阴谋失败，而模拟显示琴之后骑士团变质、商人崛起。最后是收束：他在摘星崖与派蒙她们离别，决定回去阻止自由派把自由变成奴役——游戏世界的教训由此接回蜂巢的现实。整条因果链可以压成一句：旧时代的失败源于信息错配，蜂巢用制度与认证重建了它，但认证防不了诱导，自由派正是从这道缺口攻入，而主角在灵境里看清了后果，才决定回去堵它
acceptable_surface_forms:
- 六件事。一是旧时代崩塌：起因是旧社会自己的病（无人化被失业人群骂、信息错配让反馈失灵），经过是三战（核战、细菌病毒战、机器人大战），结果是九成九以上人口没了、地表生态崩了，人只能上轨道。二是蜂巢建立：起因是要在废墟上重建，巨子把病根判为信息错配；经过是量子通信＋神经认证、按需分配＋贡献点、宪法禁止自我维护、机器人建设；结果是新世界成立，巨子积劳成疾去世。三是巨子反对永生与权威，结果遗愿没执行、复制体存在、宪法不许自我延续——缺口留下。四是自由派的认知污染：起因是神经认证防不了诱导，经过是用沉浸式游戏绕过认证播种绝对自由／私有制／永生，结果是主角上报、警戒中心定性为高度威胁、提出认知疫苗。五是主角进巨子塔后失忆，成了他查身世的推力。六是灵境蒙德线：讨伐特瓦林、博士与富人的陷阱、骑士团与居民击退、琴之后骑士团变质。收束是他决定回去阻止自由派把自由变成奴役
- 起因（三战与旧时代崩塌）→ 经过（蜂巢建立／巨子反永生反权威／自由派用游戏渗透）→ 结果（主角失忆查身世、蒙德击退博士与富人、主角决定回去堵住认知污染的缺口）
