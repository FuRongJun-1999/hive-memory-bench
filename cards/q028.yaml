notes: ★ 本题是「主要事件」类的锚题（该类计划 10 题，这是第 1 题）。作者把小说看记叙文：时间（q025 的 2045 年线）、地点（q027 的双层空间）、人物（q026 的两拨名册）已各有卡片，本题补**事件**，并要求每个事件都带**起因／经过／结果**三端。★
  与相邻题的分工：q015 问冲突如何展开（手段与缺口），q023 问路线自身的矛盾，q008/q009 问复制体与遗愿——本题只做**事件序列**，细节由那几题承担。★ 判分行为承 q022–q027：六条 required 各自成点，只答一侧（现实侧或游戏侧）或只答经过不答因果，都不判过。
