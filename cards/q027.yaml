must_exclude:
- cid: u03_c19
  quote: 把蒙德的鱼卖到璃月甚至至冬去
  reason: ★ 那是商人的推销话术，璃月、至冬只作为贸易目的地被提及，故事从未去过；把它们当成「主要地点」即误读——本题的场景只有蜂巢与灵境（蒙德）两侧
  exclusion_type: distractor
anti_patterns:
- claim: 把游戏世界当成独立于蜂巢的真实世界（漏掉它由巨子所造、就在蜂巢之内这一层）
  triggers:
  - 提瓦特是另一个真实世界
  - 灵境是一个独立世界
  - 游戏世界与现实无关
  - 故事发生在两个平行世界
- claim: 把故事主要场地写成地球地表／旧时代城市
  triggers:
  - 故事发生在地表
  - 主要场景是地球表面
  - 旧时代的城市是主场景
  - 蜂巢建在地面上
- claim: 把游戏原作的其他国家（璃月／稻妻／须弥等）当成故事场景
  triggers:
  - 故事发生在提瓦特七国
  - 场景横跨璃月与蒙德
  - 主要地点包括璃月
  - 故事走遍了七国
