notes: ★ 本题是「主要地点」类的锚题（该类计划 8 题，这是第 1 题）。★ 结构要点：故事的空间是**双层**的——轨道上的蜂巢（白、秩序、节点）与灵境里的蒙德（风、诗歌、自由），两侧各立着一座同一人的纪念物（巨子塔／风神像），这一层列为
  optional 而非 required（答出地点名册即达标，看出镜像结构是加分）。★ 与相邻题的分工：q005/q018 问游戏侧人物的身份，q023 问路线矛盾，本题只做**空间名册**。★ 判分行为承 q022–q026：六条 required
  各自成点，只答一侧（只答蜂巢或只答蒙德）不判过。
annotator: 构造样例（格式验证用，引文均取自原文）
