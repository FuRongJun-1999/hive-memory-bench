question: 故事的主要地点、场景有哪些？
necessary_conclusion: 分两个世界。**现实侧是蜂巢世界**——建在地球轨道上的巨型结构，由超导轨道与舱室组成的「自循环交通网络」串起来（时速一千公里），景致是「一望无际的六边形白色海洋」，按功能分成各种节点：通用基础居住区、食物合成中心节点、公共知识节点、核心信息存储节点、军事研发中心。具体场景里最要紧的是四处：**巨子塔**（核心信息存储节点，要
  5 级或特殊权限，是巨子的长眠之地与所有系统核心指令的最终备份点，离开后记忆屏蔽——主角正是在这里失忆）；**求知园**（公共知识节点，有贡献点查询机与风味实验室，主角与张明远在此相遇）；**警戒检查中心节点**（巨大的环形建筑，颜色「类似巨子塔的漆黑，散发着冷峻气息」，重型装甲机器人与全密封防护服的巡逻者）；以及**旧时代的遗存场景**——军事研发中心「破军」、需要全方位防护服的遗存区（里面沉睡的是机械犬、智能坦克、智能无人机），还有张明远当年躲避战争的地下避难所。主角的日常空间则是居住区的舱室与食物合成厨房，以及他干活的那片轨道（十三台轨道清洁机器人）。**另一侧是灵境，即游戏世界里提瓦特的蒙德**——「自由之地」、风与诗歌之都：蒙德城、西风骑士团总部（琴那间堆满文件的办公室）、广场与风神像（七天神像）、图书馆、果酒湖。几个关键场景各自承担剧情节点：**风龙废墟**是讨伐特瓦林之处；**风神像的手掌**是主角与派蒙坐着俯瞰蒙德之处；**摘星崖**是带着花香的离别处；**无风之地**是幻想朋友那个故事的背景。还有一处结构值得点出：两个世界各立着同一个人留下的纪念物——巨子塔是他的长眠之地与系统备份点，风神像供着的就是他本人（风神＝巨子）；而主角的动线从舱室与轨道，到求知园、巨子塔、警戒检查中心，再进蒙德、上摘星崖，最后回到舱室，那句「仿佛一场过于真实的梦境」正是两个空间的分界
acceptable_surface_forms:
- 两个世界。现实侧是蜂巢世界：地球轨道上的巨型结构，轨道和舱室连成自循环交通网络，看着是六边形的白色海洋，按功能分节点——居住区、食物合成、公共知识、核心信息存储、军事研发。要场所有：巨子塔（要5级权限，巨子的长眠之地和系统备份点，出来就记忆屏蔽，主角就是在那里失忆的）、求知园（公共知识节点，有贡献点查询机和风味实验室，他在这里遇到张老）、警戒检查中心（环形建筑，跟巨子塔一样的漆黑冷峻，装甲机器人和全密封防护服巡逻）、还有旧时代遗存区（破军、要穿全方位防护服的那片，里面是机械犬智能坦克智能无人机）和旧时代的地下避难所。另一侧是灵境的蒙德：自由之地、风与诗歌之都——蒙德城、骑士团总部、广场上的风神像、图书馆、果酒湖；风龙废墟打特瓦林、风神像手掌上俯瞰蒙德、摘星崖上带着花香的离别、无风之地的幻想朋友。两边的对称是：巨子塔和风神像纪念的是同一个人
- 现实侧＝蜂巢世界（轨道上的六边形白色海洋／自循环交通网络／各类节点；巨子塔、求知园、警戒检查中心、破军的旧时代遗存区、地下避难所、居住区舱室）；游戏侧＝灵境的蒙德（自由之地：蒙德城、骑士团总部、风神像、图书馆、果酒湖、风龙废墟、摘星崖、无风之地）
