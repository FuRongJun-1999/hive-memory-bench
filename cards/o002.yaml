qid: o002
kind: open
category: 作者相关
unit_ids:
- u01
- u02
- u03
span: long
inference_layer: 合理假说
question: 这篇小说在「谁在讲述」上做了哪些形式安排？请指出至少两处叙述层的设计并说明各自的作用。
rubric:
- id: p1
  point: 开篇不是故事本身，而是'指南'以导览口吻发话，先立规则（观看指南、遵守共识）再让主角入场——叙述框架先于人物出现
  any_of:
  - 开篇
  - 开头
  - 指南
  - 观看
  - 遵守
  paraphrase:
  - 导览口吻
  - 交代规矩
  - 先交代规矩
  - 人物随后才出现
  - 人物才出现
  - 're: (导览|口吻).{0,16}(规矩|共识|交代)'
  required: true
- id: p2
  point: 正文以第三人称跟随主角陈默；而'指南'在故事内部同时是查询终端与这层框架的来源，形成'框架内也存在叙述者'的结构
  any_of:
  - 第三人称
  - 指南
  - 百科目录
  - 操作终端
  - 百科
  paraphrase:
  - 旁观视角
  - 旁观
  - 跟着主角
  - 're: (旁观|旁白).{0,12}(视角|跟着)'
  required: true
- id: p3
  point: 末段出现形式突转：第 22 章整章改为第一人称'我'叙述，该章内不再出现'陈默'这个称呼
  any_of:
  - 22章
  - 第二十二章
  - 第一人称
  - 人称切换
  - 视角转换
  - 人称变
  required: true
- id: p4
  point: 第 23 章恢复第三人称（重新以'陈默'为主语），突转被复位——它是一段有边界的形式安排，不是叙述者换人
  any_of:
  - 23章
  - 第二十三章
  - 恢复第三人称
  - 回到第三人称
  - 复位
  paraphrase:
  - 换回旁观视角
  - 又换回
  - 换回第三人称
  - 're: (23|二十三).{0,10}(换回|恢复|回到)'
  required: true
- id: p5
  point: 第 22 章的第一人称对应游戏世界内的角色身份：该章中的'我'被角色称作'旅行者'，与蜂巢世界的第三人称'陈默'是分层关系
  any_of:
  - 旅行者
  - 游戏角色
  - 游戏内的角色
  - 扮演
  required: true
- id: p6
  point: 可补充：章题'谢谢你 诺艾尔'与该章人称切换相互呼应（把情绪落点放在第一人称章）
  any_of:
  - 谢谢你 诺艾尔
  - 谢谢你诺艾尔
  - 章题
  - 标题
  required: false
anti_patterns:
- 全书采用第一人称叙述
- 第 22 章的「我」是作者本人或现实中的写作者
- 「指南」在故事中被明确揭示为一个具有独立人格的角色
evidence_pool:
- cid: u01_c1
  quote: 请观看本指南，遵守新世界的共识
  supports:
  - p1
- cid: u01_c2
  quote: 指南不仅作为百科目录，同时也可以作为个人操作终端
  supports:
  - p2
- cid: u01_c8
  quote: 陈默对蜂巢世界有了部分了解
  supports:
  - p2
- cid: u03_c22
  quote: 为了解答心中的疑惑，我和派蒙悄悄来到了蒙德城图书馆深处一间僻静的阅览室。
  supports:
  - p3
- cid: u03_c22
  quote: 您怎么了？旅行者？
  supports:
  - p5
- cid: u03_c23
  quote: 陈默的眼神坚定
  supports:
  - p4
grading:
  mode: rubric
  coverage_required: 0.7
  evidence_required: true
  anti_pattern_penalty: true
notes: 跨全部三个单元。核心是第 22 章的人称突转（该章'陈默'出现 0 次）与第 1 章的指南框架；只答第一人称突转、漏掉开篇框架的，覆盖率不足 0.7。
annotator: 构造样例（格式验证用，引文均取自原文）
