notes: 逐章含义题（底稿第 18 章）。本章是**方法章**：把第15章推演出的威胁做成可操作的剧本，于是读者第一次看清「糖衣」的构造（绝对自由＋乌托邦故事＋感官刺激＋风之种式的说服装置），而主角的任务随之从写故事变成拆故事。
