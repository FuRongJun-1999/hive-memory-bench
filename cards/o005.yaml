qid: o005
kind: open
category: 故事含义
unit_ids:
- u01
- u02
- u03
span: long
inference_layer: 合理假说
question: 故事里的技术设定与现实技术是什么关系？作品用什么方式把这个关系讲了出来？
rubric:
- id: p1
  point: 蜂巢世界的技术都能追溯到现实已有的技术族（光幕/全息显示、机器人、合成食物、神经与脑机方向、数据与备份、轨道运输等），没有超自然设定
  required: true
  any_of:
  - 全息
  - 光幕
  - 机器人
  - 合成
  - 脑机
  - 数据备份
  - 现有技术
  - 已有的技术
  - 现实已有
  - 现实中已经
  - 可追溯到
  - 现实技术
- id: p2
  point: 游戏世界（蒙德）另有原作设定的元素力与神之眼，但那属于游戏的既有世界观，不是故事对未来现实技术的设想
  required: true
  any_of:
  - 原作
  - 既有设定
  - 游戏设定
  - 不是故事
  - 不是它的发明
  - 不属于未来技术
  - 不是作品
  - 既有世界观
  - 're: (原作|游戏自带|游戏既有|游戏原).{0,10}(设定|世界观|既有)'
  - 're: (不是|并非|不属于).{0,8}(故事|作品|未来|现实).{0,6}(设定|发明|技术|设想)'
- id: p3
  point: 第 22 章的推演主动剥离这些超凡设定（模拟一个没有神之眼、没有永恒寿命的蒙德城），只保留现实技术
  required: true
  any_of:
  - 剥离
  - 抽掉
  - 去掉
  - 移除
  - 没有神之眼
  - 假设没有
  - 模拟出
  - 're: (模拟|假设).{0,12}(没有|剥离|去掉)'
- id: p4
  point: 剥离后的推演走向灾难，这正是作品用来论证的方式——把现实技术推到极致会得到什么
  required: true
  any_of:
  - 推演
  - 灾难
  - 走向
  - 论证
  - 极致
  - 少数人
  - 缺乏约束
  - 're: (推演|外推|实验).{0,12}(结果|走向|灾难|结局)'
- id: p5
  point: 可补充：反派正是利用这类技术特性（沉浸式节点、与现实的时间流速差）做渗透
  required: false
  any_of:
  - 时间流速
  - 沉浸式
  - 渗透
  - 认知污染
anti_patterns:
- claim: 把元素力/神之眼当作故事对未来现实技术的设定
  triggers:
  - 元素力是未来
  - 神之眼是未来
  - 未来的元素力
  - 科技元素力
  - 技术化的神之眼
  - 元素力这种新能源
  - 神之眼这种设备
  - 元素力作为能源
  - 把元素力当作技术
- claim: 断言故事含有超自然技术（与第 22 章的剥离情节矛盾）
  triggers:
  - 超自然技术
  - 存在超自然
  - 有超自然
  - 魔法技术
  - 超能力技术
evidence_pool:
- cid: u01_c1
  quote: 取而代之的是悬浮在半空的巨大光幕
  supports:
  - p1
- cid: u01_c6
  quote: 还有那些熟悉的轨道清洁机器人
  supports:
  - p1
- cid: u02_c9
  quote: 这些蒲公英需要使用元素力才可以采集呢
  supports:
  - p2
- cid: u03_c22
  quote: 模拟出一个没有神之眼，没有永恒的寿命
  supports:
  - p3
- cid: u03_c23
  quote: 他们利用游戏世界与现实的时间流速差
  supports:
  - p5
grading:
  mode: rubric
  coverage_required: 0.7
  evidence_required: true
  anti_pattern_penalty: true
notes: p2/p3 是本卡的核心分辨点：把元素力/神之眼误当成'故事对未来的技术设想'即错；正确答案须指出它们属原作设定、且第 22 章主动剥离了它们。p1 为负命题（无超自然），引文给的是正面技术族的代表。
annotator: 构造样例（格式验证用，引文均取自原文）
