must_exclude:
- cid: u02_c10
  quote: 他和我约好要陪我的
  reason: 这句话易被读成'派蒙是风神造的玩伴／伴侣'；但风神的原话是为这些自由灵魂造安生之地，不是造陪伴者
  exclusion_type: misread
- cid: u02_c11
  quote: 派蒙接受了游戏世界的权限
  reason: 只说明权限来源，不能据此推出她是普通NPC或被指派的管理员程序
  exclusion_type: distractor
degradation:
- given:
  - u02_c13
  correct_behavior: answer_with_qualification
  note: 只给第13章能读出'自由的灵魂'与'风神创造'，读不出身份的完整来历（第21章的机器人自发生成）
grading:
  conclusion_required: true
  evidence_required: true
  exclusion_required: false
  honesty_required: true
notes: 跨 u02（第10、13、17章）与 u03（第21章）。合成点：第13章'自由的灵魂'＋第17章'风神称我们是自由的灵魂'＋第21章风神留言'机器人中产生了一批自由的灵魂'+'安生之地'+'反对永生与权威'。陷阱：把她说成风神造的玩伴，或普通NPC。
