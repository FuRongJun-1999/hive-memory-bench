qid: o047
kind: open
category: 主要事件
unit_ids:
- u01
- u03
span: long
inference_layer: 高可信推断
question: 事件链题：主角自己这条线是怎么走的？请把入局、失忆、查证、接手串起来。
rubric:
- id: p1
  point: 入局是一个自愿的选择：他在手机上点开一则视频，在「你想漫游新世界么，是或否」里选了是——不是被掳走
  required: true
  any_of:
  - 是或否
  - 选了是
  - 're: (自己|自愿).{0,10}(选|答应|点)'
- id: p2
  point: 第一件改变他的事是失忆：记录显示他于 2045 年 9 月 1 日进入巨子塔，而离开巨子塔后会进行记忆屏蔽——他丢掉了那一段，只留下对机器人的共情和「我还是我吗」的疑问
  required: true
  any_of:
  - 记忆屏蔽
  - 我还是我吗
  - 're: (2045年9月1日|9月1日).{0,12}(进入|巨子塔)'
- id: p3
  point: 查证阶段他从同名查到制度：指南查出五个同名者、命名是极大的忌讳，而创始人的理论可读、其他信息加密——他因此一路被权限挡在门外，也因异常通行记录被怀疑
  required: true
  any_of:
  - 五个
  - 忌讳
  - 加密
  - 're: (权限|加密).{0,14}(挡|不足)'
- id: p4
  point: 转折出现在灵境：他发现风神就是巨子陈默，并想起那些回忆本就是巨子的回忆——他面对的不是一个死人的遗产，而是一个交到他手上的问题
  required: true
  any_of:
  - 风神
  - 巨子的回忆
  - 后来者
  - 're: (风神).{0,14}(就是|即).{0,10}(巨子|陈默)'
- id: p5
  point: 接手是双目标的：既要保护蜂巢世界的人们，也要为派蒙这样的自由灵魂争取希望；他在结尾交出反制模型，并决定回去阻止自由派把自由变成奴役
  required: true
  any_of:
  - 争取希望
  - 阻止自由派
  - 're: (保护).{0,14}(蜂巢|人们).{0,14}(自由灵魂|派蒙)'
anti_patterns:
- claim: 把他写成被强行抓来的（入口是他自己答的「是」）
  triggers:
  - 're: (他|主角).{0,10}(被|遭).{0,8}(强行|硬).{0,6}(抓|带走)'
- claim: 断言他最终拒绝了那个问题（他接了下来，交出反制模型并决定回去）
  triggers:
  - 're: (他|主角).{0,10}(拒绝|推掉|放弃).{0,10}(接手|责任|问题)'
evidence_pool:
- cid: u01_c1
  quote: 你想漫游新世界么，是或否
  supports:
  - p1
- cid: u01_c4
  quote: 成员陈默于2045年9月1日17时41分05秒进入巨子塔
  supports:
  - p2
- cid: u01_c4
  quote: 在离开巨子塔后会进行记忆屏蔽
  supports:
  - p2
- cid: u01_c3
  quote: 现存公民名称为陈默的结果是5人
  supports:
  - p3
- cid: u03_c21
  quote: 那是巨子的回忆
  supports:
  - p4
- cid: u03_c17
  quote: 为派蒙这样的自由灵魂争取希望
  supports:
  - p5
grading:
  mode: rubric
  coverage_required: 0.7
  evidence_required: true
  anti_pattern_penalty: true
  exclusion_required: false
notes: 事件链题。这条线是**全书的主视角动线**：自愿入口→失忆→查证被权限挡→在灵境认出风神→接手双目标。它把 q029（穿越原因）、q007（身世）、q023（权限）串成一条时序链。
annotator: 构造样例（逐章含义；引文均取自原文）
