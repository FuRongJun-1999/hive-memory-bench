question: 「复制体」这样的存在为何必须存在？为什么需要这样一个后来者？
necessary_conclusion: 因为他自己把三条路都堵死了：他彻底反对永生与权威、明说「我不该成为他们的束缚」，所以不能自己延续；而他面对的那个难题需要一个能理解它的后来者，理解就意味着必须携带他的记忆（他想起的正是巨子的回忆）；同时最像答案的那批存在——机器人中自生的自由灵魂——在蜂巢初建后不久就被禁止，只能被他安放在灵境里（「我的骄傲，也是我的遗憾」）。三条约束叠加，剩下的形态只有一个：一个带着他记忆的新人——不是巨子本人，也不是被禁的
  AI
acceptable_surface_forms:
- 因为他既不肯自己永生、也不肯当束缚，而那个难题得交给能懂它的人，懂就得带着他的记忆；偏偏最像答案的自由灵魂在蜂巢是被禁的、只能藏在灵境——于是只剩一种形态：带着他记忆的新人
- 三条限制合起来只允许一种做法：造一个继承他记忆的新人，既不是他本人，也不是被禁止的 AI
