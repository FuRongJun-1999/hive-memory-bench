  coverage_required: 0.7
  evidence_required: true
  anti_pattern_penalty: true
  exclusion_required: false
notes: ★ 语料面＝`roles/琴.md`（14 条，跨第 11、12、19 章）。★ 她的分量在**两处合起来才看得出来**：第19章她是把'守护＝共同意志、力量来自每一个人'讲得最完整的人（与 q022 的第三条批判、o003 的两种自由观直接咬合）；第22章的推演又显示，她那种守护一旦失去制度承载就会变质——所以她是'守护要靠制度'这一命题的人格化。★
  诚实线：**模拟里的去世不是故事当下的事件**（第22章是派蒙加速推演的后续），错答会把它当成既成事实。★ 归因订正：那两句'真正的安全，不应系于一人之身'与'风之种带来的不是软弱'经查是**诺艾尔**说的，工具输出里曾并入琴的名下，已剔除并写成
  anti_patterns。
annotator: 构造样例（格式验证用，引文均取自原文）
