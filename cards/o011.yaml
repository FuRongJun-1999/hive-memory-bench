qid: o011
kind: open
category: 主要人物
unit_ids:
- u02
- u03
span: long
inference_layer: 高可信推断
question: 琴团长是个怎样的人物？请说明她的身份、立场，以及她在故事里的分量。
rubric:
- id: p1
  point: 身份＝西风骑士团团长：办公室的桌子堆满文件、忙于处理公务；讨伐风魔龙时由她分配编队（水元素队、风元素队、冰元素队的分工）
  required: true
  any_of:
  - 西风骑士团
  - 团长
  - 编队
  - 're: (分配|安排).{0,10}(战斗|队伍|编队)'
  - 're: (办公室|公务).{0,12}(文件|处理)'
- id: p2
  point: 她说破了自由派的手法：'他们太狡猾了，没有直接否定宁静生活的美好，而是指出了这种美好的脆弱，来鼓吹绝对的力量和永生'
  required: true
  any_of:
  - 脆弱
  - 狡猾
  - 're: (没有直接否定).{0,16}(美好|脆弱)'
  - 're: (鼓吹).{0,12}(绝对的力量|永生)'
- id: p3
  point: 她的立场：'西风骑士团成立的初衷，是守护蒙德，守护自由'；但这自由'绝非博士所许诺的、用永恒奴役换来的虚假安全，也绝非富人鼓吹的、用财富堆砌的孤立堡垒'
  required: true
  any_of:
  - 成立的初衷
  - 虚假安全
  - 孤立堡垒
  - 're: (永恒奴役).{0,12}(虚假|安全)'
  - 're: (财富).{0,12}(孤立|堡垒)'
- id: p4
  point: 她的正面主张：守护是'日夜不休的巡逻'、是面对魔物时的挺身而出、是灾难来临时的逆行；自由是'携手的自由'、'选择的自由'、是面对风雨也能共同承担而非把命运交给某个永恒者；且'这份力量，来源于我们每一个人，而非某个高高在上的神祇或王者'
  required: true
  any_of:
  - 日夜不休
  - 携手的自由
  - 每一个人
  - 're: (守护).{0,14}(巡逻|挺身而出|逆行)'
  - 're: (并非|而非|不是).{0,14}(神祇|王者|一个人)'
- id: p5
  point: 她在模拟里的分量：第22章显示她去世之后骑士团变质——年轻面孔取代老兵、废除了她那个时代延续下来旨在维护平民权益的政策、成员后辈开始继承父辈荣耀、商人崛起 ⇒ 她代表的那种守护是制度性的，而它随她的离去而失守
  required: true
  any_of:
  - 去世
  - 变质
  - 废除
  - 继承父辈
  - 're: (琴).{0,10}(去世|之后).{0,14}(改变|变质)'
  - 're: (政策).{0,12}(废除|取消)'
- id: p6
  point: 可补充：她与主角的关系——她以西风骑士团的接风宴把主角与小艾尔迎入蒙德，并设立荣誉骑士称号、承诺任何能满足的要求都可以得到兑现（远超原作的奖励）
  required: false
  any_of:
  - 接风宴
  - 荣誉骑士
  - 报酬
  - 're: (欢迎|加入).{0,10}蒙德'
anti_patterns:
- claim: 把她没说过的话算给她（「真正的安全，不应系于一人之身」与「风之种带来的不是软弱」是诺艾尔说的）
  triggers:
  - 're: 琴.{0,12}(说|主张|认为).{0,10}(真正的安全|风之种)'
  - 're: (真正的安全|风之种).{0,20}琴团长'
  - 're: 琴.{0,10}(说|主张).{0,10}不应系于一人'
- claim: 把她说成反派或暗中与博士合作（正文里她是对抗那一方的组织者）
  triggers:
  - 琴与博士合作
  - 琴是内应
  - 琴暗中支持富人
- claim: 断言她在故事当下已死／骑士团的变质发生在当下（那是模拟推演出来的后续，不在故事当前时间线）
  triggers:
  - 琴已经死了
  - 故事开始时琴已死
  - 她死于当下
