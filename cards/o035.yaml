question: 第二十三章「再别蒙德」这一章在讲什么？它如何收束全书？
rubric:
- id: p1
  point: 离别与承诺：派蒙说那你要早点回来、诺艾尔行骑士礼说愿风护佑您、主角说等我解决了自由派我们再一起冒险
  required: true
  any_of:
  - 早点回来
  - 愿风护佑您
  - 再一起冒险
  - 're: (承诺|约定).{0,14}(回来|冒险)'
- id: p2
  point: 他学到的答案（本章金句）：按需分配不是施舍，而是让每个人都能安心追求自己的理想；自由不是为所欲为，而是有能力守护珍视的一切
  required: true
  any_of:
  - 按需分配不是施舍
  - 有能力守护珍视的一切
  - 're: 不是为所欲为.{0,16}(守护|能力)'
- id: p3
  point: 回到舱室后的落点句：自由不是无拘无束，而是共同守护的秩序——蒙德给了我答案
  required: true
  any_of:
  - 共同守护的秩序
  - 蒙德给了我答案
  - 're: 自由.{0,10}不是无拘无束'
- id: p4
  point: 反击的开始：他向秦熙交出反制模型——用共同守护的故事对抗恐惧、用真实的历史和协作的成果揭穿谎言、用公平的规则和集体的力量抵御垄断
  required: true
  any_of:
  - 共同守护的故事
  - 揭穿谎言
  - 集体的力量
  - 're: (反制|模型).{0,14}(对抗|抵御|揭穿)'
- id: p5
  point: 结尾的紧迫与情绪落点：自由派利用时间流速差加速渗透、多个沉浸式节点出现异常认知波动；秦熙带他去见几位老朋友、集合力量把这场认知污染彻底清除；那个温暖与离别仿佛一场过于真实的梦境，唯有心头沉甸甸的责任感提醒他一切并非虚幻
  required: true
  any_of:
  - 时间流速差
  - 集合力量
  - 沉甸甸的责任感
  - 're: (仿佛|像).{0,10}(一场|做梦).{0,10}(梦|虚幻)'
anti_patterns:
- claim: 把结尾读成故事结束（本章是反击的开始，秦熙还要带他去见几位老朋友）
  triggers:
  - 本章结束了故事
  - 到此故事结束
  - 故事在这里收尾
- claim: 把主角的收获写成力量或技术（他带回的是定义与反制方案）
  triggers:
  - 're: (他|主角).{0,10}(带回|收获).{0,10}(武器|技术|力量)'
