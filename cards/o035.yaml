notes: 逐章含义题（底稿第 23 章）。本章是**收束章**：一句话把整部作品的自由观落定（不是无拘无束，而是共同守护的秩序），一份模型把游戏世界学到的东西交回现实，一句约定把情感线留在半开的地方——写作上是收束，情节上是起手。
annotator: 构造样例（逐章含义；引文均取自原文）
