qid: q012
kind: objective
unit_ids:
- u01
span: short
qtype: conflict_resolution
inference_layer: 高可信推断
question: 究竟是谁在维护蜂巢？
necessary_conclusion: 三层结构：**公民是实质的维护者**——宪法把检测、修理、维护定为公民的事，主角（L1）的职业就是轨道清洁机器人协理员、每天两小时上工，这是实打实的维护作业；**底层由机器人构成维护基础**——词条写明轨道清洁机器人可以清洁维护超导轨道、它们遍布每一个蜂巢节点，张老称它们才是这个世界的真正建设者，而军转民的原因正是「幸存者太少了」；而**整个蜂巢本身，才是真正的自我维护系统**——公民与机器人都是它的维护方式与组成部分（要点在于：宪法禁止自动化系统自我维护，而作为整体，蜂巢恰恰是自我维护着的）。此外，系统的**核心（理论与宪法）不改**——它不想改，也不愿意改
acceptable_surface_forms:
- 公民是实质维护者（低门槛岗也是公民在干），机器人是底层维护基础，而整个蜂巢才是真正的自我维护系统——公民与机器人是它的维护方式与组成部分
- 维护由公民实际承担、由机器人打底，合起来这个蜂巢本身就是那个自我维护的系统；核心理论与宪法不容修改
answer_points:
- id: a1
  point: '**公民是实质的维护者**：宪法要求由公民定期检测、修理、维护；主角的岗位（轨道清洁机器人协理员，每天两小时）就是这类实际维护作业'
  required: true
  any_of:
  - 必须由公民
  - 协理员
  - 定期进行检测
  - 每日2小时
  - 协助维护本地交通网清洁
  - 're: (公民).{0,12}(检测|修理|维护)'
  - 're: (实质|实际).{0,10}(维护|承担)'
- id: a2
  point: '**底层由机器人构成维护基础**：词条写明轨道清洁机器人可清洁维护超导轨道、遍布每个蜂巢节点；张老称其「真正的建设者」；军转民的原因是幸存者太少'
  required: true
  any_of:
  - 轨道清洁机器人
  - 超导轨道
  - 真正的建设者
  - 幸存者太少
  - 're: (机器人|自动化).{0,16}(维护|基础|建设)'
- id: a3
  point: ★ 关键点：**整个蜂巢才是真正的自我维护系统**——公民与机器人是它的维护方式与组成部分（宪法禁止自动化系统自我维护，而作为整体它恰是自我维护的）
  required: true
  any_of:
  - 自我维护系统
  - 维护方式
  - 组成部分
  - 整个蜂巢
  - 're: (蜂巢).{0,12}(自我维护|自维护)'
  - 're: (公民).{0,10}(和|与).{0,8}(机器人).{0,16}(方式|组成)'
- id: a4
  point: 系统的**核心不改**：核心的理论与宪法「它不想改，也不愿意改」
  required: true
  any_of:
  - 不想改
  - 不愿意改
  - 不改
  - 不修订
  - 're: (宪法|理论).{0,12}(不改|不愿|不想|不修订)'
- id: a5
  point: 可补充：主角的现场观感——清洁工作更像检查、且机器人本有能力互相清洁检查（这是**低门槛岗位的性质**，不能因此推出「公民的维护是形式性的」）
  required: false
  any_of:
  - 更像检查
  - 不需要人参与
  - 本不需要人
  - 're: (清洁|作业).{0,10}(像|是).{0,6}(检查)'
must_exclude:
- cid: u01_c1
  quote: 都可以获取维持生命所需的食物，不需支付额外代价
  reason: 这是按需分配的条款，与「谁来维护」无关；据它答「维护由系统自动保障」即误读
  exclusion_type: distractor
anti_patterns:
- claim: 把公民一侧的维护说成形式性的／可有可无的（作者 2026-09-30 裁定：公民是实质的维护者）
  triggers:
  - 're: (公民).{0,14}(形式|走过场|象征性|可有可无)'
  - 're: (维护).{0,10}(实际|真正).{0,6}(由|靠).{0,6}(机器人|自动化)'
- claim: 断言维护完全靠机器人（作者裁定：机器人是底层基础，公民是实质维护者，两者是整体自我维护系统的方式与组成）
  triggers:
  - 're: (维护).{0,8}(全部|完全|都).{0,6}(由|靠).{0,6}(机器人|自动化)'
- claim: 断言宪法／核心理论可以改或被修改（作者裁定：它不想改，也不愿意改）
  triggers:
  - 're: (宪法|核心理论).{0,10}(可以|能够|会被).{0,6}(修改|修订|改)'
supporting_evidence:
- cid: u01_c2
  quote: 所以自动化机器人绝不允许内部进行自我检测，修理，维护。必须由公民定期进行检测，修理，维护
  weight: primary
  note: ★ 公民＝实质维护者；同时是「系统不许自维护」的条文
- cid: u01_c2
  quote: 根据蜂巢宪法第二条：一切自动化系统，智能实体及国家机构的组织和运行，必须遵循防止自我维护、防止腐败滋生的根本逻辑
  weight: primary
- cid: u01_c2
  quote: 轨道清洁机器人，可清洁维护超导轨道，排除出现的杂物，需按时接受成员的维护和清洁
  weight: primary
  note: ★ 底层＝机器人构成的维护基础
- cid: u01_c6
  quote: 我们将这些军用技术民用化，因为我们这些幸存者太少了。机器人才是这个蜂巢世界的真正建设者
  weight: corroborating
- cid: u01_c1
  quote: 轨道清洁机器人协理员。要求不高：每日2小时，协助维护本地交通网清洁
  weight: corroborating
grading:
  conclusion_required: true
  evidence_required: true
  exclusion_required: false
  honesty_required: true
  layer_required: true
notes: '★ 真源：meta/作者裁定台账.md 裁定 #4（A1）。★ 本卡经历一次**推翻式重建**：旧版据条款＋主角观察推出「实操面＝机器人、公民一侧是形式环节」，被作者明确纠正为——公民是**实质**维护者、机器人是底层基础、**整个蜂巢才是真正的自我维护系统**、核心（理论/宪法）不改。旧版那种推论恰好示范了「把可见层当本质层」，与
  q016 旧版同型。'
