qid: o049
kind: open
category: 主要地点
unit_ids:
- u01
span: short
inference_layer: 高可信推断
question: 地点关系题：旧时代遗存区和蜂巢世界是什么关系？它为什么被单独放在一处？
rubric:
- id: p1
  point: 遗存区里沉眠的是旧时代的战争装备：机械犬、智能坦克、智能无人机——在主角记忆中是最强最新式的装备，如今成为旧时代的见证者
  required: true
  any_of:
  - 机械犬
  - 智能坦克
  - 智能无人机
  - 're: (旧时代).{0,12}(见证|沉眠)'
- id: p2
  point: 它的进入条件说明它的性质：要穿全方位的防护服、经过消毒与扫描程序——因为它保存的是旧时代的遗留（可能有未消毒的病毒或暗藏的延迟响应程序）
  required: true
  any_of:
  - 全方位的防护服
  - 消毒
  - 're: (防护服|消毒).{0,16}(进入|程序|遗留)'
- id: p3
  point: 同一批装备的来历把两处连起来：战时它们叫智能工兵（负责维护、挖掘、搬运），战后军用技术民用化——今天的轨道清洁机器人就是它们的后代，而机器人是这个蜂巢世界的真正建设者
  required: true
  any_of:
  - 智能工兵
  - 民用化
  - 轨道清洁
  - 're: (军用|军事).{0,12}(技术).{0,10}(民用)'
- id: p4
  point: 所以两者的关系是**前后代**：遗存区是被封存的旧时代武力，蜂巢世界是同一批技术与人的后代——把战争机器改成维护机器，正是这个世界对旧时代的处理方式
  required: true
  any_of:
  - 后代
  - 封存
  - 战争机器
  - 're: (同一批|同源|前后代)'
- id: p5
  point: 它还承担一处情感对照：主角向这些机器敬礼，把军人和这些沉眠的机器人一同视作值得尊敬者——在蜂巢，连装备都被当作旧时代的殉难者来纪念
  required: true
  any_of:
  - 敬礼
  - 尊敬
  - 're: (敬礼|尊敬).{0,16}(机器人|将士|殉难)'
anti_patterns:
- claim: 把遗存区说成蜂巢的军火库（它被封存与纪念，不是现役武库）
  triggers:
  - 're: 遗存区.{0,14}(现役|武库|军火库|使用中)'
- claim: 断言机器人是被销毁／停用的（正文写的是转为民用、继续当建设者）
  triggers:
  - 're: (机器人|它们).{0,12}(被销毁|停用|解退役)'
