- u01
span: short
inference_layer: 高可信推断
question: 地点关系题：巨子塔、求知园、警戒检查中心这三个节点各管什么？它们之间是什么关系？
rubric:
- id: p1
  point: 巨子塔是**记忆与封存**：核心信息存储节点，访问需要 5 级权限或特殊权限，其中具有机密信息，涉及军用或超越时代的技术突破都会被转移到这里分级保存；它同时是巨子的长眠之地与所有系统核心指令的最终备份点
  required: true
  any_of:
  - 核心信息存储节点
  - 5级
  - 长眠之地
  - 备份
  - 're: (巨子塔).{0,18}(分级保存|机密|备份)'
- id: p2
  point: 求知园是**知识与交往**：公共知识节点，有贡献点查询机与风味实验室，是公民自由交流、验证贡献点的地方——也是主角认识张明远、听说巨子的地方
  required: true
  any_of:
  - 公共知识节点
  - 贡献点
  - 风味实验室
  - 're: (求知园).{0,16}(交流|验证|查询)'
- id: p3
  point: 警戒检查中心是**秩序与强制**：为维护蜂巢内部秩序、阻止战争与恐怖袭击而建立，是快速反应、防疫、控制、指挥中心；外观与巨子塔同为漆黑的环形建筑，重型装甲机器人巡逻
  required: true
  any_of:
  - 维护蜂巢内部秩序
  - 快速反应
  - 环形
  - 're: (警戒检查中心).{0,18}(秩序|恐怖袭击|指挥)'
- id: p4
  point: 三者的关系是**分层对应**：知识可以自由获取（求知园），记忆与超越时代的技术被封存（巨子塔），而强制力只用于维护秩序（警戒检查中心）——进门的门槛从低到高、从开放到封闭
  required: true
  any_of:
  - 门槛
  - 分层
  - 开放
  - 're: (知识|求知园).{0,16}(自由|开放).{0,16}(封存|强制)'
- id: p5
  point: 三者也串在主角的动线上：他在求知园获得信息与引导、因巨子塔的通行记录被带进警戒检查中心接受盘问、又在同一机构完成对自由派的通报——同一个空间既是威胁也是盟友
  required: true
  any_of:
  - 动线
  - 盘问
  - 通报
  - 're: (警戒检查中心).{0,18}(盘问|通报|盟友|威胁)'
anti_patterns:
- claim: 把三者说成同一种节点（正文给的是三类功能：公共知识／核心信息存储／秩序强制）
  triggers:
  - 're: (三个节点|这三处).{0,12}(都是|同一类)'
- claim: 断言求知园需要 5 级权限（门槛低、面向所有公民的是它；要 5 级的是巨子塔）
  triggers:
  - 're: 求知园.{0,14}(需要|要求).{0,8}(5级|特殊权限)'
