must_exclude:
- cid: u02_c10
  quote: 数据模拟的智能真的有自我意识么
  reason: ★ 这是主角提出、派蒙并未回答的悬问；拿它当结论（「语料没说清」）即停在悬问上，后文已由自由的灵魂与她的表现交代
  exclusion_type: misread
- cid: u02_c13
  quote: 只是没有我的权限
  reason: ★ 那是权限的差别（只有派蒙持有世界权限），不是自我有无的差别；据此答「她不算完整的自我／只是被造物」即误读
  exclusion_type: misread
