notes: 跨 u02（第10、13章）与 u03（第18、19、21章）。★ 本题的判据设计：不靠「谁称她是什么」，而靠**她自己的立场能反过来改变主角**（第18章「小艾尔的话点醒了他」）——这是自我意识最硬的证据形态。与 q017 衔接：她是重复个体，但重复不等于无我。
