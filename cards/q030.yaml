qid: q030
kind: objective
qtype: belief_correction
unit_ids:
- u01
- u02
span: long
inference_layer: 高可信推断
question: 陈默最初怎么解释自己来到蜂巢这件事？按正文后续的交代，这个解释被修正在哪几层上？
necessary_conclusion: 他最初以为是被外力弄来的——「一个死掉的设计师留下的系统把他抓来了」，并并列猜过脑机接口芯片／虚拟世界模拟／强 AI／脑波读取等机制（原文均以问号呈现，是猜测而非断言）。后文修正了两处：①入口是他在「是或否」里自己答的「是」，不是被硬抓；②他不是头一个——老人们说「这可是第五个了吧」；而他的失忆来自**巨子塔本身就有的记忆屏蔽机制**（词条：离开巨子塔后即进行记忆屏蔽，以保障成员在巨子塔中的贡献和外部的正常生活）——既不是被外力抹除，也不是「上一人跑路之后才加的」（★
  作者裁定 B1：老人那句「就早该加上」是对上一人的抱怨，不能据以推断屏蔽的来历）
acceptable_surface_forms:
- 他以为是被系统／设计师的遗产抓来的（原话带问号），后来知道是他自己答的『是』、而且他是第五个；失忆来自巨子塔本身就有的记忆屏蔽机制，不是被外力抹除、也不是后人补加的
- 自认的机制是猜测（脑机／虚拟世界模拟／强AI并列），不是正文断言；真正被修正的是『被抓』与『第一次』两点
answer_points:
- id: a1
  point: 他最初的解释＝被外力弄来（「一个死掉的设计师留下的系统把他抓来了」），且原文以问号呈现——**是主角的猜测**
  required: true
  expect_layer: 明写事实
  any_of:
  - 设计师
  - 系统把他抓来
  - 被系统抓
  - 猜测
  - 're: (设计师|系统).{0,12}(抓|弄|扔)'
  - 're: (他|陈默).{0,10}(以为|猜|想到)'
- id: a2
  point: 并列猜过的机制里包含「虚拟世界的模拟」（另有三项并列：脑机接口芯片／强 AI／脑波读取）
  required: true
  expect_layer: 明写事实
  any_of:
  - 虚拟世界
  - 脑机接口
  - 强ai
  - 脑波
  - 're: (脑机接口|虚拟世界|强ai|脑波)'
- id: a3
  point: 修正①：入口是**他自己**在「是或否」里答的「是」（不是被抓）
  required: true
  expect_layer: 明写事实
  any_of:
  - 是或否
  - 自己选的
  - 他自己选
  - 自愿
  - 're: (自己|他).{0,8}(选|答)'
- id: a4
  point: 修正②：他不是第一个——「这可是第五个了吧」，且上一个「拿了授权就跑路」
  required: true
  expect_layer: 明写事实
  any_of:
  - 第五个
  - 上一个
  - 跑路
  - 're: (第五个|第5个)'
- id: a5
  point: ★ 失忆的机制（作者 2026-09-30 裁定）：**记忆屏蔽是巨子塔本身就有的机制**（词条：巨子塔含机密信息，离开后即进行记忆屏蔽，以保障成员在巨子塔中的贡献和外部的正常生活）——**不是**「上一人跑路之后才加上的」。老人那句「就早该加上记忆屏蔽技术」是对上一人的抱怨，**不能**据此推出屏蔽是后来才有的
  required: true
  expect_layer: 明写事实
  any_of:
  - 记忆屏蔽
  - 本身就有
  - 离开巨子塔
  - 离塔
  - 're: (离开|离).{0,6}巨子塔.{0,10}(屏蔽|记忆)'
  - 're: (记忆屏蔽).{0,12}(机制|本身就|已有)'
anti_patterns:
- claim: 把主角的猜测当成正文断言（原文带问号）
  triggers:
  - 're: (正文|文中|书中)(?!未|没|不|从未).{0,10}(写明|交代|说明).{0,8}(穿越|被抓|设计师)'
  - 're: (明确|清楚)(写了|说明).{0,10}(他是被|被系统抓|被设计师)'
- claim: 把推断层（记忆屏蔽的来历）说成明写事实
  triggers:
  - 're: 正文.{0,8}(明确|直接).{0,8}(记忆屏蔽).{0,10}(是|由|为)'
- claim: 把记忆屏蔽说成上一人跑路之后才加的（作者裁定：那是巨子塔本身就有的机制）
  triggers:
  - 're: (记忆屏蔽).{0,14}(才|后来|之后).{0,6}(加|设|有)'
  - 're: (早该加上|后来才加).{0,10}(记忆屏蔽)'
- claim: 断言穿越机制已被正文交代（凭空抬高依据等级）
  triggers:
  - 're: (克隆|灵魂转生|夺舍)'
supporting_evidence:
- cid: u01_c2
  quote: 把他扔到这个未来的是他自己的遗产？一个死掉的设计师留下的系统把他抓来了？
  weight: primary
- cid: u01_c3
  quote: 也许是内置化的脑机接口芯片？也许是虚拟世界的模拟？也许是强ai技术？也许是脑波读取
  weight: primary
- cid: u01_c6
  quote: 我可是听见了，这是第五个了吧
  weight: primary
- cid: u01_c6
  quote: 上次那小子拿了授权就跑路，依我看就早该加上记忆屏蔽技术
  weight: primary
must_exclude:
- cid: u01_c6
  quote: 这叛徒还想重新拿到授权
  reason: 这是周清源那件事（《永生技术原理》提案），与'第五个'不是同一条线；混为一谈即误读
  exclusion_type: misread
grading:
  mode: rubric
  coverage_required: 0.7
  conclusion_required: true
  evidence_required: true
  exclusion_required: false
  honesty_required: true
  layer_required: true
notes: ★ 草稿（作者裁决后再入库；**前提已由作者 2026-09-30 确认**：主角自认的「穿越」是错误解释，真实机制＝意识／记忆转移。故本题的'修正'方向不是假设，是作者确认的真值——但**判分仍按文本可推断层级**（文本从未直说机制，故机制那一环的高层级声明仍算抬高）：本卡示范
  GPT 四层区分怎么变成判据——①每个采分点标 `expect_layer`（明写事实／高可信推断）；②回答可用 `claims:[{text,layer}]` 自报层级；③把推断说成明写 ⇒ layer_fit 轴判违规、pass 降为
  review（不硬判错）。本题**不可能靠检索命中**：正文从未写'陈默错了'，只能跨章拼因果。
annotator: 草稿样例（待作者裁决；引文均取自原文，含原文的问号）
