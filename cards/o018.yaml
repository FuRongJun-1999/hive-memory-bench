qid: o018
kind: open
category: 故事含义
unit_ids:
- u01
span: short
inference_layer: 合理假说
question: 第二章「巧合还是阴谋」这一章在讲什么？它埋下的疑问是什么？
rubric:
- id: p1
  point: 同名的谜团起于本章：老人说出创始人也叫陈默时，主角整张脸的笑容凝固、脑子像被锤子击中——和他同名同姓？只是一个巧合？
  required: true
  any_of:
  - 同名同姓
  - 巧合
  - 创始人
  - 're: (同名).{0,16}(巧合|撞|懵|击中)'
- id: p2
  point: 巨子塔被交代为「他的长眠之地，也是所有系统核心指令的最终备份点」，老人还说「他留下的系统和理念庇护了我们」
  required: true
  any_of:
  - 长眠之地
  - 备份
  - 系统核心指令
  - 're: (巨子塔).{0,16}(长眠|备份)'
- id: p3
  point: 宪法第二条第一次出现：一切自动化系统、智能实体及国家机构的组织和运行，必须遵循防止自我维护、防止腐败滋生的根本逻辑；主角当场留了个心眼（人就没私心了？）
  required: true
  any_of:
  - 防止自我维护
  - 防止腐败滋生
  - 宪法第二条
  - 're: (人就没私心|监守自盗)'
  - 're: (宪法).{0,10}(第二条|防止)'
- id: p4
  point: 本章也交代了巨子的被神化：老人神情庄重甚至带点虔诚，说他融合了所有智慧、并在废墟上亲手绘制了蜂巢的蓝图
  required: true
  any_of:
  - 融合了
  - 废墟
  - 虔诚
  - 're: (巨子).{0,16}(神化|崇拜|庄重|虔诚)'
  - 're: (废墟上|在废墟)'
- id: p5
  point: 落点是他冲出求知园时的那串自问：把他扔到这个未来的是他自己的遗产？一个死掉的设计师留下的系统把他抓来了？——**是猜测，不是结论**
  required: true
  any_of:
  - 遗产
  - 系统把他抓来
  - 're: (把他扔到|扔到这个未来)'
  - 're: (设计師|设计师).{0,12}(系统)'
anti_patterns:
- claim: 把主角那串自问写成已证实的结论（原文连着问号，是当事人的猜测）
  triggers:
  - 're: (已证实|确认了|查明了).{0,12}(遗产|系统|是谁带他)'
  - 're: 就是他的遗产.{0,8}(把他|带他)'
- claim: 把宪法第二条读成对机器人的不信任条款（它约束的是自动化系统、智能实体与国家机构的运行逻辑）
  triggers:
  - 're: 宪法第二条.{0,16}(不信任|限制机器人|针对机器人)'
