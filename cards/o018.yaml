  anti_pattern_penalty: true
  exclusion_required: false
notes: 逐章含义题（底稿第 2 章）。本章是**谜团的起点**：同名、巨子塔、宪法第二条三件事在同一章亮相，其中宪法第二条是全书制度线的第一块砖。
