notes: 逐章含义题（底稿第 13 章）。本章是**告别章兼埋线章**：话别里塞进了三条后文要用的线（机器人／自由派／承诺），而「历史是个小姑娘」那句则把整部作品的史观挑明——在残缺的信息里找过去，与主角查自己来历的处境同构。
annotator: 构造样例（逐章含义；引文均取自原文）
