must_exclude:
- cid: u02_c10
  quote: 只是他终究是寿命有限
  reason: 这句是说他的寿命有限，但紧接着就是他拒绝了永生的提议；拿它当'他因寿命到头而死'的依据即误读——他是能够永生而选择拒绝
  exclusion_type: misread
- cid: u01_c6
  quote: 对《永生技术原理》投向了否定
  reason: 这是老人们否定那本书（第6章），与巨子拒绝永生的理由无关；据此答'因为技术不可行'即把'拒绝'读成了'做不到'
  exclusion_type: misread
