notes: 跨 u01/u02/u03。四层理由分居三章：推演后果（15章）＋本人论证（16章）＋主角的领悟（15章末）＋自我约束与反权威（21章）。★ 关键区分：他是'能够永生而选择拒绝'（第10章明写有人提议、他拒绝），不是'做不到'——两个
  must_exclude 都针对这个误读。
