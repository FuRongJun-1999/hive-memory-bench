question: 巨子陈默为什么拒绝永生？
necessary_conclusion: 理由是多层的：一是推演——永生与私有制、绝对自由并列时必然走向终产者与永恒奴役（最终只剩奴隶与唯一的孤独之王，永生反成最恶毒的诅咒）；二是他本人的论证——维持永恒的秩序不可能，代价要由他人承担，这个口子一开就要面对人人永生，永生者坐享而代价甩给天下苍生；三是更深的一层——他恐惧的不是技术，而是在无限的时间中忘记了过去的理想；四是他不能开这个头，人类过去的事说明人类不值得永远信任，且反对永生与反对权威本是同一件事，连许多战友同志都不理解他
acceptable_surface_forms:
- 他反的是三件事连在一起：永生加私有制会走到终产者与永恒奴役；永恒的秩序维持不了，代价要别人付；他自己也不能开这个头——反永生和反权威是一件事，他怕的是在无尽时间里忘掉当初的理想
- 因为永生最终等于永恒的奴役（终产者），而且他不能开这个头、人类不值得永远信任；他真正怕的是忘记理想，不是技术
