  anti_pattern_penalty: true
  exclusion_required: false
notes: 线索题（因果链）。这条线把「攻击」与「时间」接起来：**一次进攻可以被击退，但代言人式渗透会一代一代地改变精神**——第22章的推演正是这条链的终点，也是全书「守护要靠制度」的论据。
