kind: open
category: 故事线索
unit_ids:
- u03
span: short
inference_layer: 高可信推断
question: 线索题：从博士与富人的陷阱到骑士团的变质，这条线是怎么发展的？
rubric:
- id: p1
  point: 第一步是陷阱本身：他们将安全与绝对自由和永生绑定；手法是先指出宁静生活的脆弱，再鼓吹绝对的力量与永生
  required: true
  any_of:
  - 绑定
  - 脆弱
  - 're: (安全).{0,12}(绝对自由|永生).{0,10}绑定'
- id: p2
  point: 第二步是击退之后的继续：博士和富人的计划没有成功，但在这片安宁的背后是新的计划——蒙德将会出现至冬的信徒和代言人，这是一种潜移默化的入侵
  required: true
  any_of:
  - 代言人
  - 潜移默化
  - 新的计划
  - 're: (信徒|代言人).{0,16}(蒙德|入侵)'
- id: p3
  point: 第三步是时间里的效果：琴团长去世之后，西风骑士团的改变尤为明显——年轻的面孔取代熟悉的老兵、废除了维护平民权益的政策、后辈继承父辈的荣耀、大商人崛起
  required: true
  any_of:
  - 年轻的面孔
  - 维护平民权益
  - 继承父辈
  - 're: (政策).{0,12}(废除|取消)'
- id: p4
  point: 第四步是性质的翻转：加入骑士团不再是为了誓言，而是为了特权、财富，以及那份可以凌驾于他人之上的自由；骑士们驻守在商会与贵族宅邸前收取治安税
  required: true
  any_of:
  - 不再是为了誓言
  - 特权
  - 治安税
  - 're: (驻守).{0,14}(商会|贵族)'
- id: p5
  point: 链条的落点：守护不能系于个人——推演让主角（和读者）看到，承载守护的人一消失、制度又没接住，同一个骑士团会亲手废除自己的政策；这正是他带回蜂巢的结论
  required: true
  any_of:
  - 系于个人
  - 制度
  - 're: (守护).{0,14}(不能系于|失守|制度)'
anti_patterns:
- claim: 把这一章的时间跳跃当成故事当下发生（第22章是加速推演出的后续）
  triggers:
  - 're: (琴|骑士团).{0,12}(已经|当下).{0,10}(去世|变质)'
- claim: 把至冬的渗透写成武力进攻（正文写的是信徒与代言人、潜移默化）
  triggers:
  - 're: (至冬|渗透).{0,12}(武力|军队|开战)'
