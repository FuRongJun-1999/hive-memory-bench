qid: o017
kind: open
category: 故事含义
unit_ids:
- u01
span: short
inference_layer: 合理假说
question: 第一章「初见蜂巢世界」这一章在讲什么？它的含义与它立下的规矩是什么？
rubric:
- id: p1
  point: 开篇先立规则再立人物：指南的自我介绍就把世界的共识摆出来——请观看本指南、遵守新世界的共识，并交代食物合成等技术设定
  required: true
  any_of:
  - 请观看本指南
  - 遵守新世界的共识
  - 合成
  - 're: (指南).{0,14}(介绍|共识|规则)'
- id: p2
  point: 主角以「一个细胞」的身份入场：整个蜂巢社会像一个超级大的身体，自己是里面的一个小细胞，厨房是消化系统、轨道是血管；他随即追问这个隐喻的边界（身体对外部的索取算不算剥削）
  required: true
  any_of:
  - 细胞
  - 血管
  - 消化系统
  - 像一个小细胞
  - 're: (超级大的身体|庞大生命体)'
  - 're: (剥削|压迫).{0,16}(身体|外面|非成员)'
- id: p3
  point: 分配制度第一次亮相：按需分配托底、按劳分配开路，并以旧时代作对照（要么内卷到死、要么躺平摆烂的绝望）
  required: true
  any_of:
  - 按需分配托底
  - 按劳分配
  - 内卷
  - 're: (按需分配).{0,12}(托底|开路)'
- id: p4
  point: 主角的旧时代工程经验第一次派上用场：他看出磁场约束算法有优化空间并提交改进建议——这是他日后挣贡献点的起点
  required: true
  any_of:
  - 磁场
  - 约束算法
  - 工程经验
  - 改进
  - 're: (算法|公式).{0,12}(改进|优化)'
- id: p5
  point: 本章的情绪落点是「起步而已」：他领到临时协理员电子徽章，回头看着沉浸于知识和创作的人们（新世界的希望与自己的位置感同时确立）
  required: true
  any_of:
  - 起步而已
  - 临时协理员
  - 电子徽章
  - 're: (徽章|起步).{0,14}(自己|位置|希望)'
anti_patterns:
- claim: 把这一章读成单纯的世界观说明书（本章同时立了隐喻的边界与质疑）
  triggers:
  - 本章只是介绍世界观
  - 这一章没有任何质疑
  - 他对新世界毫无保留
- claim: 断言主角在开篇就被当作贵宾（他是以临时协理员的身份从最底层工作入场）
  triggers:
  - 're: (主角|陈默).{0,10}(一上来|开篇|一开始).{0,10}(就是|被当作).{0,8}(贵宾|贵客|领导)'
evidence_pool:
- cid: u01_c1
  quote: 请观看本指南，遵守新世界的共识
  supports:
  - p1
- cid: u01_c1
  quote: 这整个蜂巢社会，感觉就像一个超级大的身体
  supports:
  - p2
- cid: u01_c1
  quote: 按需分配托底，有按劳分配开路
  supports:
  - p3
- cid: u01_c1
  quote: 这世界就给你搭天梯
  supports:
  - p4
- cid: u01_c1
  quote: 起步而已
  supports:
  - p5
grading:
  mode: rubric
  coverage_required: 0.7
  evidence_required: true
  anti_pattern_penalty: true
  exclusion_required: false
notes: 逐章含义题（底稿 chapters.md 第 1 章）。本章的功能是**在她自己的隐喻里埋下第一个问题**：细胞不用操心吃喝，可身体对外面的世界呢——这一问与第8章的「矫枉过正」、第15章的三禁忌是同一族的追问。
annotator: 构造样例（逐章含义；引文均取自原文）
