notes: 逐章含义题（底稿第 16 章）。本章是**最容易被读漏的一章**：表面是一次闲聊，实际给出了「为什么要禁智能」的完整理由（需要→价值观→准则），而这条理由正是巨子后来对自由灵魂「好奇和恐惧」的来源。
annotator: 构造样例（逐章含义；引文均取自原文）
