kind: open
category: 故事线索
unit_ids:
- u01
- u03
span: long
inference_layer: 高可信推断
question: 线索题：巨子的自我约束怎么就逼出了「后来者」这个位置？
rubric:
- id: p1
  point: 第一环是他的主张：他彻底的反对永生、反对权威——这件事不顺利，很多他之前的战友与同志都不那么理解他
  required: true
  any_of:
  - 反对永生
  - 反对权威
  - 战友
  - 're: (永生|权威).{0,12}(反对|彻底)'
- id: p2
  point: 第二环是他对自身的判断：巨子知道自己不能开永生的头，因为人类过去的经验说明人类不值得永远信任、背叛始终在发生
  required: true
  any_of:
  - 不能开永生的头
  - 背叛
  - 're: (人类).{0,14}(不值得|永远信任)'
- id: p3
  point: 第三环是制度层面的同一禁令：一切自动化系统、智能实体及国家机构的组织和运行必须防止自我维护、防止腐败滋生——连系统都不许自我延续
  required: true
  any_of:
  - 防止自我维护
  - 防止腐败滋生
  - 're: (系统|国家机构).{0,16}(自我维护|自我延续)'
- id: p4
  point: 第四环是他的选择：他不给自己造继承者，而是把问题交出去——我不该成为他们的束缚，我只是一个未竟事业的先行者
  required: true
  any_of:
  - 不该成为
  - 未竟事业的先行者
  - 're: (束缚|继承者).{0,16}(不该|不给自己)'
- id: p5
  point: 链条的落点：于是需要一个既携带他的记忆、又与他无关的人——留给后来者的信息就是验收条件（能看到它＝已接触到那个问题＋已得到她们的信任）
  required: true
  any_of:
  - 后来者
  - 记忆
  - 信任
  - 're: (看到这份信息|既然你能看到).{0,20}(信任|问题)'
anti_patterns:
- claim: 断言巨子给自己安排了继承人（他不给自己造继承者，位置只在制度之外留给外人）
  triggers:
  - 're: (巨子|他).{0,12}(指定|安排|选择).{0,10}(继承人|继任者)'
- claim: 把「不能开永生的头」说成技术做不到（正文写的是他不肯开这个头）
  triggers:
  - 're: (不能开永生|不开永生).{0,14}(技术|做不到|无法实现)'
