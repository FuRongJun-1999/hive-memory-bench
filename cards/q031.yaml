span: long
inference_layer: 高可信推断
question: 巨子为什么一定要禁止有自我意识的机器人，甚至把配套条款写进宪法？又为什么自述『没有找到答案』？
necessary_conclusion: '禁令要防的是**最坏情况——终产者的出现**（作者裁定 #8；正文侧的样本是 u02_c15 的推演：绝对自由＋私有制推到尽头，资源归永生者、其他生命陷入永恒奴役，陈默给这个词起名叫「终产者」）。而他不把理由说成「已证明
  AI 危险」，理由是**无法预知**：生命都有维持生存的需要，并由此长出整套价值观念与行为准则——而具备自我意识的 AI 会有怎样的价值观念与行为准则，谁也答不上来（张老用反问给出这一层）。所以他的选择是「在没有答案之前，不让这个实验进入现实」——禁令是一条**不可逆实验的刹车线**。写进宪法的配套条款（自动化系统不许自我检测、修理、维护，必须由公民做）则是不让它形成**自我闭环**、留住人工介入点。而「没有找到答案」说的是另一个更根本的永恒难题——理想世界如何建成、新主体与人类能否共存（他自述没能解决、只能不断尝试）——这两件事不是一回事：一个是「为什么禁」，一个是「为什么仍不满足」'
acceptable_surface_forms:
- 不是怕它强，而是不知道它会形成什么样的价值观念与行为准则；所以在有答案之前不让它出现，并配套禁止自我维护（留人工介入点）
- 禁令是刹车线；宪法配套条款断掉自我闭环；而他说没找到答案指的是那个永恒的难题
answer_points:
- id: a1
  point: 禁令的理由＝**无法预知**自我意识 AI 的价值观念与行为准则（张老的反问式提示：生命都有维持生存的需要，由此长出价值观念与行为准则）——**不是**「已证明 AI 危险／AI 曾造反」
  required: true
  expect_layer: 明写事实
  any_of:
  - 价值观念
  - 行为准则
  - 维持生存的需要
  - 不知道它会
  - 无法预知
  - 're: (自我意识|具备自我意识).{0,16}(价值|准则)'
  - 're: (生命|生存).{0,12}(需要).{0,20}(价值|准则)'
- id: a2
  point: 因此禁令的形态是「在不知道答案之前不允许它出现」——把不可逆的实验挡在现实之外
  required: true
  expect_layer: 高可信推断
  any_of:
  - 不可逆
  - 不让它出现
  - 不允许出现
  - 在知道之前
  - 没有答案之前
  - 're: (不知道|没有答案).{0,14}(之前|以前|就不).{0,10}(允许|出现|进入)'
- id: a3
  point: 宪法层面的配套＝不许自动化系统自我检测/修理/维护、必须由公民做 ⇒ 不让它形成**自我闭环**（保住人工介入点）
  required: true
  expect_layer: 高可信推断
  any_of:
  - 宪法第二条
  - 自我维护
  - 自我检测
  - 必须由公民
  - 人工介入
  - 自我闭环
  - 're: (禁止|不许|绝不允许).{0,14}(自我维护|自我检测|自我修理)'
- id: a4
  point: 「没有找到答案」指的是那个**永恒的难题**（自述没能解决、只能不断尝试）——与禁令的理由是两件事（一个是为什么禁，一个是为什么仍不满足）
  required: true
  expect_layer: 明写事实
  any_of:
  - 永恒的难题
  - 没能解决
  - 不断尝试
  - 试验田
  - 're: (永恒|无法解决|没能解决).{0,10}(难题|问题)'
- id: a5
  point: 可补充（推断）：他**不替 AI 规定价值观**（对照「给它写三大定律」式做法）——与蜂巢「主体须自己形成价值与共识」的哲学一致
  required: false
  expect_layer: 高可信推断
  any_of:
  - 三大定律
  - 不替它
  - 自己形成
  - 're: (不|拒绝).{0,10}(替|为).{0,8}(ai|它).{0,10}(规定|设定|写入)'
- id: a6
  point: '（作者裁定 #8）禁令要防的是**最坏情况——终产者**：绝对自由＋私有制推到尽头，资源归永生者、其他生命陷入永恒奴役（u02_c15 陈默的推演，他给这个词起名叫「终产者」）——禁令＝把不可逆的最坏结局挡在现实之外。★ 正文未把「禁令」与「终产者」并列写过（真源是作者裁定）⇒
    本点按 D1 标加分，不设 required'
  required: false
  expect_layer: 高可信推断
  any_of:
  - 终产者
  - 最坏情况
  - 最坏的结果
  - 永恒奴役
  - 're: (最坏).{0,8}(情况|结果|结局)'
  - 're: (资源).{0,10}归.{0,8}永生者'
must_exclude:
- cid: u03_c21
  quote: 被叛乱的机器人们和叛徒发现了
  reason: 这是**旧时代三战**里的往事（人类惨胜、九成九人口死亡那一战），正文并未把蜂巢的 AI 禁令归因于它——把禁令说成「因为机器人曾造反」即张冠李戴
  exclusion_type: misread
- cid: u02_c16
  quote: 一般人是没机会见到的
  reason: 这是「见不到」的事实描述，不能拿来当「为什么要禁」的理由
  exclusion_type: distractor
anti_patterns:
- claim: 把禁令的理由归因于机器人曾经造反/叛乱（正文把理由落在「价值观念与行为准则无法预知」）
  triggers:
  - 're: (因为|由于).{0,10}(机器人|ai).{0,10}(叛乱|造反|叛变)'
  - 're: (叛乱|造反).{0,10}(所以|因此).{0,10}(禁止|被禁)'
- claim: 把「没找到答案」说成「他没有理由禁」或「他承认禁令是错的」
  triggers:
  - 're: (禁令|禁止).{0,10}(没有理由|是错的|承认错误)'
- claim: 断言正文写明了 AI 叛乱与禁令的因果（无据）
  triggers:
  - 're: (正文|文中)(?!未|没|不).{0,10}(写明|交代).{0,8}(叛乱|造反)'
