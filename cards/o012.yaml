question: 凯亚是个怎样的人物？请说明他的身份、言行，以及他在故事里的位置。
rubric:
- id: p1
  point: 身份＝西风骑士团的骑士；讨伐风魔龙时他在战场上承担调度，事后又在琴的办公室里向众人汇报情况（丽莎、安柏、优菈等都在场）
  required: true
  any_of:
  - 西风骑士团
  - 骑士
  - 汇报
  - 're: (汇报|报告).{0,12}(情况|众人)'
  - 're: (丽莎|安柏|优菈).{0,12}(在场|都在)'
- id: p2
  point: 他的判断：'恐惧是有传染性的，博士他们提供的故事对部分人很有吸引力。再这样下去，蒙德或许会出现大乱'
  required: true
  any_of:
  - 传染性
  - 大乱
  - 吸引力
  - 're: (恐惧).{0,12}(传染)'
  - 're: (蒙德).{0,14}(大乱|出事)'
- id: p3
  point: 他在战场上的角色＝编队调度：安排增益队注意持续时间、回复队关注众人状态、侦察队关注风龙废墟动向、其余成员小心戒备以防万一
  required: true
  any_of:
  - 增益
  - 回复队
  - 侦察
  - 戒备
  - 're: (增益|回复|侦察).{0,12}(队|注意)'
  - 're: (小心戒备|以防万一)'
- id: p4
  point: 他对可莉的安排：发现来的是可莉时先叫苦（'这下有点麻烦了，琴团长说尽量不要让可莉这样的小孩子参战'），随即安排主角照看这孩子
  required: true
  any_of:
  - 可莉
  - 小孩子
  - 照看
  - 're: (可莉).{0,16}(参战|小孩子|照看)'
  - 're: (旅行者|你来).{0,10}照看'
- id: p5
  point: 他与主角的关系＝并肩作战的同伴（'交给我们吧'、'我来保护大家'），把主角当战友而不是客人
  required: true
  any_of:
  - 并肩
  - 同伴
  - 战友
  - 're: (交给我们吧|我来保护大家)'
  - 're: (同伴|战友|一起).{0,8}(作战|冒险|面对)'
anti_patterns:
- claim: 把他没说过的话算给他（「但这自由，绝非博士所许诺的…」与「我们的守护，是日夜不休的巡逻…」是琴团长的演讲）
  triggers:
  - 're: 凯亚.{0,14}(说|发表|主张).{0,12}(这自由|我们的守护|至高神祇)'
  - 're: (这自由绝非博士|我们的守护，是日夜不休).{0,20}凯亚'
- claim: 把他写成蒙德的叛徒或内应（正文里他是骑士团一方）
  triggers:
  - 凯亚是内应
  - 凯亚背叛了蒙德
  - 他暗中帮助博士
- claim: 断言可莉最终参战并战死／伤亡（正文只写了他把她交给主角照看）
  triggers:
  - 可莉战死
  - 可莉在战斗中伤亡
  - 可莉被派上前线
evidence_pool:
- cid: u03_c19
  quote: 凯亚汇报着情况
  supports:
  - p1
- cid: u03_c19
  quote: 恐惧是有传染性的
  supports:
  - p2
- cid: u02_c12
  quote: 增益队，注意增益的持续时间
  supports:
  - p3
- cid: u02_c12
  quote: 没想到出来的是小可莉呀
  supports:
  - p4
- cid: u02_c12
  quote: 这段时间，旅行者你来照看这孩子怎么样？
  supports:
  - p4
- cid: u02_c12
  quote: 交给我们吧
  supports:
  - p5
grading:
  mode: rubric
  coverage_required: 0.7
  evidence_required: true
  anti_pattern_penalty: true
  exclusion_required: false
notes: ★ 语料面＝`roles/凯亚.md`（19 条，跨第 12、19 章）。★ 他的功能是**把骑士团的组织力落到动作上**：战场上他是调度（增益／回复／侦察／戒备），会议里他是汇报（恐惧有传染性、再这样下去要出大乱）。★ 他的一句'琴团长说尽量不要让可莉这样的小孩子参战'把骑士团的底线写出来了——连参战都按年龄划线，这与博士一方「用恐惧和诱惑扭曲灵魂」的手法恰成对照。★
  归因订正：第19章琴的那段大演讲（「但这自由，绝非博士所许诺的…」与「我们的守护，是日夜不休的巡逻…」）工具输出里曾分到凯亚名下，经查是**琴**说的，已写成 anti_patterns。
annotator: 构造样例（格式验证用，引文均取自原文）
