notes: ★ 「一题一人」的第二张（语料面＝`roles/秦熙.md`，21 条，跨第 7、8、15、16、23 章）。★ 她的功能：**现实侧的官方接口**——第7章由她交代自由派是什么、第14-15章接收主角的通报并给手法定性、第23章通报危机升级并把反击的组织工作接过去。★
  **2026-09-30 修订记录**：初版把「神经认证能识别谎言，却难以界定诱惑」与「我们需要认知疫苗，而不是认知防火墙」算作她的判断——查第15章原文，那两句连同一整段（反对彻查封禁）都是**王明**说的；秦熙在那场讨论里的原话只有「自由派已经开始行动了…把通向地狱的道路包装成乌托邦」这一句（原文写明'秦熙对陈默的信息做出这样的判断'）。据此把她卡片里的两处引文移出、另立
  `o009` 王明，并把「把她没说过的话算给她」写成 anti_patterns。★ 同一处的另一条更正：『免费食物是给流浪汉的、免费医疗要等一年』那番反驳是**主角**的内心吐槽，不是她的话。★ 与 o006 的分工：o006 问故事走向，本题问**她这个人**。
annotator: 构造样例（格式验证用，引文均取自原文）
