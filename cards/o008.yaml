question: 秦熙是个怎样的人物？请说明她的身份、职能，以及她与主角的关系。
rubric:
- id: p1
  point: 身份＝警戒检查中心的负责人（自称'我是秦熙，这里的负责人'，穿防护服、审讯时取下头盔露出年轻而坚毅的脸）；该机构的职能是维护蜂巢内部秩序、阻止战争与恐怖袭击，是快速反应／防疫／控制／指挥中心
  required: true
  any_of:
  - 警戒检查中心
  - 负责人
  - 防护服
  - 维护蜂巢内部秩序
  - 're: (快速反应|防疫|控制|指挥)'
  - 're: (负责人|主管).{0,8}秦熙'
- id: p2
  point: 她向主角交代了自由派是什么：一种不认可巨子蜂巢蓝图的思潮，要建立真正绝对自由的新世界；他们从残缺的历史里找依据（所谓有免费食物、医疗、交通且没有监管的自由国度）；她判断他们近期的行动直指蜂巢的根基，而说服不了他们的原因是历史已被战火埋葬
  required: true
  any_of:
  - 自由派
  - 绝对自由
  - 自由之翼
  - 蜂巢的根基
  - 're: (自由派).{0,20}(思潮|蓝图|不认可)'
  - 're: (历史|资料).{0,16}(埋葬|战火|说服不了|不相信)'
- id: p3
  point: 她与主角的关系＝官方协作：主角把'自由派通过沉浸式游戏在对公民进行诱导'通报上来，她随即邀请实时通信、向他了解具体情况，并把这件事定性为高度潜在威胁、启动对全网络沉浸式游戏项目的审查；她也在主角被怀疑时替他解围
  required: true
  any_of:
  - 实时通信
  - 通报
  - 高度潜在威胁
  - 审查
  - 解围
  - 're: (自由派).{0,16}(诱导|通报|威胁)'
  - 're: (沉浸式游戏).{0,14}(审查|项目)'
- id: p4
  point: 她的立场与口吻：把自由派称作躲在暗处的老鼠，并给出那句一问一答——'太阳要落山了，明天还会升起么？'／'自由派的老鼠们还在暗处…我们还在，太阳明天还会升起'；她还为机构的严厉致歉（'请你谅解我们的职责'）
  required: true
  any_of:
  - 老鼠
  - 太阳
  - 谅解
  - 升
  - 're: (太阳).{0,16}(升起|落山)'
  - 're: (自由派).{0,12}(还在|暗处)'
- id: p5
  point: 她对自由派手法的判断（第15章）＝这次更隐蔽也更致命：借助沉浸式游戏绕开神经认证，把通向地狱的道路包装成乌托邦
  required: true
  any_of:
  - 绕过
  - 乌托邦
  - 地狱
  - 隐蔽
  - 're: (神经认证).{0,12}(绕开|绕过)'
  - 're: (通向地狱|包装成乌托邦)'
- id: p6
  point: 结尾的紧迫与收束：她说'情况比预想的更糟'——自由派利用游戏世界与现实的时间流速差加速渗透、多个沉浸式节点出现异常认知波动；她接过主角的反制模型，决定带他去'见见几位老朋友'、集合力量把这场认知污染彻底清除
  required: true
  any_of:
  - 时间流速差
  - 更糟
  - 集合力量
  - 老朋友
  - 're: (渗透).{0,12}(加速|升级)'
  - 're: (认知污染).{0,14}(清除|彻底)'
- id: p7
  point: 可补充：她与小李的搭档关系——小李称她'秦姐'、当面问她主角是否可能是自由派的探子；她派小李带主角去参观退役的战争机器人
  required: false
  any_of:
  - 小李
  - 秦姐
  - 探子
  - 're: (小李).{0,16}(带领|参观|老兵)'
anti_patterns:
- claim: 把秦熙写成反派／自由派的人（正文里她是对抗自由派一方的官方负责人）
  triggers:
  - 秦熙是自由派
  - 她是自由派的同伙
  - 她是幕后的黑手
  - 秦熙暗中支持自由派
- claim: 断言她主张封禁所有沉浸式游戏（正文里提出'彻查封禁'并当场自我否决的是王明，她本人没有主张封禁）
  triggers:
  - 她主张封禁
  - 她要求彻查并关闭所有游戏
  - 她支持全面封禁
  - 她下令封禁所有游戏
- claim: 把她没说过的话算给她（第15章讨论中的'界定诱惑'与'认知疫苗'属王明）
  triggers:
  - 秦熙提出了认知疫苗
  - 她提出认知疫苗
  - 秦熙认为难以界定诱惑
- claim: 把剧透式结论写成她的判断（例如断言她已经解决了认知污染）
  triggers:
  - 她已经解决了认知污染
  - 她消除了自由派的威胁
  - 她宣布危机结束
