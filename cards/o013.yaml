qid: o013
kind: open
category: 故事含义
unit_ids:
- u01
span: short
inference_layer: 合理假说
question: 第四章「蜂巢社会蓝图」这一章在讲什么？它的含义与它埋下的问题是什么？
rubric:
- id: p1
  point: 本章核心是巨子《如何建设蜂巢社会》的原文：他把旧社会失败的核心矛盾诊断为信息错配——虚假信息切断反馈、蒙蔽眼睛、纵容腐败（'用烂泥巴建立起来的楼阁，地基不稳'）
  required: true
  any_of:
  - 信息错配
  - 反馈
  - 烂泥巴
  - 虚假信息
  - 're: (旧社会|旧时代).{0,16}(矛盾|失败|虚假)'
  - 're: (反馈).{0,14}(蒙蔽|腐败|眼睛|切断)'
- id: p2
  point: 对策＝公开透明的信息网络＋已有的技术手段：用信息共享把反馈重建起来，并动用量子通信（确保传递过程纹丝不动、绝对加密）与神经认证（验证想的和说的是否一致）
  required: true
  any_of:
  - 量子通信
  - 神经认证
  - 公开透明
  - 're: (信息网络|信息共享).{0,16}(公开|透明|重建)'
  - 're: (神经认证).{0,16}(想的和说的|一致)'
- id: p3
  point: 本章取譬于蜜蜂：蜂巢社会的设想直接来自蜜蜂的信息共享（蜜蜂的信息都是公开的、所有蜜蜂都能知道），这就是'蜂巢'这个名字的来处
  required: true
  any_of:
  - 蜜蜂
  - 信息共享
  - 're: (蜜蜂).{0,18}(公开|共享|都能知道)'
  - 're: (蜂巢).{0,12}(来自|取名|设想)'
- id: p4
  point: 本章还交代了制度雏形：基础知识公开、鼓励科技学习发展，而具体核心的军事技术要分级保密、妥善保管
  required: true
  any_of:
  - 分级保密
  - 基础知识
  - 're: (军事技术|核心技术).{0,14}(分级|保密)'
  - 're: (基础知识|科技).{0,12}(公开|鼓励)'
- id: p5
  point: 本章的落点是主角的疑虑（也是全书的第一道追问）：理论看上去美好，但记忆的缺失始终是阴云——'如果，巨子的理论被篡改，那又…'，即文本本身的可信性问题被提出
  required: true
  any_of:
  - 篡改
  - 记忆的缺失
  - 阴云
  - 're: (理论).{0,12}(被篡改|篡改)'
  - 're: (记忆).{0,10}(缺失|空缺)'
- id: p6
  point: 可补充：本章同时给出巨子理论的来路——通俗说理的文风（像《墨子》《毛泽东选集》）、混沌与控制论的见解（来自《工程控制论》），以及《蜂巢的兼爱非攻》等理论标题
  required: false
  any_of:
  - 墨子
  - 工程控制论
  - 3位伟人
  - 三维伟人
  - 're: (兼爱非攻|社会控制论|文明细胞论)'
anti_patterns:
- claim: 把本章的态度写成'完全肯定蜂巢社会'（本章在给出蓝图的同时提出了文本可信性的追问）
  triggers:
  - 这一章完全肯定蜂巢社会
  - 本章没有任何疑虑
  - 他对巨子的理论毫无保留
  - 本章证明蜂巢是完美社会
- claim: 断言本章已揭出篡改的事实（正文里那只是一个假设句）
  triggers:
  - 巨子的理论已经被篡改
  - 本章揭示了理论被篡改
  - 理论确实被改过
