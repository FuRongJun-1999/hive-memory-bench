notes: ★ 逐章含义题的第一张（底稿：`chapters.md` 第 4 章）。★ 为什么这一章值得单独一题：它是全书**唯一整章引用一篇理论原文**的章节——诊断（信息错配）→ 对策（信息网络＋量子通信＋神经认证）→ 取譬（蜜蜂）→ 制度雏形（公开与分级）→
  疑虑（被篡改怎么办）。这一章因此同时是 q024（思想来路）与 q025（技术水位线）的源头，而它自己的落点是那个假设句。★ 判分要点：把'如果被篡改'当成已发生的事实即错。
annotator: 构造样例（格式验证用，引文均取自原文）
