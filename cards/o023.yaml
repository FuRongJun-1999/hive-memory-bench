notes: 逐章含义题（底稿第 9 章）。本章是**第二条线的开门章**：灵境被命名、派蒙出场、风神之谜埋下；主角对它的第一反应是技术性的（这是虚拟现实），而第二次反应是情感性的（下几章）。
