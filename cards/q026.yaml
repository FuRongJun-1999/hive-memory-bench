must_exclude: null
anti_patterns:
- claim: 把主角与巨子读成同一个人（转世／复制体／本人）
  triggers:
  - 主角的前世是巨子
  - 're: (主角|陈默).{0,8}(就是|是|乃).{0,8}巨子.{0,8}(的)?(转世|复制体|本人|化身)'
  - 're: (他们|两人|二者).{0,10}(其实|根本|就)?(是|就是)同一个'
- claim: 把派蒙她们当成普通游戏程序或普通NPC（否认「自由的灵魂」）
  triggers:
  - 她们是普通npc
  - 're: (不过|只|仅|就)是.{0,10}(游戏里的)?(程序|npc)'
  - 're: (派蒙|她们|诺艾尔|小艾尔).{0,14}(没有|无).{0,4}自我意识'
- claim: 把诺艾尔与小艾尔说成两个不同角色／双胞胎
  triggers:
  - 诺艾尔和小艾尔是两个不同的角色
  - 她们是双胞胎
  - 两人毫无关系
