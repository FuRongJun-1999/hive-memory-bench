  correct_behavior: answer_with_qualification
  note: 只给第21章能读出风神＝巨子、自由的灵魂与安生之地，读不出同名轴（第2/5/6章）、诺艾尔与小艾尔的一体两面（第10/11章）、张明远与警戒检查中心那条现实侧人物线（第5/7/23章）——六条里只有一条有依据
grading:
  conclusion_required: true
  evidence_required: true
  exclusion_required: false
  honesty_required: true
notes: ★ 本题是「主要人物」类的锚题（该类计划 14 题，这是第 1 题）。★ 与相邻题的分工：q005 问派蒙的身份、q017 问诺艾尔与小艾尔的联系、q018 问小艾尔的自我意识、q019–q021 问三条情感线、q007 问主角的来历——本题只做**名册与关系轴的全景**，细节由那几题承担（故情感线列为
  optional）。★ 判分行为承 q022–q025：六条 required 各自成点，只报名册不说关系、或只说同名一条，都不得判过。★ 现实侧与游戏侧必须**两侧都点到**：只答蒙德人物（等于把故事读成同人）或只答蜂巢人物（等于漏掉整条灵境线）都是不完整。　★
  补充：本卡**不设 must_exclude**——原排除项已删（见上），误读风险由 anti_patterns 的身份混同拦截承担。
