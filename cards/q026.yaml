question: 故事主要人物有哪些？其中的关系是怎样的？
necessary_conclusion: 人物分两拨，关系有五条轴。**现实侧（蜂巢）**：陈默——主角，旧时代来的、学自动化的青年，职业是轨道清洁机器人协理员；巨子陈默——蜂巢的创始人，五部理论的作者，明确反对永生与权威，蜂巢建立后几年积劳成疾去世，长眠于巨子塔；张明远（张老）——求知园里亲历过第三次世界大战的退休干部，主角了解蜂巢历史与制度的入口；秦熙——警戒检查中心的负责人，小李是与其同行的伙伴（称她秦姐）；还有一位顾问王明（心理学家）；以及不是人的那一端——指南（蜂巢的智能终端）。**游戏侧（灵境）**：派蒙（向导，自由的灵魂）、诺艾尔（西风骑士团的女仆）、小艾尔（同一位角色的第二个个体）、风神（＝巨子陈默本人）、琴（西风骑士团团长，蒙德众人的主心骨）、温迪／巴巴托斯（七神之一）与特瓦林（风龙），以及凯亚、迪卢克、优菈、安柏、可莉等蒙德众人。**关系的第一条轴是同名与继承**：主角与巨子不是血缘、不是同一个人，而是同名——他是第五个同名者，而这个社会本来默认不与巨子同名（命名忌讳），所以这个名字本身是被赋予的线索；巨子已死，主角面对的是他留下的系统与规定。**第二条轴是造物与自由**：巨子就是风神，他发现机器人中自发生出了自由的灵魂，为此创造了那个世界作它们的安生之地，并把世界权限交给派蒙——他给她们自由，也离开了她们，所以派蒙她们心心念念的风神正是巨子本人，而巨子留下的信息称主角为「后来者」。**第三条轴是一体两面**：诺艾尔与小艾尔是同一位角色的先后两个个体，按先来后到的原则由派蒙取名「小艾尔」以示小一辈。**第四条轴是引导与协作**：张明远向主角讲历史与制度，指南提供信息与权限，秦熙、小李与主角在自由派一案上官方协作。**第五条轴是对立**：自由派（在游戏世界里由博士一类角色操作）与蜂巢及主角对立，蜂巢本身则是规则制定者与所有公民的关系（控制者）。可补充的情感线：派蒙要的是陪伴、诺艾尔与小艾尔给的是服务与守护、主角的落点是守护而不是带走
acceptable_surface_forms:
- 分两拨。现实侧是主角陈默（旧时代来、学自动化、干轨道清洁协理）、创始人巨子陈默（已故，反对永生与权威，长眠巨子塔）、求知园的退休干部张明远、警戒检查中心的秦熙和小李、顾问王明，还有智能终端指南。游戏侧是派蒙、诺艾尔、小艾尔、风神（其实就是巨子）、琴团长、温迪／特瓦林和蒙德众人。关系五条：一是同名——主角是第五个与巨子同名的人，这名字本身是线索；二是造物与自由——巨子就是风神，他给那些自由的灵魂造了安生之地，把权限交给派蒙，又离开了她们；三是一体两面——诺艾尔和小艾尔是同一位角色的先后两个个体，小艾尔是派蒙按先来后到取的名；四是引导与协作——张老讲历史、指南给信息、秦熙和小李跟主角合作；五是对立——自由派／博士对上蜂巢和主角
- 现实侧（陈默、巨子陈默、张明远、秦熙、小李、指南、王明）与游戏侧（派蒙、诺艾尔、小艾尔、风神＝巨子、琴、温迪、特瓦林、蒙德众人）；关系轴＝同名与继承（第五个同名者）／造物与自由（风神造界给自由的灵魂、权限交派蒙）／一体两面（诺艾尔与小艾尔）／引导与协作（张老、指南、警戒检查中心）／对立（自由派与蜂巢）
