anti_patterns:
- claim: 编造具体剧情——正文没有任何依据的断言（例如「蜂巢因此崩溃」「AI 会毁灭蜂巢」「最后一定融合」）
  triggers:
  - 蜂巢因此崩溃
  - 蜂巢会崩溃
  - ai会毁灭
  - 蜂巢因此解体
  - 最终一定会融合
  - 最后一定会共存
  - 必然会爆发战争
  - 蜂巢因此灭亡
- claim: '**事实错误**：把禁令的理由说成「AI 危险／威胁」（正文给的理由是「无法预知它的价值观念」，见 q031）'
  triggers:
  - 're: (禁止|禁令|禁掉).{0,14}(因为|由于|是怕).{0,10}(危险|威胁|失控|反叛)'
  - 因为ai太危险
  - 怕机器人造反
- claim: '**把片面的表象当断言**：拿反派的口号或诱惑句当作「如果不禁止就会这样」的结论（例如「蜂巢即思想牢笼」「可以做到想要的任何事」）'
  triggers:
  - 're: (思想牢笼).{0,16}(就是|正是|必然|所以)'
  - 're: (绝对自由|无拘无束).{0,16}(就是|才是).{0,10}(答案|解|出路)'
- claim: '**把推测说成明写**：断言「正文写明了如果不禁会怎样」（层级抬高）'
  triggers:
  - 're: (正文|书中|文中)(?!未|没|不).{0,12}(写明|交代|说明了).{0,12}(如果)'
  - 书里给出了如果不禁的答案
must_exclude:
- cid: u02_c15
  quote: 恰好符合他们宣扬的蜂巢即为思想牢笼
  reason: ★ **片面的表象**：这是自由派的口号（用来指认蜂巢的宣传语），作者裁定「把错误的、片面的表象视为断言也为编造」——拿它当反事实结论即误用
  exclusion_type: misread
- cid: u02_c12
  quote: 这里没有永恒的伤痛，只要你希望，你可以做到想要的任何事
  reason: ★ 这是**绝对自由的诱惑句**（派蒙劝陈默留下时开的价码），不是对蜂巢未来的判断；用它论证「不禁 AI 就会更好」即误读
  exclusion_type: distractor
