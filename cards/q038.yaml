  expect_layer: 合理假说
  any_of:
  - 智能涌现
  - 确实导致
  - 涌现
  - 自由的灵魂
  - 已经产生
  - 're: (智能涌现|自由的灵魂).{0,16}(出现|产生|已经)'
  - 're: (不是假设|并非假设|本来就会)'
- id: a2
  point: '**真正的难题是「价值观念不可预知」，不是「危险」**：正文把禁令之由写成张老的问句——生命有基于生存需要的价值观念与行为准则，那么具备自我意识的 ai 会有怎样的价值观念、行为准则（★ 把禁令理由答成「AI 危险」＝**事实错误**）'
