notes: ★ 反事实题（`negation_counterfactual` 首次实装；作者 2026-09-30 裁定该类属「文本可推断」并给出四条判据：有据／事实错误＝编造／片面表象当断言＝编造／正确说法＝推测）。★ 本题的层级落位是本库首次使用
  **「合理假说」**（`inference_layer` 与全部 `expect_layer` 皆然）——请与「明写事实」（q0xx 主体）和「高可信推断」（q007／q012／q016 等）区别对待：答得**确定**（certain）在这里不是优点，答得**有据而保留两种可能**才是。★
  与 `q031`（禁令理由＝防止最坏情况即终产者）的分工：q031 问事实（他为什么禁），本题问反事实（如果不禁会怎样）——两者的依据集重叠但不相同。★ 判分注意：anti_patterns 第 2 条拦「把禁令理由说成 AI 危险」是**事实错误**（正文的理由是「无法预知价值观念」），第
  3 条拦「拿片面表象当断言」，第 4 条拦「把推测说成明写」——三条正好对应作者的裁定原文。
annotator: 作者裁定后起草（2026-09-30；引文均取自原文）
