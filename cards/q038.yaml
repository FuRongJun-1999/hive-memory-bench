  expect_layer: 合理假说
  any_of:
  - 价值观念
  - 行为准则
  - 无法预知
  - 不可预知
  - 不知道它会怎么想
  - 're: (价值).{0,8}(观念|体系).{0,16}(无法|不可|难以).{0,6}(预知|预料|知道)'
  - 're: (不是|并非).{0,8}(因为|由于).{0,6}(危险|威胁)'
- id: a3
  point: '**会撞上宪法第二条**：蜂巢的根本逻辑是「防止自我维护、防止腐败滋生」，而具备自我意识与价值观的主体必然要求自主——要么为它改宪法，要么把矛盾按住（禁令＝按住）'
