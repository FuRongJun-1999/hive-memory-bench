qid: o052
kind: open
category: 故事时间
unit_ids:
- u02
- u03
span: long
inference_layer: 高可信推断
question: 时间线题：蒙德这条线的时间是怎么走的？请按先后讲清它从接风到告别的顺序。
rubric:
- id: p1
  point: 入局的第一段：主角初次进入后由西风骑士团备下接风宴、获颁荣誉骑士称号与报酬，博士随即提出新方案——这一段是接纳与诱惑同时发生
  required: true
  any_of:
  - 接风宴
  - 荣誉骑士
  - 're: (接风宴|荣誉骑士).{0,16}(报酬|称号)'
- id: p2
  point: 接着是战斗：队伍在风龙废墟讨伐风魔龙（特瓦林），琴分配编队、温迪与特瓦林对话点出自由的主题
  required: true
  any_of:
  - 风龙废墟
  - 特瓦林
  - 编队
  - 're: (讨伐|风魔龙).{0,16}(废墟|特瓦林)'
- id: p3
  point: 然后是渗透被看见与击退：自由派借商人与诗人的故事渗透（把绝对自由包装成乌托邦），博士与富人将安全与绝对自由和永生绑定设下陷阱，骑士团与蒙德居民把阴谋击退
  required: true
  any_of:
  - 陷阱
  - 击退
  - 're: (博士|富人).{0,16}(陷阱|绑定)'
- id: p4
  point: 再往后是**时间跳跃的推演**：琴团长去世之后西风骑士团的改变尤为明显（老兵被取代、维护平民权益的政策被废除、后辈继承父辈荣耀、商人崛起）——这一段不是当下发生，是加速推演出的后续
  required: true
  any_of:
  - 推演
  - 琴团长去世
  - 're: (时间跳跃|加速推演|推演).{0,16}(后续|之后)'
- id: p5
  point: 最后是告别与返回：主角在摘星崖与她们道别、答应还会再来，随后回到舱室并联系警戒检查中心——游戏内的一整段旅程在现实里只对应很短的时间
  required: true
  any_of:
  - 告别
  - 回到舱室
  - 're: (摘星崖|告别).{0,18}(舱室|回来)'
anti_patterns:
- claim: 把推演出的后续当成已经发生（琴之后那一幕是加速推演）
  triggers:
  - 're: (琴|骑士团).{0,12}(已经|当下).{0,10}(去世|变质)'
- claim: 把蒙德线写成按现实时间同步展开（两个世界存在时间流速差）
  triggers:
  - 're: (蒙德|游戏).{0,14}(与现实|同步).{0,8}(同时|一致)'
evidence_pool:
- cid: u02_c11
  quote: 这是西风骑士团为你们准备的接风宴
  supports:
  - p1
- cid: u02_c12
  quote: 讨伐风魔龙的队伍来到风龙废墟
  supports:
  - p2
- cid: u03_c19
  quote: 他们将安全与绝对自由和永生绑定
  supports:
  - p3
- cid: u03_c22
  quote: 西风骑士团的改变在琴团长去世之后尤为明显
  supports:
  - p4
- cid: u03_c23
  quote: 摘星崖上带着花香的清风
  supports:
  - p5
grading:
  mode: rubric
  coverage_required: 0.7
  evidence_required: true
  anti_pattern_penalty: true
  exclusion_required: false
notes: 时间线题。这条线的时序要点是**最后一段是推演**：接风→讨伐→渗透与击退→推演到琴之后→告别返回；把推演读成既定事实是本题最典型的错法。
annotator: 构造样例（逐章含义；引文均取自原文）
