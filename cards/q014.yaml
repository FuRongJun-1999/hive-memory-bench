question: 蜂巢宪法由谁来维护和修订？
necessary_conclusion: 维护者是指南，修订者是公民。宪法的存在方式很特别——它只在指南回答时被引用，全书没有立法机关、也没有任何修订程序被描述；而指南被写定的职责里明写「维护公民认同最小化剥削和压迫的共识」，即共识的成立条件是公民认同，不是权威宣布。共识分为根本原则与「根据不同情况」的细则两层，可修订的正是细则层——它靠持续微调维持（调整资源分配算法、完善风险预案、修订凝聚共识的细则，一遍遍地微调），驱动力来自公民的真实反馈与真诚自愿的授权。至于根本原则本身，语料未给任何修订程序，它靠公民认同维持——这也符合宪法自己的原则：它同样不允许被某个权威自我维护
acceptable_surface_forms:
- 维护的是指南，修订的是公民。宪法只在指南答话时出现，没有立法机关也没有修订程序；指南的职责里就写着维护'公民认同'的那套共识。可改的是细则那一层，靠公民的真实反馈和授权驱动持续微调，根本原则那层没给改动程序
- 指南承载并维护宪法，公民以反馈与授权修订细则；根本原则靠公民认同立着，没人能替它做主
