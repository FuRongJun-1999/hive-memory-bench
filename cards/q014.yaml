notes: 跨 u01（第1、2、3章）与 u02（第16章）。★ 本题是全组的顶层：基层（机器人）由公民动手维护（q010/q012），信息与政策由反馈＋授权维护（q013），而宪法层——维护者是指南（职责含'维护公民认同…的共识'），修订发生在细则层且由公民驱动。注意「宪法只在第2章以被引用方式出现」本身就是一条证据：没有立法机关、没有修订程序。
