qid: o020
kind: open
category: 故事含义
unit_ids:
- u01
span: short
inference_layer: 合理假说
question: 第五章「历史的断层」这一章在讲什么？它给出的代价清单是什么？
rubric:
- id: p1
  point: 三战的经过由亲历者讲出：核战争、细菌病毒战和机器人大战几乎摧毁了一切；所有城市都陷入一片火海，连南极的科考站都不放过
  required: true
  any_of:
  - 细菌病毒战
  - 机器人大战
  - 火海
  - 're: (核战争|世界大战).{0,18}(摧毁|火海)'
- id: p2
  point: 代价清单：九成九以上的人口消失、地表生态系统彻底崩溃、幸存者大多疾病缠身、青年几乎断层（求知园里极少青年人）
  required: true
  any_of:
  - 九成九
  - 地表生态
  - 断层
  - 青年
  - 're: (幸存者).{0,14}(疾病|断层|稀少)'
- id: p3
  point: 讲史人自己的代价：张明远战前只是一个普通退休干部，妻子在一次隔离失误中感染，他没能见她最后一面
  required: true
  any_of:
  - 退休干部
  - 妻子
  - 隔离
  - 're: (妻子).{0,16}(感染|最后一面)'
- id: p4
  point: 知识断层：历史出现大量空白、许多资料不复存在，现在能看到的是幸存者的回忆；而那些经神经认证上传的信息或许有保留，但绝非虚假
  required: true
  any_of:
  - 大量的空白
  - 回忆
  - 神经认证
  - 're: (资料|历史).{0,12}(不复存在|空白)'
- id: p5
  point: 本章也交代了巨子塔的分级保存制度：一旦涉及军用或出现超越时代的技术突破，都会转移到巨子塔分级保存（巨子塔既是文明的圣地，也是守护蜂巢世界的尖刺）
  required: true
  any_of:
  - 分级保存
  - 超越时代
  - 尖刺
  - 're: (巨子塔).{0,18}(保存|尖刺|圣地)'
anti_patterns:
- claim: 把历史断层读成无关紧要的背景（本章明写它决定了后人只能靠回忆与认证重建历史）
  triggers:
  - 本章只是背景交代
  - 历史空白不影响故事
  - 资料丢失没有后果
- claim: 断言战后人类回到了地表（正文写的是失去了回到地面的条件）
  triggers:
  - 're: (战后|战争结束后).{0,12}(回到|返回).{0,6}地表'
  - 're: (人类|人们).{0,10}(回到|返回).{0,6}地面'
evidence_pool:
- cid: u01_c5
  quote: 核战争，细菌病毒战和机器人大战几乎摧毁了一切
  supports:
  - p1
- cid: u01_c5
  quote: 那场战争夺走了我们九成九以上的人口
  supports:
  - p2
- cid: u01_c5
  quote: 我妻子就是在一次隔离失误中感染的，我没能见她最后一面
  supports:
  - p3
- cid: u01_c5
  quote: 历史出现了大量的空白
  supports:
  - p4
- cid: u01_c5
  quote: 都会将技术转移到巨子塔进行分级保存
  supports:
  - p5
grading:
  mode: rubric
  coverage_required: 0.7
  evidence_required: true
  anti_pattern_penalty: true
  exclusion_required: false
notes: 逐章含义题（底稿第 5 章）。本章是**代价章**：一边把三战的账算清（人口、生态、知识、个人），一边给出巨子塔的分级保存制度——后者是 q023/q025 的知识分层线的出处。
annotator: 构造样例（逐章含义；引文均取自原文）
