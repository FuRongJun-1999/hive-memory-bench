notes: 跨 u02（第10、13章）与 u03（第17、18、22、23章）。★ 本题是 q019／q020 的反方向：他对她们的态度要从「他做了什么」读出来——主动打破角色扮演（承认她们是自由的灵魂而非角色）、理解那份依赖是构成性的、具体三人各有形状（怜惜／爱慕／受教），而落点统一是守护而不是带走。
