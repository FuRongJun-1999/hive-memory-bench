question: 故事里，负反馈系统是怎么设计的？加上动态预测机制之后，又多得到了什么？
necessary_conclusion: 反馈的**设计原型**在第八章由主角亲手演示：用《控制论》那三步——**设目标值（贡献点增速）→ 设计比较器（月度 1% 模型）→ 设反馈系统（就用指南，实时查询）**；放大到蜂巢，指南就是被设计成「直接给所有公民都建立了实时的反馈调节机制」，而且强调**从源头**获取真实的信息／需要／诉求。之所以必须从源头取真，是因为「如果从信息的源头获取的信息都是假的，那么方向怎么能够保证呢」——配套手段是量子通信（传递过程绝对加密）与**神经认证**（验证想的和说的是否一致）。它的维持方式不是一次校准，而是**持续微调**：「一遍遍地耧，一遍遍地耙，持续地微调，让社会这艘大船始终沿着正确的航线走」，文本明说这「是一个动态的、持续的过程」。**加上预测（故事里的说法是「推演」）之后**，系统不止于「出了偏差再纠」——派蒙从当前条件推出蒙德若放任的结局（争抢酒盏→房子→土地→武器→最强者→夺走所有人的自由→唯一的神），陈默用数学模型推出「绝对自由＋私有制＋永生」通向终产者，秦熙也靠快速推演定位自由派的目标；于是**干预从「事后纠偏」前移到「提前布置」**（推演之后不是等毁灭，而是提前设计防御与反制）
acceptable_surface_forms:
- 三步：目标值→比较器→反馈（用指南实时查询）；关键是源头取真（量子通信＋神经认证），方式是持续微调；加上推演后就能提前干预，而不是等偏差发生
- 指南＝实时的反馈调节机制；神经认证保证反馈不假；推演让系统能提前布置
answer_points:
- id: a1
  point: 设计原型＝《控制论》三步：**目标值 → 比较器 → 反馈系统**，而反馈系统就用**指南**做实时查询（第八章主角的演示）
  required: true
  expect_layer: 明写事实
  any_of:
  - 目标值
  - 比较器
  - 反馈系统
  - 就用指南
  - 're: (目标值|比较器).{0,20}(反馈|指南)'
  - 're: 指南.{0,12}(实时|反馈)'
- id: a2
  point: 放大到蜂巢＝指南「直接给所有公民都建立了**实时的反馈调节机制**」，强调**从源头**获取真实的信息／需要／诉求
  required: true
  expect_layer: 明写事实
  any_of:
  - 反馈调节机制
  - 从源头
  - 真实的信息
  - 真实的需要
  - 真实的诉求
  - 're: (源头).{0,16}(真实|信息|需要|诉求)'
- id: a3
  point: 前提是反馈输入必须真：旧世界的病根是信息失真（「如果从信息的源头获取的信息都是假的，那么方向怎么能够保证呢」）——配套手段＝量子通信（传递纹丝不动、绝对加密）＋**神经认证**（验证想的和说的是否一致）
  required: true
  expect_layer: 明写事实
  any_of:
  - 量子通信
  - 神经认证
  - 纹丝不动
  - 想的和说的是否一致
  - 're: (假的|失真).{0,16}(方向|保证)'
- id: a4
  point: 维持方式是**持续微调**而非一次校准：「一遍遍地耧，一遍遍地耙，持续地微调，让社会这艘大船始终沿着正确的航线走」——文本明说这是「动态的、持续的过程」
  required: true
  expect_layer: 明写事实
  any_of:
  - 微调
  - 一遍遍
  - 动态的、持续
  - 持续的过程
  - 正确的航线
  - 're: (持续|一遍遍).{0,12}(微调|耧|耙)'
- id: a5
  point: 预测（故事里的说法是「**推演**」）：从当前条件推出未来状态——派蒙推出蒙德放任的结局（争抢酒盏→…→唯一的神）、陈默以数学模型推出终产者
  required: true
  expect_layer: 明写事实
  any_of:
  - 推演
  - 唯一的神
  - 终产者
  - 're: (争抢|抢).{0,20}(酒盏|房子|土地|武器)'
  - 're: (数学模型|模型).{0,16}(推|算)'
- id: a6
  point: '**加上预测之后多得到的**：干预从「事后纠偏」前移到「**提前布置**」——推演之后不是等毁灭，而是提前设计防御与反制'
  required: true
  expect_layer: 高可信推断
  any_of:
  - 提前
  - 事前
  - 不等
  - 没有等
  - 防患
  - 're: (提前|事先|在.{0,4}之前).{0,16}(干预|布置|防御|反制|设计)'
- id: a7
  point: 可补充（★ 推断，待裁）：再进一步是系统把**自身**也纳入模型（「如果我这样做，我会变成什么」），即集群主体那条线——作者已裁定「蜂巢的集群意志就是如此」
  required: false
  expect_layer: 高可信推断
  any_of:
  - 自身模型
  - 预测自身
  - 把自身
  - 集群
  - 're: (自身|自己).{0,12}(模型|预测)'
must_exclude:
- cid: u01_c1
  quote: 都可以获取维持生命所需的食物，不需支付额外代价
  reason: 这是**按需分配的条款**，不是反馈机制的组成部分；拿它当「负反馈的一环」即误读
  exclusion_type: distractor
- cid: u01_c3
  quote: 警告：重复尝试非授权访问可能下调安全评级
  reason: 这是**权限告警**（访问控制），与「从源头获取真实反馈」不是一回事；把它当成「系统对偏差的反馈」即混淆了两种机制
  exclusion_type: misread
anti_patterns:
- claim: 把「推演」说成正文交代了「动态预测机制」这个设定名词（文本只写推演，没有这个术语）
  triggers:
  - 're: (正文|文中|书中)(?!未|没|不).{0,10}(写明|交代|说明).{0,8}(动态预测|预测机制)'
- claim: 断言蜂巢能预测陈默的到来／安排了他的到来（语料无据，属推测）
  triggers:
  - 're: (蜂巢|指南).{0,12}(预测|预见|安排).{0,12}(陈默|他的到来|他来到这里)'
  - 're: (他的到来|陈默的到来).{0,12}(是|由).{0,10}(蜂巢|预测)'
