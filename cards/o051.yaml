  supports:
  - p5
grading:
  mode: rubric
  coverage_required: 0.7
  evidence_required: true
  anti_pattern_penalty: true
  exclusion_required: false
notes: 时间线题（作者口径：故事时间做成时间线因果题）。三条时间轴要分清：**现实（2045）／巨子的一生／主角的秒级记录**，再叠上游戏世界的时间差——这也解释了为什么自由派能用「沉浸式体验」赚时间。
annotator: 构造样例（逐章含义；引文均取自原文）
