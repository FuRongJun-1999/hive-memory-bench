qid: o051
kind: open
category: 故事时间
unit_ids:
- u01
- u03
span: long
inference_layer: 高可信推断
question: 时间线题：这个故事的时间坐标是怎么定的？请把它与旧时代、与游戏世界的时间关系讲清楚。
rubric:
- id: p1
  point: 现实侧的现在有明确年份：指南的开场介绍就写着「现在是2045年」——而旧时代就是主角来的那个时代，两者之间只隔一场第三次世界大战
  required: true
  any_of:
  - 2045年
  - 旧时代
  - 're: (现在是2045年|2045).{0,10}(年)'
- id: p2
  point: 战争的时间被亲历者锚定：张明远说那时他还只是一个普通退休干部，主角问起世界大战他完全没有印象——而二十年前的社会仍有学历与外卖、保安那类旧秩序
  required: true
  any_of:
  - 退休干部
  - 二十年前
  - 're: (20年前|二十年前).{0,14}(学历|外卖|保安|保密)'
- id: p3
  point: 巨子的一生构成另一条时间轴：他重建人类秩序、彻底反对永生与权威、发现机器人中产生自由的灵魂并为它们造了那个世界，最后的落点是蜂巢建立后几年积劳成疾去世
  required: true
  any_of:
  - 我的一生只做了两件事
  - 积劳成疾
  - 're: (建立后几年|几年).{0,14}(去世|病故)'
- id: p4
  point: 主角个人的时间被精确到秒：记录写着成员陈默于 2045 年 9 月 1 日 17 时 41 分 05 秒进入巨子塔；而蜂巢里「一天的变化，或许就仅仅是太阳升起，又落下」——这里的日常已不按日期运转
  required: true
  any_of:
  - 2045年9月1日
  - 太阳升起
  - 're: (不按日期|太阳升起).{0,16}(一天|日子)'
- id: p5
  point: 两个世界的时间不同速：自由派正是利用游戏世界与现实的时间流速差加速渗透；而主角离开游戏回到舱室时，那边的温暖与离别「仿佛一场过于真实的梦境」——时间差也是叙事装置
  required: true
  any_of:
  - 时间流速差
  - 梦境
  - 're: (时间流速|流速差).{0,16}(渗透|差)'
anti_patterns:
- claim: 把 2045 年当成遥远的未来（旧时代＝主角来的那个时代，两者只隔一场大战）
  triggers:
  - 're: 2045.{0,12}(遥远|几百年|世纪)'
- claim: 断言游戏世界与现实同一流速（正文写明存在时间流速差，且被自由派利用）
  triggers:
  - 're: (游戏世界|灵境).{0,14}(同一|一样).{0,6}流速'
evidence_pool:
- cid: u01_c1
  quote: 现在是2045年
  supports:
