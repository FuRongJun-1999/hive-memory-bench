span: long
inference_layer: 高可信推断
question: 张明远（张老）是个怎样的人物？请说明他的身份、立场，以及他在这部作品里的作用。
rubric:
- id: p1
  point: 身份＝第三次世界大战的幸存者，战前只是一个普通退休干部（不是巨子的战友或创始团队成员）；他的个人代价写得很实——妻子在一次隔离失误中感染，他没能见她最后一面 ⇒ 他本人就是这部作品的历史来源
  required: true
  any_of:
  - 幸存者
  - 退休干部
  - 妻子
  - 隔离
  - 're: (妻子).{0,16}(感染|没能见|最后一面)'
  - 're: (普通|只是).{0,8}退休干部'
- id: p2
  point: 他的位置与作用＝求知园里给年轻人讲《工程控制论》与蜂巢制度的人（他自陈'不学控制论怎么搞技术'），是主角了解历史、经济与权限制度的入口；他也是'第五个'的见证者
  required: true
  any_of:
  - 求知园
  - 工程控制论
  - 第五个
  - 讲解
  - 入口
  - 're: (控制论).{0,12}(讲|学|交流)'
  - 're: (老人|前辈).{0,10}(讲解|指点|告诉)'
- id: p3
  point: 他讲的历史：三战由核战争、细菌病毒战与机器人大战构成；战时靠机器人部队探索物资；战后因失去回到地面的条件而把军用技术民用化（机器人是真正的建设者）；历史的资料大量空白，现存的只剩幸存者经神经认证上传的回忆
  required: true
  any_of:
  - 细菌病毒战
  - 机器人大战
  - 民用化
  - 神经认证
  - 资料
  - 're: (历史).{0,12}(空白|不复存在|缺失)'
  - 're: (机器人).{0,14}(建设者|探索|物资)'
- id: p4
  point: 他讲的制度：巨子设计的经济系统以按需分配托底、个性化需求靠贡献点；权限按贡献的百分比分级（1 级到 5 级）；贡献点要靠公民评估认可（不只是投票，需要真诚授权）；核心技术、军事技术属于 5 级权限或分级保存
  required: true
  any_of:
  - 按需分配
  - 贡献点
  - 5级
  - 百分比
  - 评估认可
  - 're: (权限).{0,14}(分级|百分比|5级)'
  - 're: (军事技术|核心技术).{0,14}(分级|保密|5级)'
- id: p5
  point: 他的立场：当众用贡献点对《永生技术原理》投否定票（★ 2026-09-30 标注纠错：说「这叛徒还想重新拿到授权」的是**胖老人**、不是他；张老的动作是随后「用一点贡献点投向了否定」）；对年轻人的断层有忧虑（'世界终归是属于年轻人的'）；谈及主角的身份时只给推测——'可能是你和巨子有关系'，并自陈'我的猜测不一定正确'
  required: true
  any_of:
  - 否定
  - 周清源
  - 年轻人
  - 猜测
  - 're: (永生技术原理|提案).{0,14}(否定|投|反对)'
  - 're: (猜测|不一定正确).{0,12}(关系|身份|巨子)?'
- id: p6
  point: 可补充：他对 AI 的判断——把'和真人一般的 NPC'与'普通按知识库台词回答'区分开（'有时候确实是有人会把他们混为一谈'）；并交代有自我意识的 AI 在蜂巢初建后不久就被禁止，且点出禁止的逻辑：生命有维持生存的需要，会由此长出一整套价值观念与行为准则
  required: false
  any_of:
  - 知识库
  - 禁止
  - 价值观念
  - 行为准则
  - 're: (有自我意识的ai|自我意识的ai).{0,16}(禁止|已禁)'
  - 're: (生命).{0,14}(维持生存|需要).{0,14}(价值观念|行为准则)'
anti_patterns:
- claim: 断言张明远是巨子的战友／创始团队成员（正文里他自陈只是战前的普通退休干部，巨子的同伴牺牲在战争与重建里）
  triggers:
  - 他是巨子的战友
  - 他是巨子的同志
  - 他参与了蜂巢的创建
  - 他是创始团队的一员
  - 他和巨子并肩
- claim: 断言他支持永生技术／赞成《永生技术原理》（正文相反：他当众投否定并称提案者为叛徒）
  triggers:
  - 他支持永生
  - 他赞成永生技术
  - 他投票支持永生技术原理
  - 他为周清源辩护
- claim: 把他对主角身份的推测写成已证实的结论（他明说'我的猜测不一定正确'）
  triggers:
  - 他确认主角与巨子的关系
  - 他证明了主角是
  - 他断定主角就是
- claim: 把「这叛徒还想重新拿到授权」算成张老的话（正文里是**胖老人**大叫；张老的动作是随后的「用一点贡献点投向了否定」）
  triggers:
  - 张老称他为叛徒
  - 张老骂他是叛徒
  - 张老说他是叛徒
  - 张老认为他是叛徒
  - 张老斥其为叛徒
