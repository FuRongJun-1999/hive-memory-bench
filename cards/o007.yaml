notes: ★ 「主要人物」类第一张按作者口径做的卡：**语料面＝该角色的完整对话**（`roles/张明远.md`，18 条，跨第 5、6、16 章）。★ 为什么这个角色值得一题：他是现实侧唯一的**历史口述者**——三战的经过、机器人民用化、贡献点与权限制度、AI
  被禁的理由，全部由他讲出；同时他是'第五个'的见证人，且对主角身份只给推测（这一条是本题的诚实线）。★ 归因工具（`roles.py`）是启发式：短问句有串行，长段实质内容可靠；卡片引文已逐条回原文核对。★ 与 q026 的分工：q026
  问名册与关系轴，本题问**单个人物的身份／立场／作用**（一题一人）。
