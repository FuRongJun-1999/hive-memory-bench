notes: ★ 本题是「故事结局」类的锚题（该类计划 4 题），也是开放题里第一道**有明确推断方向**的题。作者 2026-09-30 点明：这是开放问题，但作者已有答案。★ 设计口径：全文确实没写结局，但**最后一章把行动纲领写全了**——先答方向（反击＋认知疫苗＋接着解未竟的问题＋给自由的灵魂位置＋不成为新的权威），再守住诚实线（不编具体情节）。五条
  required 里，p4（自由的灵魂的位置）与 p5（不成为新权威）最容易被漏，也最能区分「读完了故事」与「读了个大概」。★ 与相邻题的分工：q022 问灵境这一节批判什么（自由为何物）、q023 问蜂巢路线的矛盾、q028 问主要事件、o003
  问两种自由观——本题问**这些线索把故事推向哪里**。★ 判分行为：开放题按 rubric 覆盖率（≥0.7）＋依据＋禁编造三判据。
