qid: o006
kind: open
inference_layer: 高可信推断
category: 故事结局
unit_ids:
- u01
- u02
- u03
span: long
question: 故事将会走向什么结局？
rubric:
- id: p1
  point: 终点定在「反击」而不是收束：他带着蒙德得来的答案回去（自由不是无拘无束，而是共同守护的秩序），交出反制模型，秦熙则说该集合力量、把这场认知污染彻底清除 ⇒ 从防御转入反击；而危机同时还在升级（自由派利用游戏世界与现实的时间流速差加速渗透）
  required: true
  any_of:
  - 反击
  - 认知污染
  - 集合力量
  - 共同守护的秩序
  - 时间流速
  - 're: (蒙德).{0,10}(给了|交出|答案)'
  - 're: (认知污染).{0,16}(清除|反击|升级)'
- id: p2
  point: 反制的手段是「认知疫苗」而不是「认知防火墙」：用共同守护的故事对抗恐惧、用真实的历史和协作的成果揭穿谎言、用公平的规则和集体的力量抵御垄断——不是封禁，也不是否定人们对美好生活的向往
  required: true
  any_of:
  - 认知疫苗
  - 疫苗
  - 共同守护的故事
  - 真实的历史
  - 集体的力量
  - 're: (疫苗|不封禁|不是封禁).{0,16}(防火墙|封禁|清除)'
  - 're: (揭穿|拆穿).{0,10}谎言'
- id: p3
  point: 要接着解那个未竟的问题：巨子交出去的是「一个没有剥削没有压迫，按需分配，每个人都获得自由的世界究竟该怎么建造」；蒙德给出的地基是「按需分配不是施舍」＋「自由不是为所欲为，而是有能力守护珍视的一切」（自由＝选择的权利＋责任）
  required: true
  any_of:
  - 按需分配不是施舍
  - 未竟
  - 后来人
  - 选择的权利
  - 're: (按需分配).{0,12}(施舍|不是)'
  - 're: (自由).{0,14}(不是为所欲为|选择的权利|守护珍视)'
- id: p4
  point: 自由的灵魂必须有位置：他出发时就立下「为派蒙这样的自由灵魂争取希望」这个目标；巨子说她们是「骄傲，也是遗憾」，而他判断「派蒙她们就是这个问题的解」⇒ 结局方向包含让她们从被禁者变成答案（他答应过还会再来），即蜂巢要学会与自己造出的自由灵魂共存
  required: true
  any_of:
  - 自由的灵魂
  - 争取希望
  - 骄傲
  - 遗憾
  - 're: (派蒙|她们).{0,16}(答案|解|位置|接纳)'
  - 're: (还会再来|再一起冒险|承诺)'
- id: p5
  point: 主角的落点不是成为新的巨子／王者：他继承的是记忆与问题，不是权威（我不该成为他们的束缚／反权威／宪法不许自我维护），而模拟里琴之后的变质正说明守护不能系于个人 ⇒ 形态是**制度化的守护**（人人都成为守护者），而不是再造一个救主
  required: true
  any_of:
  - 不是新的巨子
  - 制度化
  - 守护者
  - 束缚
  - 're: (不成为|不是|不该成为).{0,10}(新的)?(巨子|王者|权威|救主)'
  - 're: (守护).{0,12}(不能系于|不系于|人人|每一个人)'
- id: p6
  point: 可补充：两个世界的边界要重写——灵境本是巨子给自由灵魂造的家，接纳她们就意味着「谁算公民」「游戏世界与现实世界的关系」都得重新定义
  required: false
  any_of:
  - 边界
  - 公民
  - 安生之地
  - 两个世界
  - 're: (谁算|谁是).{0,6}公民'
- id: p7
  point: 可补充（诚实线）：结局尚未写出——以上是从结尾的行动纲领与三条线的逻辑推出的**方向**，不是已发生的情节；任何具体结局（谁死谁活、谁牺牲、谁当权）都属于编造
  required: false
  any_of:
  - 方向
  - 尚未写出
  - 没有写结局
  - 留白
  - 're: (结局).{0,10}(没有写|未写|未成文|还没)'
  - 're: (推不出|不该编|不能编).{0,10}(具体情节|谁死谁活)'
anti_patterns:
- claim: 断言主角最终成为新的巨子／王者／唯一领袖（与被批判的王者叙事同型）
  triggers:
  - 主角成为了新的巨子
  - 他最终成为新的王
  - 他成为蜂巢的领袖
  - 他登上了神座
  - 他成为了唯一的神
  - 他接任巨子之位
- claim: 断言结局是清除自由派后一切恢复原状／和平收尾
  triggers:
  - 消灭自由派后恢复原状
  - 清除自由派就回到从前
  - 一切回到原来的样子
  - 危机解除后世界如初
  - 从此天下太平
- claim: 断言他放弃回去／留在蒙德（与第23章的抉择相反）
  triggers:
  - 他留在了蒙德
  - 他放弃了回去
  - 他选择留在游戏世界
  - 他不再回蜂巢
  - 他永远留在了提瓦特
- claim: 断言自由的灵魂被删除／关闭／清除（与「争取希望」这条线相反）
  triggers:
  - 派蒙被删除
  - 自由的灵魂被清除
  - 她们被销毁
  - 她们被关闭
  - 她们被格式化
- claim: 断言蜂巢世界被自由派推翻／毁灭
  triggers:
  - 蜂巢被推翻
  - 蜂巢世界毁灭
  - 蜂巢最终崩溃
  - 自由派毁灭了蜂巢
