question: 在灵境（原神游戏）中，诺艾尔和小艾尔之间是什么联系？
necessary_conclusion: 她们是同一位角色的两个个体：诺艾尔是这个游戏世界里原本就有的那一位，小艾尔是主角后来通过祈愿召唤来的同一位诺艾尔——按先来后到的原则，派蒙提议把后来者叫「小艾尔」以示小一辈，她本人很快接受了这个称呼，而原本那位诺艾尔想说什么却只是别过头去。所以两人的联系是同一角色的先后两个个体（因此长相、身份、性情一致），靠「小艾尔」这个称呼区分长幼；此后她们几乎总是一同出现：并肩守卫、一起商量同一件事，甚至一起写了同类的信
acceptable_surface_forms:
- 是同一个人的先后两只：诺艾尔是原本就有的，小艾尔是后来祈愿召唤来的同一位，派蒙按先来后到把后来的叫小艾尔。她们常一起出现、并肩作战
- 同一位角色的两个个体，靠称呼分长幼——原本的叫诺艾尔，后来召唤的叫小艾尔
